const socket=io();
let code='', playerTeam='', playerName='', role='', gameType='', familyMode='', lastState=null, guessState=null, soundOn=true, audioCtx=null;
const app=document.getElementById('app');
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function toast(m){let t=$('toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';document.body.appendChild(t)}t.textContent=m;t.classList.add('show');clearTimeout(window._toast);window._toast=setTimeout(()=>t.classList.remove('show'),2300)}
function tone(freq=440,d=.14,type='sine',gain=.12){if(!soundOn)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(gain,audioCtx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d+.02)}catch(e){}}
function toggleSound(){soundOn=!soundOn;toast(soundOn?'🔊 الصوت مفعّل':'🔇 الصوت مكتوم');if(soundOn)tone(660,.1,'triangle')}
function logo(){return `<div class="brand"><div class="mark">⚔️</div><div><div>الساحة</div><div class="muted" style="font-size:11px">ARENA • PARTY GAMES</div></div></div>`}
function modal(h){closeModal();const m=document.createElement('div');m.id='modal';m.className='modal';m.innerHTML=`<div class="modalBox">${h}</div>`;document.body.appendChild(m)}
function closeModal(){$('modal')?.remove()}
function home(){app.innerHTML=`<div class="arenaHome">
<div class="arenaTop"><div class="arenaBrand"><div class="arenaMark">⚔️</div><div><div class="arenaTitle">الساحة</div><div class="arenaSub">منصة ألعاب جماعية تنافسية</div></div></div><button class="btn dark" onclick="toggleSound()">🔊 الصوت</button></div>
<section class="arenaHero"><div class="arenaEyebrow">🎮 PLAY • COMPETE • WIN</div><h1>كل ألعابكم<br><span>في ساحة واحدة</span></h1><p>غرف خاصة، منافسة مباشرة، نقاط وجولات — اختاروا اللعبة وابدأوا.</p><div class="arenaHeroActions"><button class="btn red" onclick="showJoin()">🎮 دخول غرفة</button></div></section>
<section class="gamesSection"><div class="sectionHead"><div><div class="sectionKicker">GAME HUB</div><h2>اختر لعبتك</h2></div><span class="pill">لعبتان متاحتان الآن</span></div>
<div class="gamesGrid">
<div class="gameCard activeGame" onclick="showFamilyModes()"><div class="gameIcon">👨‍👩‍👧‍👦</div><div class="gameInfo"><h3>Family Feud</h3><p>تحدي الفرق — إجابات، Strikes، دبل ونقاط بأسلوب احترافي.</p><div class="gameTags"><span>🔥 فرق</span><span>⚡ دبل</span><span>🎯 نقاط</span></div><button class="btn primary createGameBtn" onclick="event.stopPropagation();showFamilyModes()">إنشاء غرفة</button></div><div class="playArrow">←</div></div>
<div class="gameCard activeGame" onclick="showGuessCreate()"><div class="gameIcon">🧠</div><div class="gameInfo"><h3>خمنها</h3><p>كل لاعب لديه كلمة سرية، والباقي يحاولون تخمينها. أول صحيح 3 نقاط ثم 2 ثم 1.</p><div class="gameTags"><span>🧠 تخمين</span><span>🏆 3 • 2 • 1</span><span>⚽ كرة قدم</span></div><button class="btn primary createGameBtn" onclick="event.stopPropagation();showGuessCreate()">إنشاء غرفة</button></div><div class="playArrow">←</div></div>
${['السوق','المفخخة','آخر واحد واقف','البنك'].map((x,i)=>`<div class="gameCard soon"><div class="gameIcon">${['💰','💣','🏆','🏦'][i]}</div><div class="gameInfo"><h3>${x}</h3><p>لعبة جديدة في الساحة قريبًا.</p><span class="soonBadge">قريبًا</span></div></div>`).join('')}
</div></section></div>`}
function showFamilyModes(){modal(`<h2>👨‍👩‍👧‍👦 Family Feud</h2><p class="muted">اختروا طريقة اللعب قبل إنشاء الغرفة.</p><div class="modeGrid">
<button class="modeCard" onclick="closeModal();showFamilyCreate('presenter')"><b>🎙️ مقدم + شاشة عرض + لاعبين</b><p>المقدم يدير اللعبة، اللاعبون يضغطون الزر ويجاوبون شفهيًا. يظهر أول من ضغط على الشاشة.</p></button>
<button class="modeCard" onclick="closeModal();showFamilyCreate('displayPlayers')"><b>🖥️ شاشة عرض + لاعبين</b><p>بدون مقدم. اللاعب يضغط «أجاوب كتابيًا» ويكتب خلال 10 ثواني، والنتيجة تظهر مباشرة على شاشة العرض.</p></button>
<button class="modeCard" onclick="closeModal();showFamilyCreate('players')"><b>👥 لاعبين فقط</b><p>نفس اللعب الكتابي من الجوالات، بدون شاشة عرض وبدون مقدم.</p></button>
</div><button class="btn dark" style="width:100%;margin-top:15px" onclick="closeModal()">إلغاء</button>`)}
function showFamilyCreate(mode){familyMode=mode;app.innerHTML=`<div class="shell"><div class="topbar">${logo()}<button class="btn dark" onclick="home()">الرئيسية</button></div><section class="card"><h1>✨ إنشاء Family Feud</h1><div class="roleBanner">${mode==='presenter'?'🎙️ أنت المقدم — لا تحتاج للدخول كلاعب.':mode==='displayPlayers'?'🖥️ الغرفة ستعمل مع شاشة عرض ولاعبين.':'👥 كل المشاركين يلعبون من جوالاتهم.'}</div>${mode==='presenter'?'':`<label class="label">اسمك</label><input class="input" id="pn" placeholder="اكتب اسمك" autofocus>`}<div class="grid"><div><label class="label">عدد الجولات</label><input class="input" id="rounds" type="number" min="1" max="50" value="5"></div><div><label class="label">فريقك</label><select id="pt"><option value="A">🔴 الفريق الأحمر</option><option value="B">🔵 الفريق الأزرق</option></select></div><div><label class="label">اسم الفريق الأحمر</label><input class="input" id="ta" value="الفريق الأحمر"></div><div><label class="label">اسم الفريق الأزرق</label><input class="input" id="tb" value="الفريق الأزرق"></div></div><button class="btn primary" style="width:100%;margin-top:10px" onclick="createFamily()">🚀 إنشاء الغرفة</button></section></div>`}
function createFamily(){const p={game:'family',mode:familyMode,rounds:+$('rounds').value||5,teamA:$('ta').value,teamB:$('tb').value,team:$('pt').value,name:$('pn')?.value.trim()||''};if(familyMode!=='presenter'&&!p.name)return toast('اكتب اسمك');socket.emit('room:create',p)}
function showGuessCreate(){app.innerHTML=`<div class="shell"><div class="topbar">${logo()}<button class="btn dark" onclick="home()">الرئيسية</button></div><section class="card"><h1>🧠 إنشاء خمنها</h1><label class="label">اسمك</label><input class="input" id="gn" placeholder="اكتب اسمك" autofocus><label class="label">الفئة</label><select id="gc"><option>عام</option><option>أفلام ومسلسلات</option><option>⚽ لاعبين كرة قدم معروفين</option></select><button class="btn primary" style="width:100%;margin-top:10px" onclick="createGuess()">🚀 إنشاء الغرفة</button></section></div>`}
function createGuess(){const n=$('gn').value.trim();if(!n)return toast('اكتب اسمك');socket.emit('room:create',{game:'guess',name:n,category:$('gc').value})}
function showJoin(pref=''){app.innerHTML=`<div class="shell"><div class="topbar">${logo()}<button class="btn dark" onclick="home()">الرئيسية</button></div><section class="card"><h1>🎮 دخول غرفة</h1><p class="muted">Family Feud يبدأ بحرف A، وخمنها تبدأ بحرف B.</p><input class="input" id="jc" placeholder="مثال: A123 أو B123" maxlength="4" autocapitalize="characters" value="${esc(pref)}"><button class="btn dark" style="width:100%" onclick="lookupRoom()">🔎 فحص الغرفة</button><div id="joinDetails"></div></section></div>`}
function lookupRoom(){const c=$('jc').value.trim().toUpperCase();if(!/^[AB]\d{3}$/.test(c))return toast('الرمز يجب أن يكون مثل A123 أو B123');socket.emit('room:lookup',{code:c})}
function renderJoin(info){const d=$('joinDetails');if(!d)return;code=info.code; if(info.game==='guess'){d.innerHTML=`<div class="roleBanner">🧠 خمنها — الفئة: ${esc(info.category)}<br><span class="small">${info.players.length} لاعب موجود حاليًا</span></div><label class="label">اسمك</label><input class="input" id="jn" placeholder="اكتب اسمك"><button class="btn red" style="width:100%" onclick="joinRoom()">دخول الغرفة 🚀</button>`}else{d.innerHTML=`<div class="roleBanner">👨‍👩‍👧‍👦 Family Feud — ${info.mode==='presenter'?'مقدم + شاشة + لاعبين':info.mode==='displayPlayers'?'شاشة عرض + لاعبين':'لاعبين فقط'}</div><label class="label">اسمك</label><input class="input" id="jn" placeholder="اكتب اسمك"><label class="label">فريقك</label><select id="jt">${info.teams.map(t=>`<option value="${t.id}">${t.id==='A'?'🔴':'🔵'} ${esc(t.name)}</option>`).join('')}</select><button class="btn red" style="width:100%" onclick="joinRoom()">دخول الغرفة 🚀</button>`}}
function joinRoom(){const n=$('jn').value.trim();if(!n)return toast('اكتب اسمك');const p={code,name:n};if(code[0]==='A')p.team=$('jt').value;socket.emit('room:join',p)}
function openDisplay(){location.href=`/player?display=${encodeURIComponent(code)}`}
function openPresenter(){location.href=`/player?presenter=${encodeURIComponent(code)}`}
function familyLobby(s){const isPresenter=role==='presenter', isDisplay=role==='display';app.innerHTML=`<div class="shell"><div class="topbar">${logo()}<span class="pill">${s.mode==='presenter'?'🎙️ مقدم':s.mode==='displayPlayers'?'🖥️ شاشة + لاعبين':'👥 لاعبين'}</span></div><section class="card"><h1>الغرفة جاهزة 🎉</h1><div class="codeBig">${esc(s.code)}</div><p class="muted" style="text-align:center">أرسل هذا الكود للاعبين. ${s.mode!=='players'?'يمكن فتح شاشة العرض من زر الشاشة أدناه.':''}</p><div class="lobbyActions">${s.mode==='presenter'?`<button class="btn primary" onclick="openPresenter()">🎙️ فتح لوحة المقدم</button><button class="btn dark" onclick="openDisplay()">🖥️ فتح شاشة العرض</button>`:''}${s.mode==='displayPlayers'?`<button class="btn primary" onclick="openDisplay()">🖥️ فتح شاشة العرض</button>`:''}<button class="btn dark" onclick="shareCode()">📤 مشاركة الكود</button><button class="btn" onclick="home()">الرئيسية</button></div><div class="lobbyPlayers"><h3>👥 اللاعبون</h3><div class="grid">${s.teams.map(t=>`<div class="bankRow"><b>${t.id==='A'?'🔴':'🔵'} ${esc(t.name)}</b><div class="players">${t.players.map(p=>esc(p.name)).join(' • ')||'بانتظار لاعبين...'}</div></div>`).join('')}</div></div><button class="btn gold" style="width:100%;margin-top:14px" onclick="startFamily()">🎲 ابدأ بسؤال عشوائي</button></section></div>`}
function startFamily(){socket.emit('family:start',{code})}
function shareCode(){modal(`<h2>📤 مشاركة الغرفة</h2><div class="codeBig">${esc(code)}</div><p class="muted" style="text-align:center">أرسل الرمز كما هو. Family Feud يبدأ بـ A، وخمنها بـ B.</p><button class="btn primary" style="width:100%" onclick="closeModal()">إغلاق</button>`)}
function teamMini(t){return `<div class="presenterTeam ${t.id==='B'?'b':''}"><div class="row"><b>${t.id==='A'?'🔴':'🔵'} ${esc(t.name)}</b><span class="presenterScore">${t.score}</span></div><div class="players">${t.players.map(p=>esc(p.name)).join(' • ')||'لا يوجد'}</div><div class="strikes">${'✕'.repeat(t.strikes)}${'○'.repeat(3-t.strikes)}</div></div>`}
function renderFamily(s){lastState=s;if(s.phase==='lobby')return familyLobby(s);if(role==='presenter')return renderPresenter(s);if(role==='display')return renderDisplay(s);return renderFamilyPlayer(s)}
function renderPresenter(s){app.innerHTML=`<div class="presenterBoard"><div class="presenterWrap"><div class="row"><div>${logo()}</div><div><span class="pill">🎙️ لوحة المقدم • ${esc(s.code)}</span> <span class="pill">السؤال ${s.currentRound}/${s.rounds}</span></div></div><div class="presenterTeams" style="margin-top:14px">${s.teams.map(teamMini).join('')}</div><div class="presenterQuestion">${esc(s.question)}</div>${s.lock?`<div class="buzzedBanner">🔔 ${esc(s.lock.name)} ضغط أولًا — ${esc(s.teams.find(t=>t.id===s.lock.team)?.name||'')} — يجاوب شفهيًا الآن</div>`:''}${s.answerLock?`<div class="buzzedBanner">⚡ ${esc(s.answerLock.name)} لديه دبل — ${Math.max(0,Math.ceil((s.answerLock.until-Date.now())/1000))} ثواني للإجابة شفهيًا</div>`:''}<div class="presenterAnswers">${s.answers.map((a,i)=>`<div class="presenterAnswer"><div class="row"><b>${i+1}. ${a.revealed?esc(a.text):'إجابة مخفية'}</b><span>${a.revealed?a.points:'؟'}</span></div><div class="answerBtns">${!a.revealed?`<button class="btn dark" onclick="familyReveal(${i})">👁️ كشف</button>`:''}${a.revealed&&!a.awarded?`<button class="btn red" onclick="familyAward(${i},'A')">🔴 +${a.points}</button><button class="btn blue" onclick="familyAward(${i},'B')">🔵 +${a.points}</button>`:''}</div></div>`).join('')}</div><div class="toolbar" style="margin-top:15px"><button class="btn danger" onclick="familyStrike('A')">❌ Strike أحمر</button><button class="btn danger" onclick="familyStrike('B')">❌ Strike أزرق</button><button class="btn primary" onclick="familyNext()">🎲 سؤال عشوائي</button><button class="btn dark" onclick="familyReset()">تصفير النقاط</button></div></div></div>`}
function renderDisplay(s){app.innerHTML=`<div class="displayBoard"><div class="displayWrap"><div class="row"><div>${logo()}</div><span class="pill">🖥️ شاشة العرض • ${esc(s.code)}</span></div><div class="displayScorebar" style="margin-top:14px">${s.teams.map(t=>`<div class="displayTeam ${t.id==='B'?'b':''}"><b>${t.id==='A'?'🔴':'🔵'} ${esc(t.name)}</b><div class="score">${t.score}</div><div class="strikes">${'✕'.repeat(t.strikes)}${'○'.repeat(3-t.strikes)}</div></div>`).join('')}</div><div class="displayQuestion">${esc(s.question||'جاهزين؟')}</div>${s.lock?`<div class="buzzedBanner">🔔 ${esc(s.lock.name)} ضغط أولًا — ${esc(s.teams.find(t=>t.id===s.lock.team)?.name||'')}</div>`:''}${s.answerLock?`<div class="buzzedBanner">⏱️ ${esc(s.answerLock.name)} يجاوب الآن — ${Math.max(0,Math.ceil((s.answerLock.until-Date.now())/1000))}</div>`:''}<div class="displayAnswers">${s.answers.map((a,i)=>`<div class="displayAnswer ${a.revealed?'revealed':''}">${a.revealed?`${i+1}. ${esc(a.text)} — <span style="color:#ffd166">${a.points}</span>`:`${i+1}. ؟`}</div>`).join('')}</div></div></div>`}
function renderFamilyPlayer(s){const me=s.teams.find(t=>t.id===playerTeam),myTurn=s.answerLock?.name===playerName;app.innerHTML=`<div class="shell"><div class="topbar">${logo()}<span class="pill">🏠 ${esc(s.code)}</span></div><section class="card"><div class="row"><div><h2>${esc(me?.name||'اللاعب')}</h2><div class="muted">النقاط: ${me?.score||0} • Strikes: ${'✕'.repeat(me?.strikes||0)}</div></div><span class="pill">السؤال ${s.currentRound}/${s.rounds}</span></div><div class="question">${esc(s.question||'بانتظار بدء السؤال')}</div>${s.mode==='presenter'?`<button class="btn gold buzzerBig" onclick="familyBuzz()" ${s.lock?'disabled':''}>🔔 اضغط للإجابة شفهيًا</button>`:''}${s.mode!=='presenter'&&s.phase==='question'&&!s.answerLock&&!myTurn?`<div class="toolbar"><button class="btn gold" onclick="familyAnswerReady()">✍️ أجاوب كتابيًا <small>10 ثواني</small></button>${!me?.doubleUsed?`<button class="btn primary" onclick="familyDouble()">⚡ دبل + إجابة</button>`:''}</div>`:''}${myTurn?`<div class="answerBox"><input class="input" id="fa" placeholder="اكتب إجابتك هنا" onkeydown="if(event.key==='Enter')familySubmit()"><button class="btn primary" onclick="familySubmit()">إرسال</button></div><div class="buzzedBanner" id="playerTimer">⏱️ ${Math.max(0,Math.ceil((s.answerLock.until-Date.now())/1000))}</div>`:''}<div class="answers">${s.answers.map(a=>`<div class="answer ${a.revealed?'revealed':'hiddenAns'}">${a.revealed?`${esc(a.text)} <span class="pts">${a.points}</span>`:'؟'}</div>`).join('')}</div><div class="toolbar"><button class="btn primary" onclick="familyNext()">🎲 سؤال عشوائي</button><button class="btn dark" onclick="home()">الرئيسية</button></div></section></div>`;if(myTurn)setTimeout(()=>$('fa')?.focus(),30)}
function familyBuzz(){socket.emit('family:buzz',{code})}function familyAnswerReady(){socket.emit('family:answerReady',{code})}function familyDouble(){socket.emit('family:double',{code})}function familySubmit(){const v=$('fa')?.value.trim();if(!v)return toast('اكتب إجابة');socket.emit('family:submitAnswer',{code,answer:v})}function familyReveal(i){socket.emit('family:reveal',{code,index:i})}function familyAward(i,t){socket.emit('family:award',{code,index:i,team:t})}function familyStrike(t){socket.emit('family:strike',{code,team:t})}function familyNext(){socket.emit('family:next',{code})}function familyReset(){if(confirm('تصفير النقاط؟'))socket.emit('family:resetScores',{code})}
function guessLobby(s){app.innerHTML=`<div class="shell"><div class="topbar">${logo()}<span class="pill">🧠 خمنها • ${esc(s.code)}</span></div><section class="card"><h1>🧠 خمنها</h1><div class="codeBig">${esc(s.code)}</div><p class="muted">الفئة: ${esc(s.category)} • اللاعبون: ${s.players.length}</p><div class="guessPlayers">${s.players.map(p=>`<div class="guessPlayer"><h3>${esc(p.name)}</h3><div class="guessScore">${p.score} نقطة</div></div>`).join('')}</div><div style="margin-top:15px"><button class="btn gold" onclick="guessStart()" ${s.players.length<2?'disabled':''}>🚀 ابدأ الجولة</button><button class="btn dark" onclick="home()">الرئيسية</button></div></section></div>`}
function guessPlaying(s){app.innerHTML=`<div class="shell"><div class="topbar">${logo()}<div><span class="pill">🧠 ${esc(s.category)}</span> <span class="pill">الجولة ${s.round}</span></div></div><section class="card"><div class="guessPlayers">${s.players.map(p=>`<div class="guessPlayer"><h3>${esc(p.name)}</h3><div class="guessScore">${p.score}</div>${p.target?`<div class="targetWord">👀 الكلمة: ${esc(p.target)}</div>`:`<div class="targetWord">🔒 كلمته مخفية</div>`}${p.id!==s.me?`<div class="guessControls"><button class="btn dark" onclick="guessReveal('${p.id}')">👁️ كشف الكلمة</button><input class="input guessInput" id="gi_${p.id}" placeholder="خمن كلمة ${esc(p.name)}" onkeydown="if(event.key==='Enter')guessSend('${p.id}')"><button class="btn primary" onclick="guessSend('${p.id}')">خمن 🚀</button></div>`:''}</div>`).join('')}</div><div class="toolbar" style="margin-top:16px"><button class="btn gold" onclick="guessNext()">🔄 جولة جديدة</button><button class="btn dark" onclick="home()">الرئيسية</button></div></section></div>`}
function guessRender(s){guessState=s;if(s.phase==='lobby')guessLobby(s);else guessPlaying(s)}
function guessStart(){socket.emit('guess:start',{code,category:guessState?.category})}function guessReveal(id){socket.emit('guess:reveal',{code,targetId:id})}function guessSend(id){const e=$('gi_'+id),v=e?.value.trim();if(!v)return toast('اكتب تخمينك');socket.emit('guess:guess',{code,targetId:id,text:v});if(e)e.value=''}function guessNext(){socket.emit('guess:next',{code})}
socket.on('room:created',x=>{code=x.code;gameType=x.game;role=x.role;familyMode=x.mode||'';playerName=x.name||'';playerTeam=x.team||'';history.replaceState({},'',`/player?join=${encodeURIComponent(code)}`);toast('تم إنشاء الغرفة '+code)});
socket.on('room:joined',x=>{gameType=x.game;playerName=x.name||playerName;playerTeam=x.team||'';toast('تم الدخول');history.replaceState({},'',`/player?join=${encodeURIComponent(code)}`)});
socket.on('room:info',renderJoin);
socket.on('display:joined',()=>{role='display';gameType='family';toast('شاشة العرض متصلة')});
socket.on('presenter:joined',()=>{role='presenter';gameType='family';toast('لوحة المقدم متصلة')});
socket.on('state',s=>{if(!role)role=s.mode==='presenter'?'player':(gameType==='family'?'player':'player');familyMode=s.mode;renderFamily(s)});
socket.on('guess:state',s=>{if(!gameType)gameType='guess';role='player';guessRender(s)});
socket.on('buzzer:locked',x=>{tone(880,.3,'square');toast(`🔔 ${x.name} ضغط أولًا`)});
socket.on('answer:ready',x=>{tone(880,.2,'square');});
socket.on('double:activated',()=>{tone(660,.4,'triangle');toast('⚡ الدبل بدأ — 10 ثواني')});
socket.on('answer:correct',x=>{tone(780,.3,'triangle');toast(`✅ صحيح +${x.points}`)});
socket.on('answer:wrong',x=>{tone(120,.25,'sawtooth');toast(`❌ خطأ — Strike ${x.strikes}/3`)});
socket.on('answer:timeout',()=>toast('⏱️ انتهى الوقت'));
socket.on('error:msg',m=>toast('⚠️ '+m));
const params=new URLSearchParams(location.search);
if(params.get('display')){code=params.get('display');role='display';gameType='family';socket.emit('family:displayJoin',{code})}
else if(params.get('presenter')){code=params.get('presenter');role='presenter';gameType='family';socket.emit('family:presenterJoin',{code})}
else if(params.get('join')){showJoin(params.get('join'))}
else home();
</script></body></html>
