/* Modern Arena 2026 skin */
:root{--bg:#05060b;--panel:rgba(14,17,29,.78);--line:rgba(255,255,255,.10);--muted:#a7afc4;--violet:#7c5cff;--cyan:#35d8ff;--pink:#ff4f81;--gold:#ffd166}

.wrap{width:min(1320px,96vw);padding:24px}.card,.game,.hero{border:1px solid var(--line);background:linear-gradient(180deg,rgba(20,24,41,.88),rgba(8,10,18,.94));box-shadow:0 28px 100px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.04)}
.hero{position:relative;overflow:hidden;padding:72px 28px;border-radius:38px}.hero:before{content:"";position:absolute;inset:-80px;background:conic-gradient(from 180deg,transparent,rgba(124,92,255,.16),transparent 35%,rgba(53,216,255,.12),transparent 70%);filter:blur(40px);pointer-events:none}.title{position:relative;text-shadow:0 0 35px rgba(124,92,255,.35)}
.game{min-height:245px;transition:transform .22s,border-color .22s,box-shadow .22s}.game:hover{transform:translateY(-7px) scale(1.01);border-color:rgba(124,92,255,.55);box-shadow:0 28px 80px rgba(0,0,0,.55),0 0 35px rgba(124,92,255,.10)}
.game .ico{filter:drop-shadow(0 10px 20px rgba(124,92,255,.25))}.btn{position:relative;overflow:hidden;box-shadow:0 10px 28px rgba(0,0,0,.22);transition:transform .16s,filter .16s,box-shadow .16s}.btn:hover{box-shadow:0 14px 36px rgba(0,0,0,.32)}.btn:active{transform:translateY(1px) scale(.98)}
.primary{background:linear-gradient(135deg,#8b6cff,#6246e9)}.red{background:linear-gradient(135deg,#ff587f,#d92f57)}.gold{background:linear-gradient(135deg,#ffd86a,#e9aa2e)}.green{background:linear-gradient(135deg,#38d99c,#159a68)}.blue{background:linear-gradient(135deg,#43a5ff,#2870d9)}
.mode{background:rgba(255,255,255,.035);border-color:rgba(255,255,255,.10);transition:.18s}.mode:hover,.mode.selected{transform:translateY(-2px);border-color:rgba(124,92,255,.8);background:linear-gradient(135deg,rgba(124,92,255,.18),rgba(53,216,255,.06));box-shadow:0 10px 30px rgba(124,92,255,.12)}
.input,select{background:rgba(4,7,14,.72);border-color:rgba(255,255,255,.12);box-shadow:inset 0 1px 10px rgba(0,0,0,.25)}
.bigBtn{box-shadow:0 25px 70px rgba(0,0,0,.42),inset 0 2px 0 rgba(255,255,255,.12);min-height:220px}.press{box-shadow:0 30px 90px rgba(238,64,87,.25),inset 0 3px 0 rgba(255,255,255,.18);animation:pulse 1s infinite,glow 2s ease-in-out infinite}@keyframes glow{50%{filter:brightness(1.12);box-shadow:0 30px 110px rgba(255,79,129,.42)}}
.marketQ,.q,.millionQ{letter-spacing:-.6px}.ans,.opt,.step,.scoreline{border-color:rgba(255,255,255,.09);background:rgba(255,255,255,.035)}.ans.reveal{box-shadow:0 0 0 2px rgba(53,216,255,.22),0 12px 35px rgba(53,216,255,.10)}
.stageFlash{animation:stageFlash .55s ease}@keyframes stageFlash{0%{filter:brightness(2)}100%{filter:brightness(1)}}.winner{box-shadow:0 0 60px rgba(255,209,102,.12)}
.credit{position:fixed;bottom:8px;left:0;right:0;text-align:center;color:#666d86;font-size:11px;pointer-events:none}

const SESSION_KEY='arena.sessions';function loadSessions(){try{const a=JSON.parse(localStorage.getItem(SESSION_KEY)||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}}function saveSession(roomCode,gameName,token,name){if(!roomCode||!token)return;let a=loadSessions().filter(x=>x.code!==roomCode);a.unshift({code:roomCode,game:gameName,token,name:name||'لاعب',updatedAt:Date.now()});localStorage.setItem(SESSION_KEY,JSON.stringify(a.slice(0,12)))}function forgetSession(roomCode){localStorage.setItem(SESSION_KEY,JSON.stringify(loadSessions().filter(x=>x.code!==roomCode)))}
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const audioFiles={click:'/audio/click.wav',buzz:'/audio/buzz.wav',tick:'/audio/tick.wav',win:'/audio/win.wav',wrong:'/audio/wrong.wav',reveal:'/audio/reveal.wav',vote:'/audio/vote.wav',million:'/audio/million.wav',suspense:'/audio/suspense.wav',explosion:'/audio/explosion.wav',countdown:'/audio/countdown.wav',applause:'/audio/applause.wav'};
function sound(kind){try{const a=new Audio(audioFiles[kind]||audioFiles.click);a.volume=kind==='buzz'?.7:.58;a.currentTime=0;a.play().catch(()=>{});}catch(e){}}
let marketAudio={phase:'',interval:null,suspense:null,lastSec:null};
function stopMarketAudio(){if(marketAudio.interval){clearInterval(marketAudio.interval);marketAudio.interval=null}if(marketAudio.suspense){try{marketAudio.suspense.pause();marketAudio.suspense.currentTime=0}catch(e){}marketAudio.suspense=null}marketAudio.lastSec=null}
function playMarketSound(kind,volume){try{const a=new Audio(audioFiles[kind]||audioFiles.click);a.volume=volume??(kind==='suspense'?.38:.58);a.currentTime=0;a.play().catch(()=>{});return a}catch(e){return null}}
function marketAudioSync(state){if(!state||state.type!=='market'){stopMarketAudio();marketAudio.phase='';return}const phase=state.phase;if(phase!==marketAudio.phase){stopMarketAudio();marketAudio.phase=phase;if(phase==='question')playMarketSound('reveal',.52);if(phase==='points')playMarketSound('win',.48);if(phase==='buzz')playMarketSound('buzz',.72);if(phase==='answer')playMarketSound('suspense',.42)}
  if(!['countdown','buzz','answer'].includes(phase))return;
  const until=phase==='countdown'?state.countdownUntil:(phase==='buzz'?state.buzzUntil:state.answerUntil);
  if(!until)return;
  const durationSec=Math.max(0,Math.ceil((until-Date.now())/1000));
  if(phase==='countdown'){
    marketAudio.lastSec=durationSec;
    if(durationSec>0)playMarketSound('countdown',.62);
    marketAudio.interval=setInterval(()=>{const n=Math.max(0,Math.ceil((until-Date.now())/1000));if(n>0&&n!==marketAudio.lastSec){marketAudio.lastSec=n;playMarketSound('countdown',.62)}if(n<=0){clearInterval(marketAudio.interval);marketAudio.interval=null}},80);
  }else{
    marketAudio.lastSec=durationSec;
    marketAudio.suspense=playMarketSound('suspense',.34);if(marketAudio.suspense)marketAudio.suspense.loop=true;
    if(durationSec>0)playMarketSound('tick',.62);
    marketAudio.interval=setInterval(()=>{const n=Math.max(0,Math.ceil((until-Date.now())/1000));if(n>0&&n!==marketAudio.lastSec){marketAudio.lastSec=n;playMarketSound('tick',.62)}if(n<=0){clearInterval(marketAudio.interval);marketAudio.interval=null}},80);
  }
}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2300)}
function set(x){document.getElementById('app').innerHTML=`<div class="wrap">${x}</div>`}
function tick(until,id){const el=document.getElementById(id);if(!el)return;const left=()=>Math.max(0,Math.ceil((until-Date.now())/1000));el.textContent=left();const iv=setInterval(()=>{const e=document.getElementById(id);if(!e){clearInterval(iv);return}const n=left();e.textContent=n;if(n<=0){clearInterval(iv);}},100)}
function home(){const ss=loadSessions();const resume=ss.length?`<div class="card sessionPanel"><div class="top"><div><h2 style="margin:0">🟡 لديك ألعاب غير مكتملة</h2><div class="muted">يمكنك الرجوع لنفس الغرفة واللاعب والنقاط من حيث توقفت.</div></div><span class="pill">${ss.length} جلسة</span></div><div class="grid3" style="margin-top:14px">${ss.map(x=>`<div class="game sessionTile"><span class="gameBadge">${esc(x.game||'لعبة')}</span><div class="code" style="font-size:30px;letter-spacing:4px">${esc(x.code)}</div><b>${esc(x.name||'لاعب')}</b><span class="small">آخر نشاط: ${new Date(x.updatedAt||Date.now()).toLocaleString('ar-SA')}</span><button class="btn primary" onclick="resumeSaved('${esc(x.code)}')">🔄 العودة للعبة</button><button class="btn dark" onclick="forgetSession('${esc(x.code)}');home()">حذف من القائمة</button></div>`).join('')}</div></div>`:'';set(`<div class="hero"><div class="pill">PLAY • COMPETE • WIN</div><h1 class="title">الساحة</h1><p class="sub">منصة ألعاب جماعية واحدة — كل لعبة لها نظامها وأجواؤها ومؤثراتها.</p><div class="row" style="max-width:760px;margin:22px auto 0"><button class="btn primary" onclick="sound('click');joinForm()">🎮 انضمام لغرفة</button><button class="btn blue" onclick="sound('click');displayForm()">🖥️ شاشة العرض</button></div></div>${resume}<div class="grid" style="margin-top:18px">${games.map(g=>`<div class="game" onclick="sound('click');createForm('${g[0]}')"><div class="ico">${g[1]}</div><h2>${g[2]}</h2><p class="muted">${g[3]}</p><button class="btn primary" onclick="event.stopPropagation();sound('click');createForm('${g[0]}')">✨ إنشاء غرفة</button><div class="small" style="margin-top:12px">تم إنشاء اللعبة من قبل أغيد</div></div>`).join('')}</div>`)}
function resumeSaved(c){const x=loadSessions().find(s=>s.code===String(c).toUpperCase());if(!x)return home();code=x.code;sessionToken=x.token;role='player';pendingGame=(x.game||'').includes('Family')?'family':pendingGame;const m=code[0]==='A'?code[1]:'';if(code[0]==='A'){saveSession(code,x.game,x.token,x.name);return location.href='/games/family-feud/players?code='+encodeURIComponent(code)+'&mode='+encodeURIComponent(m)}socket.emit('room:resume',{code,sessionToken})}
function modes(t){if(t==='guess')return '';if(t==='market')return `<h3>طريقة اللعب</h3><div class="marketModeGrid"><button class="mode marketModeCard" id="m-presenter" onclick="pickMode('presenter')"><b>🎙️ مقدم + شاشة + لاعبين</b><span>مقدم للتحكم والحكم • شاشة عرض • لاعبين مع Buzz وDouble</span></button><button class="mode selected marketModeCard" id="m-players" onclick="pickMode('players')"><b>👥 لاعبين فقط</b><span>لاعبون يتنافسون والتصويت الجماعي يحسم الإجابة</span></button></div>`;return `<h3>طريقة اللعب</h3><div class="grid3"><button class="mode selected" id="m-presenter" onclick="pickMode('presenter')">🎙️ مقدم + شاشة</button><button class="mode" id="m-display" onclick="pickMode('display')">🖥️ شاشة + لاعبين</button><button class="mode" id="m-players" onclick="pickMode('players')">👥 لاعبين</button></div>`}

function ffModes(){window.ffRounds=5;window.ffMode='1';set(`<div class="card"><div class="top"><h1>👨‍👩‍👧‍👦 Family Feud</h1><button class="btn dark" onclick="home()">رجوع</button></div><h3>عدد الجولات</h3><div class="grid3">${[5,10,15,20].map(n=>`<button class="mode ${n===5?'selected':''}" onclick="ffR(${n})">${n} جولات</button>`).join('')}</div><h3>طريقة اللعب</h3><div class="grid3"><button class="mode selected" onclick="ffM('1')">🎙️ لعب شفهي — مقدم + شاشة</button><button class="mode" onclick="ffM('2')">✍️ لعب كتابي — مقدم + شاشة</button><button class="mode" onclick="ffM('3')">👥 لاعبين فقط</button></div><input id="name" class="input" placeholder="اسمك"><button class="btn primary" style="width:100%" onclick="createFF()">✨ إنشاء الغرفة</button></div>`)}

function createFF(){pendingGame='family';const n=document.getElementById('name')?.value.trim()||'المقدم';socket.emit('room:create',{game:'family',mode:window.ffMode,rounds:window.ffRounds||5,name:n,team:'A'})}
function bombModes(){window.bombRounds=10;set(`<div class="card bombEntryCard bombCreateCard"><div class="bombEntryHead"><div class="bombBadge">💣 المفخخة</div><h1>إنشاء غرفة</h1><p class="muted">لاعبون فقط — تيم أحمر ضد تيم أزرق. بعد دخول لاعبين من الفريقين، يبدأ أي لاعب اللعبة من زر بدء اللعبة.</p></div><h3>عدد الجولات</h3><div class="grid3">${[5,10,15,20,30].map(n=>`<button class="mode ${n===10?'selected':''}" id="br${n}" onclick="bombR(${n})">${n} جولات</button>`).join('')}</div><div class="entryIdentity"><label>اسمك</label><input id="name" class="input" placeholder="اسم اللاعب" autocomplete="nickname"></div><button class="btn primary full createBombBtn" onclick="createBomb()">💣 إنشاء الغرفة</button></div>`)}

function joinForm(){set(`<div class="card"><div class="top"><h1>🎮 انضمام لغرفة</h1><button class="btn dark" onclick="home()">رجوع</button></div><p class="muted">أدخل الكود فقط. سيتم التعرف على اللعبة والنمط تلقائيًا من الكود.</p><input id="codeIn" class="input" maxlength="4" inputmode="text" autocomplete="off" placeholder="A101 / A201 / A301 / B123 ..."><button class="btn red" style="width:100%" onclick="lookup()">متابعة</button></div>`);document.getElementById('codeIn')?.focus()}
function lookup(){const c=document.getElementById('codeIn').value.trim().toUpperCase();if(!/^(?:A[1-3]\d{2}|[B-G]\d{3})$/.test(c))return toast('اكتب كودًا صحيحًا مثل A101 أو A201 أو A301');window.pending=c;const game=c[0]==='A'?'family':({B:'guess',C:'market',D:'bomb',E:'last',F:'bank',G:'million'}[c[0]]||'');if(game==='bomb'){joinOptions({code:c,game:'bomb'});return}const local=loadSessions().find(x=>x.code===c);if(local){code=c;sessionToken=local.token;role='player';socket.emit('room:resume',{code,sessionToken});return}joinOptions({code:c,game:game})}

 set(`<div class="card marketShell displayMarket"><div class="marketTop"><div><div class="marketBrand">🛒 السوق • شاشة العرض</div><div class="code">${G.code}</div></div><div class="marketTopMeta"><span>ج${G.round}/${G.maxRounds}</span></div></div>${body}<div class="marketScores">${G.players.slice().sort((a,b)=>(G.scores[b.id]||0)-(G.scores[a.id]||0)).map((p,i)=>`<div class="marketScoreRow"><span><i>${i+1}</i>${esc(p.name)}</span><b>${G.scores[p.id]||0}</b></div>`).join('')}</div></div>`);
 if(G.phase==='countdown')tick(G.countdownUntil,'mcd'); if(G.phase==='answer')tick(G.answerUntil,'manswer');
}

function millionDisplay(){set(`<div class="card million" style="min-height:90vh"><div class="top"><div><div class="small">المليون • شاشة العرض</div><div class="code">${G.code}</div></div><span class="pill">كل لاعب في مساره</span></div><div class="grid">${G.players.map(p=>{const x=G.playersState?.[p.id]||{};return `<div class="game"><b>${esc(p.name)}</b><div class="score">${(x.bank||0).toLocaleString()}</div><div class="small">${x.active?'🔥 مستمر':'⏸️ متوقف'}</div></div>`}).join('')}</div></div>`)}
function millionPresenter(){set(`<div class="card million" style="min-height:90vh"><div class="top"><div><div class="small">لوحة المقدم • المليون</div><div class="code">${G.code}</div></div><button class="btn dark" onclick="window.open('/display?code=${G.code}','_blank')">🖥️ الشاشة</button></div><div class="grid">${G.players.map(p=>{const x=G.playersState?.[p.id]||{};return `<div class="game"><h2>${esc(p.name)}</h2><div class="score">${(x.bank||0).toLocaleString()}</div><p>${x.active?'مستمر':'متوقف'}</p></div>`}).join('')}</div><button class="btn gold" onclick="millionStart()">🔥 بدء اللعبة</button></div>`)}
function miniDisplay(){miniRender();}
function miniPresenter(){miniRender();}

function render(){document.body.classList.remove('guess-page','market-page');if(!G)return home();if(G.type==='family')return role==='display'?ffDisplay():role==='presenter'?ffPresenter():ffPlayer();if(G.type==='guess')return guessRender();if(G.type==='market')return role==='display'?marketDisplay():marketRender();if(G.type==='million')return role==='display'?millionDisplay():role==='presenter'?millionPresenter():millionRender();return role==='display'?miniDisplay():role==='presenter'?miniPresenter():miniRender()}
socket.on('room:created',x=>{code=x.code;role=x.role;me=x.playerId||null;mode=x.mode||'';sessionToken=x.sessionToken||sessionToken;if(role==='player'&&sessionToken&&pendingGame!=='bomb')saveSession(code,({family:'Family Feud',guess:'خمنها',market:'السوق',bomb:'المفخخة',last:'الصملة',bank:'البنك',million:'المليون'}[pendingGame]||'لعبة'),sessionToken,document.getElementById('name')?.value||'لاعب');if(pendingGame==='bomb'&&role==='presenter'){location.href='/games/bomb/presenter?code='+encodeURIComponent(code);return}if(pendingGame==='bomb'&&role==='player'){const n=document.getElementById('name')?.value||'لاعب';const t=x.team||'A';history.replaceState({},'',`/games/bomb/players?code=${encodeURIComponent(code)}&name=${encodeURIComponent(n)}&team=${encodeURIComponent(t)}&sessionToken=${encodeURIComponent(sessionToken||'')}`);render();return}history.replaceState({},'',`/${role==='presenter'?'presenter':role==='display'?'display':'player'}?code=${code}`);});socket.on('joined',x=>{code=x.code;role='player';me=x.playerId;sessionToken=x.sessionToken||sessionToken;const gameName=({family:'Family Feud',guess:'خمنها',market:'السوق',bomb:'المفخخة',last:'الصملة',bank:'البنك',million:'المليون'}[pendingGame]||'لعبة');saveSession(code,gameName,sessionToken,document.getElementById('joinName')?.value||document.getElementById('name')?.value||'لاعب');if(x.code[0]==='A'){location.href='/games/family-feud/players?code='+encodeURIComponent(x.code)+'&mode='+encodeURIComponent(x.code[1]);return}if(x.code[0]==='D'){const n=document.getElementById('joinName')?.value||document.getElementById('name')?.value||'لاعب';const t=document.getElementById('team')?.value||'A';history.replaceState({},'',`/games/bomb/players?code=${encodeURIComponent(x.code)}&name=${encodeURIComponent(n)}&team=${encodeURIComponent(t)}&sessionToken=${encodeURIComponent(sessionToken||'')}`);render();return}render()});socket.on('disconnect',()=>{if(role==='player'&&code)toast('🟡 انقطع الاتصال مؤقتًا… سنحاول إعادتك لنفس الجلسة.');});socket.on('connect_error',()=>{if(role==='player'&&code)toast('🟠 تعذر الاتصال مؤقتًا… جاري إعادة المحاولة تلقائيًا.');});socket.on('connect',()=>{if(role==='player'&&code&&sessionToken){socket.emit('room:resume',{code,sessionToken});}});socket.on('display:ok',x=>{code=x.code;role='display';if(code[0]==='D'){location.href='/games/bomb/display?code='+encodeURIComponent(code);return}});socket.on('room:info',joinOptions);let prevPhase='';socket.on('state',s=>{const old=G;G=s;if(role==='player'&&sessionToken&&s?.type!=='bomb')saveSession(code,({family:'Family Feud',guess:'خمنها',market:'السوق',bomb:'المفخخة',last:'الصملة',bank:'البنك',million:'المليون'}[s?.type||pendingGame]||'لعبة'),sessionToken,s?.players?.find(x=>x.id===me)?.name||'لاعب');const changed=s?.phase!==prevPhase;prevPhase=s?.phase||'';if(s?.type==='market'){marketAudioSync(s);if(changed&&s.phase==='results')sound(s.history?.[s.history.length-1]?.result==='صحيح'?'win':'wrong')}else if(changed){if(s?.type==='bomb'){if(s.phase==='question')sound('buzz');else if(s.phase==='reveal')sound('suspense');else if(s.phase==='finished')sound('win');}else{if(s.phase==='countdown')sound('countdown');else if(s.phase==='buzz'||s.phase==='question')sound('buzz');else if(s.phase==='answer'||s.phase==='bombAnswer'||s.phase==='turn'||s.phase==='judge')sound('suspense');else if(s.phase==='vote')sound('vote');else if(s.phase==='results'||s.phase==='lastResult'||s.phase==='bankResult')sound('win');else if(s.phase==='finished')sound('win');}}if(s?.type==='bomb'&&s.phase==='bombResult')sound(s.result?.kind==='trap'?'explosion':s.result?.kind==='listed'||s.result?.kind==='outside'?'correct':'wrong');if(s?.type==='family'&&s.answerLock?.double){sound('suspense');try{navigator.vibrate?.([80,50,120,50,180])}catch(e){}}render()});socket.on('errorMsg',toast);socket.on('ff:wrong',x=>{sound('wrong');toast(`❌ خطأ — Strike ${x.strikes}/3`)});socket.on('ff:correct',x=>{sound('win');toast(x.smart?`🧠 تم احتسابها من قبل التصحيح الذكي — +${x.points}`:`✅ إجابة صحيحة +${x.points}`)});socket.on('guess:correct',x=>{sound('win');guessFX('correct',`🎉 ${esc(x.player||'اللاعب')} حزَرها!`,`حصل على +${x.points} نقطة 🏆`);toast(`🎉 ${x.player||'اللاعب'} عرفها وحصل على +${x.points} نقطة`);});socket.on('guess:wrong',x=>{sound('wrong');guessFX('wrong',`❌ ${esc(x.player||'اللاعب')} أخطأ!`,'حاول مرة أخرى');toast(`❌ ${x.player||'اللاعب'} لم يصب التخمين`)});socket.on('market:wrong',()=>sound('wrong'));socket.on('market:vote',()=>sound('vote'));socket.on('market:double',x=>marketDoubleFX(x?.name));socket.on('guess:revealed',()=>sound('reveal'));socket.on('million:audience',()=>sound('vote'));socket.on('million:win',x=>{sound('win');toast(`👑 مليون! ${x.name}`)});socket.on('million:wrong',x=>{sound('wrong');toast(`❌ ${x.name} عاد إلى ${x.bank}`)});const pathName=location.pathname;if(pathName.startsWith('/games/bomb/')){const qs=new URLSearchParams(location.search),q=(qs.get('code')||'').toUpperCase(),tok=qs.get('sessionToken')||'',nm=qs.get('name')||'',tm=qs.get('team')||'A';if(q){code=q;if(pathName.includes('/presenter')){role='presenter';socket.emit('room:presenter',{code:q})}else if(pathName.includes('/display')){role='display';socket.emit('room:display',{code:q})}else{role='player';sessionToken=tok||sessionToken;window.pending=q;if(tok)socket.emit('room:resume',{code:q,sessionToken:tok,name:nm,team:tm});else socket.emit('room:join',{code:q,name:nm||'لاعب',team:tm})}}else home()}else if(pathName==='/display'){role='display';const q=new URLSearchParams(location.search).get('code');if(q)socket.emit('room:display',{code:q});else displayForm();}else if(pathName==='/presenter'){role='presenter';const q=new URLSearchParams(location.search).get('code');if(q){code=q;socket.emit('room:presenter',{code:q})}else home();}else if(pathName==='/player'){role='player';const q=new URLSearchParams(location.search).get('code');if(q){const c=q.toUpperCase();if(/^A[1-3]\d{2}$/.test(c)){location.replace('/games/family-feud/players?code='+encodeURIComponent(c)+'&mode='+encodeURIComponent(c[1]));}else{window.pending=c;const saved=loadSessions().find(x=>x.code===c);if(saved&&c[0]!=='D'){code=c;sessionToken=saved.token;socket.emit('room:resume',{code,sessionToken})}else joinForm()}}else home();}else home();

function ffModes(){window.ffRounds=5;window.ffMode='1';set(`<div class="card"><div class="top"><div><div class="small">الساحة • اللعبة</div><h1>👨‍👩‍👧‍👦 Family Feud</h1></div><button class="btn dark" onclick="home()">رجوع</button></div><h3>عدد الجولات</h3><div class="grid3">${[5,10,15,20].map(n=>`<button class="mode ${n===5?'selected':''}" id="ff${n}" onclick="ffR(${n})">${n} جولات</button>`).join('')}</div><h3>طريقة اللعب</h3><div class="grid3"><button class="mode selected" id="ffm-1" onclick="ffM('1')">🎙️ لعب شفهي — مقدم + شاشة</button><button class="mode" id="ffm-2" onclick="ffM('2')">✍️ لعب كتابي — مقدم + شاشة</button><button class="mode" id="ffm-3" onclick="ffM('3')">👥 لاعبين فقط</button></div><button class="btn primary" style="width:100%;margin-top:18px;font-size:19px" onclick="ffContinue()">متابعة ▶</button></div>`)}
