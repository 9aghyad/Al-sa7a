<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الساحة</title><script src="/socket.io/socket.io.js"></script><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Tahoma,Arial,sans-serif;background:#070812;color:#fff}body{background:radial-gradient(circle at 50% -10%,#3b2a77 0,#111426 38%,#06070d 100%)}button,input,select{font:inherit}button{border:0;cursor:pointer}.wrap{width:min(1180px,96vw);margin:auto;padding:18px}.card{background:rgba(14,17,31,.93);border:1px solid #343952;border-radius:28px;padding:22px;box-shadow:0 25px 90px #0009;backdrop-filter:blur(8px)}.hero{padding:54px 24px;text-align:center;border-radius:32px;background:radial-gradient(circle at 50% 0,#51439b,#12172a 58%,#0a0c15);border:1px solid #5a4fa0}.title{font-size:clamp(46px,8vw,88px);font-weight:1000;margin:0}.sub,.muted{color:#aeb5ca;line-height:1.8}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.game{padding:22px;border-radius:24px;background:linear-gradient(145deg,#171d31,#0e1322);border:1px solid #303a58;transition:.2s;position:relative;overflow:hidden}.game:hover{transform:translateY(-3px);border-color:#7866e8}.game .ico{font-size:46px}.game h2{margin:8px 0}.btn{padding:13px 17px;border-radius:15px;font-weight:1000;background:#e9edf6;color:#111521}.primary{background:#765cff;color:#fff}.red{background:#e83d55;color:#fff}.blue{background:#2588ee;color:#fff}.gold{background:#e5b638;color:#211700}.green{background:#1c9d68;color:#fff}.dark{background:#20283d;color:#fff}.danger{background:#7d2838;color:#fff}.input,select{width:100%;background:#080d19;color:#fff;border:1px solid #3a4560;border-radius:14px;padding:14px;margin:7px 0 12px;outline:none}.pill{display:inline-flex;padding:8px 12px;border-radius:999px;background:#1b2438;border:1px solid #35415e;color:#d9def0}.code{font-size:40px;font-weight:1000;letter-spacing:8px;color:#ffd75b}.mode{padding:18px;border:2px solid #303b59;border-radius:20px;background:#111829;color:#fff;text-align:right}.mode.selected{border-color:#826bff;background:#211b43;box-shadow:0 0 0 3px #826bff22}.scoreline{display:flex;justify-content:space-between;align-items:center;padding:13px 15px;background:#151c2e;border-radius:15px;margin:8px 0}.score{font-size:58px;font-weight:1000}.team{padding:18px;border-radius:22px;background:#101829;border:2px solid #35415c}.team.a{border-color:#8d3546}.team.b{border-color:#2c70b4}.teams{display:grid;grid-template-columns:1fr 1fr;gap:14px}.q{font-size:clamp(30px,5vw,60px);font-weight:1000;text-align:center;margin:25px 0}.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.ans{min-height:100px;border-radius:18px;background:#1b2942;border:2px solid #35445f;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:24px;font-weight:1000;text-align:center}.ans.hidden{background:linear-gradient(145deg,#263756,#11192a)}.reveal{animation:pop .4s ease}@keyframes pop{from{transform:scale(.82);opacity:.2}to{transform:none;opacity:1}}.bigBtn{width:100%;min-height:190px;font-size:40px;border-radius:30px}.playerButtons{display:grid;grid-template-columns:1fr 1fr;gap:14px}.timer{font-size:58px;font-weight:1000;color:#ffd75b;text-align:center}.buzz{padding:18px;border-radius:18px;background:#382532;border:1px solid #714050;text-align:center;font-size:22px;font-weight:1000}.notice{padding:14px 16px;border-radius:16px;background:#111729;border:1px solid #303b57;line-height:1.7}.miniHero{text-align:center;padding:38px;border-radius:26px;background:linear-gradient(145deg,#171e35,#0e1322)}.marketQ{font-size:clamp(30px,5vw,58px);font-weight:1000;text-align:center;margin:24px 0}.pointsTag{display:inline-flex;padding:10px 16px;border-radius:999px;background:#4b3911;color:#ffe07b;border:1px solid #80611c;font-weight:1000}.press{width:min(540px,100%);aspect-ratio:1/0.55;border-radius:50px;font-size:50px;font-weight:1000;background:linear-gradient(145deg,#ee4057,#8f1830);color:white;box-shadow:0 20px 60px #ee405744,inset 0 3px 0 #ffffff44;animation:pulse 1s infinite}.press:disabled{opacity:.4;animation:none}@keyframes pulse{50%{transform:scale(1.015)}}.winner{padding:18px;border-radius:20px;background:linear-gradient(145deg,#3b2b11,#19150b);border:1px solid #8a6820;text-align:center}.million{background:radial-gradient(circle at 50% 0,#5d4a12,#171624 45%,#08080f)}.ladder{display:grid;gap:7px}.step{display:flex;justify-content:space-between;padding:10px 13px;border-radius:12px;background:#151b2a}.step.active{background:#5b4611;border:1px solid #c99b29;transform:scale(1.02)}.step.safe{box-shadow:inset 4px 0 #4fc58d}.millionQ{font-size:clamp(26px,4vw,45px);font-weight:1000;text-align:center;padding:20px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}.opt{padding:20px;border-radius:18px;background:#171e30;border:2px solid #35425e;color:#fff;font-weight:1000;text-align:right}.opt:hover{border-color:#9b7dff;background:#211b3e}.lifelines{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.life{padding:14px;border-radius:16px;background:#1b2438;color:#fff}.life.off{opacity:.35}.podium{display:flex;align-items:end;justify-content:center;gap:12px;min-height:260px}.place{width:30%;text-align:center;padding:18px;border-radius:20px 20px 5px 5px;background:#171d2e;border:1px solid #414a64}.place.first{min-height:220px}.place.second{min-height:170px}.place.third{min-height:130px}.rank{display:flex;justify-content:space-between;padding:14px;background:#151b2b;border-radius:14px;margin:8px 0}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:50;background:#171c2e;border:1px solid #535e7d;padding:14px 18px;border-radius:16px;box-shadow:0 15px 50px #000b;max-width:90%;text-align:center}.hidden{display:none!important}@media(max-width:760px){.teams,.playerButtons{grid-template-columns:1fr}.answers{grid-template-columns:1fr 1fr}.opts{grid-template-columns:1fr}.lifelines{grid-template-columns:1fr 1fr}.wrap{padding:10px}.card{padding:16px}.press{font-size:34px}.code{font-size:32px}}
</style></head><body><div id="app"></div><script>
const socket=io();let G=null,me=null,role='',mode='',code='';let audioCtx=null;
const games=[['family','👨‍👩‍👧‍👦','Family Feud','تحدي الفرق وكشف الإجابات والدبل.'],['guess','🧠','خمنها','كلمة سرية، كشف، تخمين، ونقاط مستمرة.'],['market','💰','السوق','أجب بسرعة ثم خَلِّ البقية يحكمون.'],['bomb','💣','المفخخة','إجابة سريعة… لكن انتبه للمفاجأة.'],['last','🏆','الصملة','كل جولة أصعب من اللي قبلها.'],['bank','🏦','البنك','مخاطرة أعلى = مكسب أو خسارة أكبر.'],['million','👑','المليون','اصعد حتى القمة أو خاطر بكل شيء.']];
const cats=['🐾 حيوانات','🍔 أكلات','🎬 أفلام وشخصيات','🌍 أماكن','🏠 أشياء يومية','⚽ رياضات','⚽ لاعبين كرة قدم معروفين','👨‍💼 وظائف','✨ أشياء غريبة وممتعة','💎 أشياء فاخرة'];
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function sound(kind){try{audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);const now=audioCtx.currentTime;const map={click:[420,.07],buzz:[90,.22],tick:[700,.045],win:[880,.22],wrong:[130,.2],reveal:[520,.12],vote:[260,.08],million:[1000,.3]};const [f,d]=map[kind]||map.click;o.frequency.setValueAtTime(f,now);o.frequency.exponentialRampToValueAtTime(f*1.35,now+d);g.gain.setValueAtTime(.001,now);g.gain.exponentialRampToValueAtTime(.12,now+.01);g.gain.exponentialRampToValueAtTime(.001,now+d);o.start(now);o.stop(now+d+.03)}catch(e){}}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2300)}
function set(x){document.getElementById('app').innerHTML=`<div class="wrap">${x}</div>`}
function home(){set(`<div class="hero"><div class="pill">PLAY • COMPETE • WIN</div><h1 class="title">الساحة</h1><p class="sub">منصة ألعاب جماعية واحدة — كل لعبة لها نظامها وأجواؤها ومؤثراتها.</p><button class="btn red" style="font-size:20px" onclick="joinForm()">🎮 دخول غرفة</button></div><div class="grid" style="margin-top:18px">${games.map(g=>`<div class="game"><div class="ico">${g[1]}</div><h2>${g[2]}</h2><p class="muted">${g[3]}</p><button class="btn primary" onclick="createForm('${g[0]}')">✨ إنشاء غرفة</button><div class="small" style="margin-top:12px">تم إنشاء اللعبة من قبل أغيد</div></div>`).join('')}</div>`)}
function modes(t){if(t==='guess')return '';return `<h3>طريقة اللعب</h3><div class="grid3"><button class="mode selected" id="m-presenter" onclick="pickMode('presenter')">🎙️ مقدم + شاشة</button><button class="mode" id="m-display" onclick="pickMode('display')">🖥️ شاشة + لاعبين</button><button class="mode" id="m-players" onclick="pickMode('players')">👥 لاعبين</button></div>`}
function createForm(t){const g=games.find(x=>x[0]===t);window.selMode=t==='guess'?'players':'presenter';if(t==='family')return ffModes();set(`<div class="card"><div class="top"><div><div class="small">إنشاء غرفة</div><h1>${g[1]} ${g[2]}</h1></div><button class="btn dark" onclick="home()">رجوع</button></div>${modes(t)}${t==='guess'?`<h3>عدد الجولات</h3><div class="grid3">${[5,10,15,20].map(n=>`<button class="mode ${n===5?'selected':''}" id="r${n}" onclick="pickRounds(${n})">${n} جولات</button>`).join('')}</div>`:''}<input id="name" class="input" placeholder="اسمك"><button class="btn primary" style="width:100%;font-size:18px" onclick="create('${t}')">✨ إنشاء الغرفة</button></div>`)}
function pickMode(m){window.selMode=m;document.querySelectorAll('.mode').forEach(x=>x.classList.remove('selected'));document.getElementById('m-'+m)?.classList.add('selected')}
function pickRounds(n){window.selRounds=n;document.querySelectorAll('[id^=r]').forEach(x=>x.classList.remove('selected'));document.getElementById('r'+n)?.classList.add('selected')}
function ffModes(){window.ffRounds=5;set(`<div class="card"><div class="top"><h1>👨‍👩‍👧‍👦 Family Feud</h1><button class="btn dark" onclick="home()">رجوع</button></div><h3>عدد الجولات</h3><div class="grid3">${[5,10,15,20].map(n=>`<button class="mode ${n===5?'selected':''}" id="ff${n}" onclick="ffR(${n})">${n} جولات</button>`).join('')}</div><h3>طريقة اللعب</h3><div class="grid3"><button class="mode selected" onclick="ffM('presenter')">🎙️ مقدم + شاشة</button><button class="mode" onclick="ffM('display')">🖥️ شاشة + لاعبين</button><button class="mode" onclick="ffM('players')">👥 لاعبين</button></div><input id="name" class="input" placeholder="اسمك"><button class="btn primary" style="width:100%" onclick="createFF()">✨ إنشاء الغرفة</button></div>`);window.ffMode='presenter'}
function ffR(n){window.ffRounds=n;document.querySelectorAll('[id^=ff]').forEach(x=>x.classList.remove('selected'));document.getElementById('ff'+n)?.classList.add('selected')};function ffM(m){window.ffMode=m;document.querySelectorAll('.mode').forEach(x=>x.classList.remove('selected'));event.currentTarget.classList.add('selected')}
function createFF(){const n=document.getElementById('name')?.value.trim()||'المقدم';socket.emit('room:create',{game:'family',mode:window.ffMode,rounds:window.ffRounds||5,name:n,team:'A'})}
function create(t){const n=document.getElementById('name')?.value.trim()||'لاعب';socket.emit('room:create',{game:t,mode:window.selMode,maxRounds:window.selRounds||5,name:n})}
function joinForm(){set(`<div class="card"><div class="top"><h1>🎮 دخول غرفة</h1><button class="btn dark" onclick="home()">رجوع</button></div><p class="muted">أدخل رمز الغرفة فقط، ثم نعرض لك طريقة الدخول المناسبة.</p><input id="codeIn" class="input" maxlength="4" placeholder="A123 / B123 / C123 ..."><button class="btn red" style="width:100%" onclick="lookup()">متابعة</button></div>`)}
function lookup(){const c=document.getElementById('codeIn').value.trim().toUpperCase();if(!/^[A-G]\d{3}$/.test(c))return toast('اكتب رمزًا مثل A123');window.pending=c;socket.emit('room:inspect',{code:c})}
function joinOptions(info){const names={family:'👨‍👩‍👧‍👦 Family Feud',guess:'🧠 خمنها',market:'💰 السوق',bomb:'💣 المفخخة',last:'🏆 الصملة',bank:'🏦 البنك',million:'👑 المليون'};set(`<div class="card"><div class="top"><h1>${names[info.game]}</h1><span class="pill">${info.code}</span></div><input id="joinName" class="input" placeholder="اسمك">${info.game==='family'?'<select id="team" class="input"><option value="A">🔴 الفريق الأحمر</option><option value="B">🔵 الفريق الأزرق</option></select>':''}<button class="btn primary" style="width:100%" onclick="join()">دخول الغرفة</button></div>`)}
function join(){socket.emit('room:join',{code:window.pending,name:document.getElementById('joinName').value.trim()||'لاعب',team:document.getElementById('team')?.value||'A'})}
function displayForm(){set(`<div class="card"><h1>🖥️ شاشة عرض</h1><input id="dc" class="input" maxlength="4" placeholder="رمز الغرفة"><button class="btn primary" style="width:100%" onclick="socket.emit('room:display',{code:document.getElementById('dc').value.toUpperCase()})">تشغيل</button></div>`)}
function ffTeam(t){return `<div class="team ${t.id==='A'?'a':'b'}"><div><b>${t.id==='A'?'🔴':'🔵'} ${esc(t.name)}</b></div><div class="score">${t.score}</div><div>${'✕'.repeat(t.strikes)}${'○'.repeat(3-t.strikes)}</div><div class="small">${t.players.map(p=>esc(p.name)).join(' • ')||'لا يوجد لاعبين'}</div></div>`}
function ffAnswers(){return (G.answers||[]).map((a,i)=>`<div class="ans ${a.revealed?'reveal':'hidden'}">${a.revealed?`<b>${esc(a.text)}</b><span class="small">${a.points} نقطة</span>`:'؟'}${(role==='presenter'||(role==='player'&&G.mode!=='presenter'))&&!a.revealed?`<button class="btn red" style="margin-top:8px" onclick="ffReveal(${i})">كشف</button>`:''}${a.revealed&&!a.awarded&&(role==='presenter'||role==='player'&&G.mode!=='presenter')?`<div class="row" style="margin-top:8px"><button class="btn red" onclick="ffAward(${i},'A')">🔴 +${a.points}</button><button class="btn blue" onclick="ffAward(${i},'B')">🔵 +${a.points}</button></div>`:''}</div>`).join('')}
function ffScreen(){set(`<div class="card"><div class="top"><div><div class="small">رمز الغرفة</div><div class="code">${G.code}</div></div><div class="pill">الجولة ${G.currentRound}/${G.rounds}</div></div><div class="teams">${G.teams.map(ffTeam).join('')}</div><div class="q">${esc(G.question||'بانتظار السؤال…')}</div>${G.lock&&role==='display'?`<div class="buzz">🔔 ${esc(G.lock.name)} ضغط أولًا — ${G.lock.team==='A'?'الفريق الأحمر':'الفريق الأزرق'}<div class="small">الضغط يظهر هنا على شاشة العرض فقط</div></div>`:''}${G.answerLock?`<div class="buzz">✍️ ${esc(G.answerLock.name)} يجيب الآن</div>`:''}<div class="answers">${ffAnswers()}</div><div class="row" style="margin-top:15px">${role==='presenter'?`<button class="btn gold" onclick="ffStart()">🎲 ${G.phase==='lobby'?'ابدأ الجولة':'سؤال عشوائي'}</button>`:''}${(role==='presenter'||role==='player'&&G.mode!=='presenter')?`<button class="btn danger" onclick="ffStrike('A')">Strike 🔴</button><button class="btn danger" onclick="ffStrike('B')">Strike 🔵</button>`:''}</div></div>`)}
function ffPlayer(){const p=G.players.find(x=>x.id===me),tm=G.teams.find(t=>t.id===p?.team);let body='';if(G.phase==='lobby')body='<div class="q">بانتظار المقدم لبدء اللعبة</div>';else if(G.mode==='presenter')body=`<div class="q">${esc(G.question)}</div><div class="playerButtons"><button class="btn red bigBtn" onclick="sound('buzz');ffBuzz()" ${G.lock||G.answerLock?'disabled':''}>🔴 اضغط<br><span class="small">5 ثواني</span></button><button class="btn gold bigBtn" onclick="sound('million');ffDouble()" ${tm?.doubleUsed||G.lock||G.answerLock?'disabled':''}>⚡ دبل<br><span class="small">10 ثواني</span></button></div>`;else body=`<div class="q">${esc(G.question)}</div><div class="playerButtons"><button class="btn primary bigBtn" onclick="ffReady(false)" ${G.answerLock?'disabled':''}>✍️ أجاوب</button><button class="btn gold bigBtn" onclick="ffReady(true)" ${G.answerLock||tm?.doubleUsed?'disabled':''}>⚡ دبل</button></div>${G.answerLock?.id===me?`<div class="timer" id="tm">10</div><input id="ans" class="input" autofocus placeholder="اكتب إجابتك"><button class="btn primary" onclick="ffSubmit()">إرسال</button>`:''}`;set(`<div class="card center"><div class="top"><span class="code">${G.code}</span><button class="btn dark" onclick="home()">الرئيسية</button></div><h2>${esc(p?.name||'لاعب')}</h2><div class="teams">${G.teams.map(ffTeam).join('')}</div>${body}</div>`);if(G.answerLock?.id===me)tick(G.answerLock.until,'tm')}
function tick(until,id){clearInterval(window.ticker);window.ticker=setInterval(()=>{const e=document.getElementById(id);if(!e)return clearInterval(window.ticker);e.textContent=Math.max(0,Math.ceil((until-Date.now())/1000))},100)}
function ffStart(){socket.emit('ff:start')};function ffBuzz(){socket.emit('ff:buzz')};function ffDouble(){socket.emit('ff:answerReady',{double:true})};function ffReady(d){socket.emit('ff:answerReady',{double:d})};function ffSubmit(){socket.emit('ff:submit',{answer:document.getElementById('ans')?.value||''})};function ffReveal(i){sound('reveal');socket.emit('ff:reveal',{index:i})};function ffAward(i,t){socket.emit('ff:award',{index:i,team:t})};function ffStrike(t){sound('wrong');socket.emit('ff:strike',{team:t})}
function guessRender(){if(G.phase==='lobby')return guessLobby();if(G.phase==='results')return guessResults();if(G.phase==='finished')return guessFinal();const p=G.players.find(x=>x.id===me);set(`<div class="card"><div class="top"><div><div class="small">الجولة ${G.round}/${G.maxRounds}</div><h2>${esc(G.category)}</h2></div><span class="code">${G.code}</span></div><div class="notice center">🧠 اسأل أصحابك عن كلمتك، واكشف كلماتهم ثم خمّن.</div><div class="grid" style="margin-top:14px"><div class="card"><div class="small">كلمتك أنت</div><div class="millionQ">🔒 مخفية</div></div><div class="card"><div class="small">رصيدك</div><div class="score">${G.scores?.[me]||0}</div></div></div><h3>👀 كلمات اللاعبين</h3>${G.players.filter(x=>x.id!==me).map(x=>`<div class="scoreline"><div><b>${esc(x.name)}</b>${x.revealedWord?`<div class="ok">🔓 ${esc(x.revealedWord)}</div>`:'<div class="small">مخفية</div>'}</div><button class="btn primary" onclick="sound('reveal');gr('${x.id}')" ${x.revealedWord?'disabled':''}>${x.revealedWord?'مكشوفة':'🔓 اكشف'}</button></div>`).join('')}<div class="row"><input id="guessIn" class="input" placeholder="خمّن كلمتك"><button class="btn primary" onclick="gg()">🎯 تخمين</button></div><h3>الترتيب</h3>${G.players.slice().sort((a,b)=>(G.scores[b.id]||0)-(G.scores[a.id]||0)).map(x=>`<div class="scoreline"><span>${esc(x.name)}</span><b>${G.scores[x.id]||0}</b></div>`).join('')}</div>`)}
function guessLobby(){set(`<div class="card"><div class="top"><div><h1>🧠 خمنها</h1><div class="small">${G.code}</div></div><span class="pill">${G.maxRounds} جولات</span></div><h3>اختاروا الفئة — فئة جديدة كل جولة</h3><div class="grid3">${cats.map(c=>`<button class="mode ${G.category===c?'selected':''}" onclick="gc('${esc(c)}')">${c}</button>`).join('')}</div><h3>عدد الجولات</h3><div class="grid3">${[5,10,15,20].map(n=>`<button class="mode ${G.maxRounds===n?'selected':''}" onclick="socket.emit('guess:setRounds',{rounds:${n}})">${n}</button>`).join('')}</div><div class="players" style="margin-top:15px">${G.players.map(p=>`<div class="game"><b>${esc(p.name)}</b><div class="small">جاهز</div></div>`).join('')}</div><button class="btn gold" style="width:100%;margin-top:16px;font-size:19px" onclick="gs()">🚀 ابدأ اللعبة</button></div>`)}
function guessResults(){set(`<div class="card center"><div style="font-size:65px">🎉</div><h1>نتيجة الجولة ${G.round}</h1><div class="notice">${(G.roundWinners||[]).map((id,i)=>`${i+1}) ${esc(G.players.find(p=>p.id===id)?.name||'')} +${i===0?3:i===1?2:i===2?1:0}`).join('<br>')||'لا أحد عرفها'}</div><div class="grid">${G.players.slice().sort((a,b)=>(G.scores[b.id]||0)-(G.scores[a.id]||0)).map(p=>`<div class="game"><b>${esc(p.name)}</b><div class="score">${G.scores[p.id]||0}</div></div>`).join('')}</div><button class="btn primary" onclick="gnext()">اختيار فئة للجولة التالية ▶</button></div>`)}
function guessFinal(){const ps=G.players.slice().sort((a,b)=>(G.scores[b.id]||0)-(G.scores[a.id]||0));set(`<div class="card"><div class="center"><div style="font-size:70px">🏆</div><h1>Podium</h1><p class="muted">انتهت الجولات — هذه النتيجة النهائية</p></div><div class="podium">${[ps[1],ps[0],ps[2]].filter(Boolean).map((p,i)=>`<div class="place ${i===1?'first':i===0?'second':'third'}"><div style="font-size:45px">${i===1?'🥇':i===0?'🥈':'🥉'}</div><b>${esc(p.name)}</b><div class="score">${G.scores[p.id]||0}</div></div>`).join('')}</div><h2>سجل الجولات</h2>${(G.history||[]).map(h=>`<div class="scoreline"><span>ج${h.round} — ${esc(h.player)} — ${esc(h.answer)}</span><b>${h.correct?'+'+h.points:'خطأ'}</b></div>`).join('')}<button class="btn primary" style="width:100%;margin-top:12px" onclick="home()">🔄 لعبة جديدة</button></div>`);sound('win')}
function gc(c){sound('click');socket.emit('guess:category',{category:c})};function gs(){socket.emit('guess:start')};function gr(id){socket.emit('guess:reveal',{targetId:id})};function gg(){socket.emit('guess:guess',{answer:document.getElementById('guessIn')?.value||''})};function gnext(){socket.emit('guess:next')}
function marketRender(){const names=['💰 السوق'];let body='';if(G.phase==='lobby')body=`<div class="miniHero"><div style="font-size:65px">🛒</div><h1>السوق</h1><p class="sub">استعد… السؤال يظهر، 3 ثواني، ثم أول ضاغط يأخذ الدور.</p><button class="btn gold" onclick="marketStart()">🚀 ابدأ</button></div>`;else if(G.phase==='countdown')body=`<div class="marketQ">${esc(G.question)}</div><div class="center"><span class="pointsTag">${G.points} نقطة</span><div class="timer" id="mcd">3</div><p class="muted">استعدوا للضغط…</p></div>`;else if(G.phase==='buzz')body=`<div class="marketQ">${esc(G.question)}</div><div class="center"><span class="pointsTag">${G.points} نقطة</span><p>اضغط أولًا عندما تكون جاهزًا!</p><button class="press" onclick="sound('buzz');marketBuzz()">🔔 إجابة</button></div>`;else if(G.phase==='answer')body=`<div class="marketQ">${esc(G.question)}</div><div class="winner"><h2>🎙️ ${esc(G.current?.name)}</h2><p>هو صاحب الدور الآن</p><div class="timer" id="mat">5</div></div>`;else if(G.phase==='vote')body=`<div class="winner"><h2>هل قام ${esc(G.current?.name)} بالإجابة بشكل صحيح؟</h2><p class="muted">صوّتوا بصدق — صاحب الإجابة لا يصوّت.</p><div class="row"><button class="btn green" onclick="marketVote('yes')">✅ نعم</button><button class="btn red" onclick="marketVote('no')">❌ لا</button></div><p>التصويت: ${Object.values(G.votes||{}).filter(v=>v==='yes').length} نعم / ${Object.values(G.votes||{}).filter(v=>v==='no').length} لا</p></div>`;else body=`<div class="winner"><h1>${G.history?.[G.history.length-1]?.result==='صحيح'?'✅ إجابة صحيحة':'❌ الإجابة غير صحيحة'}</h1><div class="score">${G.scores[G.current?.id]||0}</div><p>${G.history?.[G.history.length-1]?.delta>0?'+'+G.history[G.history.length-1].delta:G.history?.[G.history.length-1]?.delta||0} نقطة</p><button class="btn gold" onclick="marketNext()">جولة جديدة ▶</button></div>`;set(`<div class="card"><div class="top"><div><div class="small">السوق • الجولة ${G.round}</div><div class="code">${G.code}</div></div><span class="pill">مؤثرات حماسية</span></div>${body}<h3>الترتيب</h3>${G.players.slice().sort((a,b)=>(G.scores[b.id]||0)-(G.scores[a.id]||0)).map(p=>`<div class="scoreline"><span>${esc(p.name)}</span><b>${G.scores[p.id]||0}</b></div>`).join('')}</div>`);if(G.phase==='countdown'&&G.countdownUntil)tick(G.countdownUntil,'mcd');if(G.phase==='answer'&&G.answerUntil)tick(G.answerUntil,'mat')}
function marketStart(){sound('click');socket.emit('market:start')};function marketBuzz(){socket.emit('market:buzz')};function marketVote(v){sound('vote');socket.emit('market:vote',{vote:v})};function marketNext(){socket.emit('market:next')}
function millionRender(){const st=G.playersState?.[me];if(G.phase==='lobby')return set(`<div class="card million"><div class="center"><div style="font-size:75px">👑</div><h1 class="title">المليون</h1><p class="sub">كل لاعب له مساره الخاص. ابدأ من الصفر واصعد حتى القمة.</p><button class="btn gold" onclick="millionStart()">🔥 ابدأ</button></div></div>`);if(!st)return set(`<div class="card"><h1>بانتظار دخول اللاعب…</h1></div>`);const ladder=G.ladder||[],level=Math.min(st.level,ladder.length-1);set(`<div class="card million"><div class="top"><div><div class="small">المليون</div><span class="code">${G.code}</span></div><div class="pill">رصيدك: ${st.bank||0}</div></div><div class="grid" style="margin-top:15px"><div><div class="ladder">${ladder.slice().reverse().map((v,ri)=>{const i=ladder.length-1-ri;return `<div class="step ${i===level?'active':''} ${G.guaranteed?.includes(v)?'safe':''}"><span>${i+1}</span><b>${v.toLocaleString()} ${G.guaranteed?.includes(v)?'🛡️':''}</b></div>`}).join('')}</div></div><div><div class="millionQ">${esc(st.question||'جاهز؟')}</div><div class="opts">${(st.options||[]).map((o,i)=>`<button class="opt" onclick="millionAnswer(${i})">${String.fromCharCode(65+i)} — ${esc(o)}</button>`).join('')}</div><div class="lifelines" style="margin-top:14px">${[['audience','👥 الجمهور'],['fifty','✂️ 50/50'],['change','🔄 تغيير'],['secure','🛡️ تأمين']].map(x=>`<button class="life ${st.lifelines?.[x[0]]?'':'off'}" onclick="millionLife('${x[0]}')">${x[1]}</button>`).join('')}</div><div class="row" style="margin-top:12px"><button class="btn dark" onclick="millionWalk()">🏳️ أنسحب</button><span class="pill">المبلغ المضمون: ${st.guaranteed||0}</span></div></div></div><h3>اللاعبون</h3>${G.players.map(p=>{const x=G.playersState[p.id];return `<div class="scoreline"><span>${esc(p.name)}</span><b>${x?.bank||0}</b></div>`}).join('')}</div>`)}
function millionStart(){sound('million');socket.emit('million:start')};function millionAnswer(i){sound('click');socket.emit('million:answer',{index:i})};function millionWalk(){socket.emit('million:walk')};function millionLife(t){sound('click');socket.emit('million:lifeline',{type:t})}
function miniRender(){const title={bomb:'💣 المفخخة',last:'🏆 الصملة',bank:'🏦 البنك'}[G.type]||G.type;return set(`<div class="card"><div class="top"><h1>${title}</h1><span class="code">${G.code}</span></div><div class="miniHero"><div style="font-size:60px">${G.type==='bomb'?'💣':G.type==='last'?'⚔️':'🏦'}</div><h2>${esc(G.current||'جاهزين؟')}</h2><p class="muted">واجهة جديدة + أصوات وتغذية بصرية. الجولة ${G.round}</p>${G.phase==='lobby'?'<button class="btn gold" onclick="ms()">🚀 ابدأ</button>':'<button class="btn primary" onclick="mp(10)">+10 نقاط</button> <button class="btn dark" onclick="mp(5)">+5 نقاط</button>'}</div><h3>الترتيب</h3>${G.players.map(p=>`<div class="scoreline"><span>${esc(p.name)}</span><b>${G.scores[p.id]||0}</b></div>`).join('')}</div>`)}function ms(){sound('click');socket.emit('mini:start')};function mp(n){sound('click');socket.emit('mini:score',{points:n})}
function render(){if(!G)return home();if(G.type==='family')return role==='display'||role==='presenter'?ffScreen():ffPlayer();if(G.type==='guess')return guessRender();if(G.type==='market')return marketRender();if(G.type==='million')return millionRender();return miniRender()}
socket.on('room:created',x=>{code=x.code;role=x.role;me=x.playerId||null;mode=x.mode||'';history.replaceState({},'',`/?code=${code}`);});socket.on('joined',x=>{code=x.code;role='player';me=x.playerId});socket.on('display:ok',x=>{code=x.code;role='display'});socket.on('room:info',joinOptions);socket.on('state',s=>{G=s;render()});socket.on('errorMsg',toast);socket.on('ff:wrong',x=>{sound('wrong');toast(`❌ خطأ — Strike ${x.strikes}/3`)});socket.on('ff:correct',x=>{sound('win');toast(`✅ صحيح +${x.points}`)});socket.on('guess:correct',x=>{sound('win');toast(`🎉 صحيح +${x.points}`)});socket.on('guess:wrong',()=>{sound('wrong');toast('❌ ليست هي')});socket.on('guess:revealed',()=>sound('reveal'));socket.on('market:wrong',()=>sound('wrong'));socket.on('million:win',x=>{sound('win');toast(`👑 مليون! ${x.name}`)});socket.on('million:wrong',x=>{sound('wrong');toast(`❌ ${x.name} عاد إلى ${x.bank}`)});home();
</script></body></html>
