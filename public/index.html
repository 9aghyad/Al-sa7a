<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الساحة</title><script src="/socket.io/socket.io.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#080c16;color:#fff;font-family:system-ui,Tahoma,Arial,sans-serif}.wrap{width:min(1500px,96vw);margin:auto;padding:22px}.card{background:#111a2ddd;border:1px solid #2f3b57;border-radius:25px;padding:22px;box-shadow:0 22px 70px #0008}.center{text-align:center}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.btn{border:0;border-radius:15px;padding:13px 17px;font-weight:900;cursor:pointer;background:#e9edf6;color:#10131b}.primary{background:#765cff;color:#fff}.red{background:#ef4052;color:#fff}.blue{background:#2385e8;color:#fff}.gold{background:#e4b735;color:#201700}.dark{background:#1a2438;color:#fff}.danger{background:#7e2634;color:#fff}.input,select{width:100%;background:#080e1a;color:#fff;border:1px solid #35435f;border-radius:13px;padding:13px;margin:6px 0 12px;font:inherit}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.muted{color:#9ba8c0}.pill{display:inline-flex;padding:7px 11px;border-radius:999px;background:#1b2740;border:1px solid #34445f}.hero{padding:58px 25px;text-align:center;background:radial-gradient(circle at 50% 0,#29375d,#0d1423 60%);border-radius:30px;border:1px solid #33415d}.hero h1{font-size:clamp(48px,8vw,90px);margin:10px}.games{margin-top:20px}.game{padding:24px;border-radius:22px;background:#121c2e;border:1px solid #31405c}.game h2{margin:0 0 7px}.game p{color:#aab7cb;min-height:44px}.room{font-size:60px;font-weight:1000;letter-spacing:8px;color:#ffd84d}.teams{display:grid;grid-template-columns:1fr 1fr;gap:14px}.team{padding:18px;border-radius:20px;background:#111a2b;border:2px solid #34425d}.team.a{border-color:#873242}.team.b{border-color:#2d66a7}.score{font-size:58px;font-weight:1000}.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.ans{min-height:95px;border-radius:18px;background:#1b2941;border:2px solid #34445f;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:25px;font-weight:1000;text-align:center}.ans.hidden{background:linear-gradient(145deg,#263756,#121c2f)}.q{font-size:clamp(28px,4vw,55px);font-weight:1000;text-align:center;margin:22px 0}.buzz{font-size:26px;font-weight:1000;text-align:center;padding:15px;border-radius:16px;background:#3b2430}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.bigBtn{width:100%;min-height:190px;font-size:42px;border-radius:30px}.playerButtons{display:grid;grid-template-columns:1fr 1fr;gap:12px}.timer{font-size:45px;font-weight:1000;color:#ffd84d}.list{display:grid;gap:9px}.mini{min-height:180px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.scoreline{display:flex;justify-content:space-between;padding:12px;background:#151f32;border-radius:14px;margin:7px 0}.mode{padding:18px;border:2px solid #34435e;border-radius:18px;cursor:pointer;background:#111a2c}.mode.selected{border-color:#765cff;background:#201b43}.small{font-size:13px;color:#9ba8c0}.ok{color:#65e6a4}.bad{color:#ff6879}.display .card{min-height:90vh}.reveal{animation:pop .4s ease}@keyframes pop{from{transform:scale(.8);opacity:.2}to{transform:none;opacity:1}}@media(max-width:800px){.grid,.teams,.playerButtons{grid-template-columns:1fr}.answers{grid-template-columns:1fr 1fr}.wrap{padding:11px}.hero{padding:40px 15px}.room{font-size:44px}.ans{min-height:80px;font-size:20px}}
</style></head><body><div id="app"><div class="wrap"><div class="hero"><h1>الساحة</h1><p class="muted">جاري تشغيل الساحة…</p></div></div></div><script>
const socket=io();const app=document.getElementById('app');let G=null,me=null,role='',gameType='',code='',mode='';
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const games=[['family','👨‍👩‍👧‍👦','Family Feud','تحدي الفرق وكشف الإجابات والدبل.'],['guess','🧠','خمنها','كل لاعب يحاول معرفة كلمته السرية.'],['market','💰','السوق','زايد واشترِ التحديات وارفع رصيدك.'],['bomb','💣','المفخخة','أسئلة سريعة قد تقلب النتيجة.'],['last','🏆','الصملة','آخر لاعب يبقى في الصدارة.'],['bank','🏦','البنك','تحديات ومخاطرة مقابل نقاط.'],['million','👑','المليون','اصعد في سلم الجوائز بالسؤال الصحيح.']];
function set(x){app.innerHTML=`<div class="wrap">${x}</div>`}function toast(x){alert(x)}function home(){set(`<div class="hero"><div class="small">PLAY • COMPETE • WIN</div><h1>الساحة</h1><p class="muted">كل ألعابكم في ساحة واحدة — اختاروا اللعبة وابدأوا.</p><button class="btn red" onclick="joinForm()">🎮 دخول غرفة</button></div><div class="games grid" style="margin-top:18px">${games.map(g=>`<div class="game"><div style="font-size:40px">${g[1]}</div><h2>${g[2]}</h2><p>${g[3]}</p><button class="btn primary" onclick="createForm('${g[0]}')">✨ إنشاء غرفة</button></div>`).join('')}</div>`)}
function createForm(t){
 const g=games.find(x=>x[0]===t); if(!g)return home();
 if(t==='family')return ffModes();
 set(`<div class="card"><div class="top"><div><div class="small">إنشاء غرفة</div><h1>${g[1]} ${g[2]}</h1></div><button class="btn dark" onclick="home()">رجوع</button></div><p class="muted">اختر عدد الجولات ثم اكتب اسمك.</p><div class="grid3"><button class="mode" onclick="setMiniRounds(5,this)">5 جولات</button><button class="mode" onclick="setMiniRounds(10,this)">10 جولات</button><button class="mode" onclick="setMiniRounds(15,this)">15 جولة</button><button class="mode" onclick="setMiniRounds(20,this)">20 جولة</button><button class="mode" onclick="setMiniRounds(0,this)">مخصص</button></div><input id="miniRounds" class="input" type="number" min="1" max="50" value="5" placeholder="عدد الجولات"><input id="name" class="input" placeholder="اسمك"><button class="btn primary" style="width:100%" onclick="create('${t}')">✨ إنشاء الغرفة</button></div>`)
}
function setMiniRounds(n,el){document.querySelectorAll('.mode').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');if(n)document.getElementById('miniRounds').value=n}

function ffModes(){set(`<div class="card"><div class="top"><div><div class="small">إنشاء غرفة</div><h1>👨‍👩‍👧‍👦 Family Feud</h1></div><button class="btn dark" onclick="home()">رجوع</button></div><p class="muted">اختر طريقة اللعب وعدد الجولات قبل إنشاء الغرفة.</p><div class="grid3"><button class="mode" id="ffr5" onclick="selectRounds(5)">5 جولات</button><button class="mode" id="ffr10" onclick="selectRounds(10)">10 جولات</button><button class="mode" id="ffr15" onclick="selectRounds(15)">15 جولة</button><button class="mode" id="ffr20" onclick="selectRounds(20)">20 جولة</button><button class="mode" id="ffrc" onclick="selectRounds('custom')">مخصص</button></div><input id="ffcustom" class="input" type="number" min="1" max="100" placeholder="عدد الجولات المخصص" style="display:none"><div class="list" style="margin-top:14px"><button class="mode" onclick="createFF('presenter')"><h2>🎙️ مقدم + شاشة عرض + لاعبين</h2><p class="muted">المقدم يبدأ السؤال، واللاعبون يستخدمون Buzzer وDouble.</p></button><button class="mode" onclick="createFF('display')"><h2>🖥️ شاشة عرض + لاعبين</h2><p class="muted">إجابات كتابية، 10 ثوانٍ، وتصحيح ذكي.</p></button><button class="mode" onclick="createFF('players')"><h2>👥 لاعبين فقط</h2><p class="muted">إجابات كتابية، Double وجولات عشوائية.</p></button></div></div>`); window.ffRounds=5}
function selectRounds(n){if(n==='custom'){document.getElementById('ffcustom').style.display='block';window.ffRounds=5}else{document.getElementById('ffcustom').style.display='none';window.ffRounds=n}document.querySelectorAll('.mode').forEach(x=>x.classList.remove('selected'));const el=document.getElementById(n==='custom'?'ffrc':'ffr'+n);if(el)el.classList.add('selected')}
function createFF(m){let rounds=window.ffRounds||5;if(rounds==='custom')rounds=parseInt(document.getElementById('ffcustom')?.value||5,10);rounds=Math.max(1,Math.min(100,rounds||5));mode=m;const name=m==='presenter'?'المقدم':prompt('اكتب اسمك')||'';if(!name)return;socket.emit('room:create',{game:'family',mode:m,name,team:'A',rounds})}
function create(t){const n=document.getElementById('name')?.value.trim()||'لاعب';const rounds=Math.max(1,Math.min(50,parseInt(document.getElementById('miniRounds')?.value||5,10)));socket.emit('room:create',{game:t,name:n,rounds})}
function joinForm(){set(`<div class="card"><div class="top"><div><div class="small">الانضمام</div><h1>🎮 دخول غرفة</h1></div><button class="btn dark" onclick="home()">رجوع</button></div><p class="muted">أدخل رمز الغرفة فقط. سنعرض لك خيارات اللعبة بعد التحقق من الرمز.</p><input id="codeIn" class="input" maxlength="4" placeholder="رمز الغرفة مثل A123 أو B123"><button class="btn red" style="width:100%" onclick="lookupRoom()">متابعة</button></div>`)}
function lookupRoom(){const c=document.getElementById('codeIn')?.value.trim().toUpperCase();if(!/^[A-G]\d{3}$/.test(c))return toast('اكتب رمز غرفة صحيح مثل A123');window.pendingRoomCode=c;socket.emit('room:inspect',{code:c})}
function joinOptions(info){const names={family:'👨‍👩‍👧‍👦 Family Feud',guess:'🧠 خمنها',market:'💰 السوق',bomb:'💣 المفخخة',last:'🏆 الصملة',bank:'🏦 البنك',million:'👑 المليون'};const title=names[info.game]||'اللعبة';let extra=info.game==='family'?`<select id="teamIn" class="input"><option value="A">🔴 الفريق الأحمر</option><option value="B">🔵 الفريق الأزرق</option></select>`:'';set(`<div class="card"><div class="top"><div><div class="small">الغرفة ${esc(info.code)}</div><h1>${title}</h1></div><button class="btn dark" onclick="home()">رجوع</button></div><p class="muted">الغرفة موجودة. اختر بيانات الدخول الخاصة بك.</p><input id="nameIn" class="input" placeholder="اسمك">${extra}<button class="btn primary" style="width:100%" onclick="join()">دخول الغرفة</button></div>`)}
function join(){const c=window.pendingRoomCode,n=document.getElementById('nameIn')?.value.trim()||'لاعب';socket.emit('room:join',{code:c,name:n,team:document.getElementById('teamIn')?.value||'A'})}
function displayForm(){set(`<div class="card"><h1>🖥️ شاشة عرض</h1><input id="dc" class="input" maxlength="4" placeholder="رمز الغرفة"><button class="btn primary" style="width:100%" onclick="joinDisplay()">تشغيل شاشة العرض</button></div>`)}function joinDisplay(){socket.emit('room:display',{code:document.getElementById('dc').value.trim().toUpperCase()})}
function ffTeam(t){return `<div class="team ${t.id==='A'?'a':'b'}"><div>${t.id==='A'?'🔴':'🔵'} ${esc(t.name)}</div><div class="score">${t.score}</div><div>${'✕'.repeat(t.strikes)}${'○'.repeat(3-t.strikes)}</div><div class="small">${t.players.map(p=>esc(p.name)).join(' • ')||'لا يوجد'}</div></div>`}
function answers(){return (G.answers||[]).map((a,i)=>`<div class="ans ${a.revealed?'reveal':'hidden'}">${a.revealed?`<b>${esc(a.text)}</b><span class="small">${a.points} نقطة</span>`:'؟'}${(role==='presenter'||(role==='player'&&G.mode!=='presenter'))&&!a.revealed?`<button class="btn red" style="margin-top:7px" onclick="ffReveal(${i})">كشف</button>`:''}${a.revealed&&!a.awarded&&(role==='presenter'||role==='player'&&G.mode!=='presenter')?`<div style="display:flex;gap:5px;margin-top:7px"><button class="btn red" onclick="ffAward(${i},'A')">+${a.points} 🔴</button><button class="btn blue" onclick="ffAward(${i},'B')">+${a.points} 🔵</button></div>`:''}</div>`).join('')}
function ffScreen(){set(`<div class="display"><div class="card"><div class="top"><div><div class="small">رمز الغرفة</div><div class="room">${G.code}</div></div><button class="btn dark" onclick="home()">الرئيسية</button></div><div class="teams">${G.teams.map(ffTeam).join('')}</div><div class="q">${esc(G.question||'بانتظار السؤال…')}</div>${G.lock?`<div class="buzz">🔔 ${esc(G.lock.name)} ضغط أولًا — ${G.lock.team==='A'?'الفريق الأحمر':'الفريق الأزرق'}</div>`:''}${G.answerLock?`<div class="buzz">✍️ ${esc(G.answerLock.name)} يجيب الآن — ${Math.max(0,Math.ceil((G.answerLock.until-Date.now())/1000))} ث</div>`:''}<div class="answers">${answers()}</div><div class="actions">${role==='presenter'?`<button class="btn gold" onclick="ffStart()">🎲 ${G.phase==='lobby'?'ابدأ':'سؤال عشوائي'}</button>`:''}${role==='player'&&G.phase==='lobby'?`<button class="btn gold" onclick="ffStart()">🎲 ابدأ</button>`:''}${role==='presenter'||role==='player'&&G.mode!=='presenter'?`<button class="btn danger" onclick="ffStrike('A')">Strike 🔴</button><button class="btn danger" onclick="ffStrike('B')">Strike 🔵</button>`:''}</div></div></div>`)}
function ffPlayer(){const p=G.players.find(x=>x.id===me);let body='';if(G.phase==='lobby'){body='<div class="q">بانتظار بدء اللعبة</div><button class="btn gold" onclick="ffStart()">🎲 ابدأ اللعبة</button>';}else if(G.mode==='presenter'){body=`<div class="q">${esc(G.question)}</div><div class="playerButtons"><button class="btn red bigBtn" onclick="ffBuzz()" ${G.lock||G.answerLock?'disabled':''}>🔴 اضغط<br><span class="small">بلوك 5 ثواني</span></button><button class="btn gold bigBtn" onclick="ffDouble()" ${G.answerLock||G.teams.find(t=>t.id===p?.team)?.doubleUsed?'disabled':''}>⚡ دبل<br><span class="small">بلوك 10 ثواني</span></button></div>`;}else{body=`<div class="q">${esc(G.question)}</div><div class="playerButtons"><button class="btn primary bigBtn" onclick="ffReady(false)" ${G.answerLock?'disabled':''}>✍️ أجاوب كتابيًا<br><span class="small">10 ثواني</span></button><button class="btn gold bigBtn" onclick="ffReady(true)" ${G.answerLock||G.teams.find(t=>t.id===p?.team)?.doubleUsed?'disabled':''}>⚡ دبل كتابي<br><span class="small">10 ثواني</span></button></div>${G.answerLock?.id===me?`<div style="margin-top:12px"><div class="timer" id="tm">10</div><input id="ans" class="input" autofocus placeholder="اكتب إجابتك" onkeydown="if(event.key==='Enter')ffSubmit()"><button class="btn primary" onclick="ffSubmit()">إرسال</button></div>`:''}`;}set(`<div class="card center"><div class="top"><div><div class="small">رمز الغرفة</div><div class="room">${G.code}</div></div><button class="btn dark" onclick="home()">الرئيسية</button></div><h1>مرحبًا ${esc(p?.name||'لاعب')}</h1><div class="teams">${G.teams.map(ffTeam).join('')}</div>${body}</div>`);if(G.answerLock?.id===me)timer(G.answerLock.until)}
function presenter(){ffScreen()}function timer(u){clearInterval(window.ti);window.ti=setInterval(()=>{const e=document.getElementById('tm');if(!e)return clearInterval(window.ti);e.textContent=Math.max(0,Math.ceil((u-Date.now())/1000));},100)}
function ffStart(){socket.emit('ff:start')}function ffBuzz(){socket.emit('ff:buzz')}function ffDouble(){socket.emit('ff:answerReady',{double:true})}function ffReady(d){socket.emit('ff:answerReady',{double:d})}function ffSubmit(){socket.emit('ff:submit',{answer:document.getElementById('ans')?.value||''})}function ffReveal(i){socket.emit('ff:reveal',{index:i})}function ffAward(i,t){socket.emit('ff:award',{index:i,team:t})}function ffStrike(t){socket.emit('ff:strike',{team:t})}
function guessRender(){let body='';if(G.phase==='lobby'){body=`<h2>اختاروا الفئة</h2><div class="grid3">${Object.keys(GC).map(c=>`<button class="btn ${G.category===c?'primary':'dark'}" onclick="gc('${esc(c)}')">${c}</button>`).join('')}</div><p class="muted">اللاعبون: ${G.players.map(p=>esc(p.name)).join(' • ')}</p><button class="btn gold" onclick="gs()">🚀 ابدأ الجولة</button>`;}else{body=`<h2>كلمتك مخفية عنك 🤫</h2><p class="muted">اكشف كلمات الآخرين لتساعدك على التخمين.</p><div class="list">${G.players.filter(p=>p.id!==me).map(p=>`<div class="scoreline"><b>${esc(p.name)}</b><button class="btn primary" onclick="gr('${p.id}')">${p.revealedWord?'👀 '+esc(p.revealedWord):'🔓 اكشف'}</button></div>`).join('')}</div><input id="guessIn" class="input" placeholder="خمن كلمتك"><button class="btn primary" onclick="gg()">تخمين</button><h3>النقاط</h3>${G.players.slice().sort((a,b)=>(G.scores[b.id]||0)-(G.scores[a.id]||0)).map(p=>`<div class="scoreline"><span>${esc(p.name)}</span><b>${G.scores[p.id]||0}</b></div>`).join('')}`;}set(`<div class="card"><div class="top"><div><div class="small">🧠 خمنها • ${esc(G.category)}</div><div class="room">${G.code}</div></div><button class="btn dark" onclick="home()">الرئيسية</button></div>${body}</div>`)}
const GC={"🐾 حيوانات":1,"🍔 أكلات":1,"🎬 أفلام وشخصيات":1,"🌍 أماكن":1,"🏠 أشياء يومية":1,"⚽ رياضات":1,"⚽ لاعبين كرة قدم معروفين":1,"👨‍💼 وظائف":1,"✨ أشياء غريبة وممتعة":1,"💎 أشياء فاخرة":1};function gc(c){socket.emit('guess:category',{category:c})}function gs(){socket.emit('guess:start')}function gr(id){socket.emit('guess:reveal',{targetId:id})}function gg(){socket.emit('guess:guess',{answer:document.getElementById('guessIn')?.value||''})}
function miniRender(){
 const p=G.players.find(x=>x.id===me); const name={market:'💰 السوق',bomb:'💣 المفخخة',last:'🏆 الصملة',bank:'🏦 البنك',million:'👑 المليون'}[G.type];
 let body='';
 if(G.phase==='lobby') body=`<div class="center"><h2>جاهزين؟</h2><p class="muted">الجولات: ${G.rounds}</p><button class="btn gold" onclick="ms()">🚀 ابدأ اللعبة</button></div>`;
 else if(G.type==='market'){
   const countdown=G.phase==='countdown'?`<div class="timer">${Math.max(0,Math.ceil((G.deadline-Date.now())/1000))}</div>`:'';
   body=`<div class="q">${esc(G.question)}</div>${countdown}${G.phase==='buzz'?`<button class="btn red bigBtn" onclick="mbuzz()">🔔 اضغط أولًا</button>`:''}${G.lock?.id===me&&G.phase==='answer'?`<input id="miniAns" class="input" placeholder="إجابتك"><button class="btn primary" onclick="marketAnswer()">إرسال</button>`:''}${G.phase==='vote'?`<div class="buzz">هل قام ${esc(G.players.find(x=>x.id===G.answering)?.name||'اللاعب')} بالإجابة بشكل صحيح؟</div><div class="actions"><button class="btn primary" onclick="mv(true)">نعم</button><button class="btn danger" onclick="mv(false)">لا</button></div>`:''}${G.phase==='result'?`<div class="buzz">انتهت الجولة</div><button class="btn gold" onclick="ms()">الجولة التالية</button>`:''}`;
 }
 else if(G.type==='bomb'){
   body=`<div class="q">${esc(G.question)}</div>${G.phase==='buzz'?`<button class="btn red bigBtn" onclick="mbuzz()">💣 اضغط</button>`:''}${G.phase==='answer'&&G.answerLock?.id===me?`<div class="timer">3</div><input id="miniAns" class="input" autofocus placeholder="إجابتك"><button class="btn primary" onclick="bombAnswer()">إرسال</button>`:''}${G.phase==='suspense'?`<div class="buzz" style="animation:pop .3s infinite alternate">⚠️ جاري كشف النتيجة...</div>`:''}${G.phase==='result'?`<div class="buzz">${G.result?.kind==='trap'?'💥 إجابة مفخخة!':G.result?.kind==='listed'?'✅ إجابة صحيحة':G.result?.kind==='outside'?'🟡 إجابة صحيحة خارج اللائحة':'❌ إجابة خاطئة'}<br>${G.result?.points>0?'+':''}${G.result?.points||0} نقطة</div><button class="btn gold" onclick="ms()">الجولة التالية</button>`:''}`;
 }
 else if(G.type==='last'){
   const active=G.players.filter(x=>!G.eliminated?.includes(x.id));
   body=`<div class="q">${esc(G.question)}</div>${G.phase==='answer'&&active.some(x=>x.id===me)?`<input id="miniAns" class="input" placeholder="إجابتك"><button class="btn primary" onclick="lastAnswer()">إرسال</button>`:''}${G.phase==='result'?`<div class="buzz">${(G.matchups||[]).length?'💥 تطابق/إقصاء!':'انتهت الجولة'}</div><button class="btn gold" onclick="lastNext()">الجولة التالية</button>`:''}${G.phase==='finished'?`<div class="q">🏆 الفائز: ${esc(G.winner?.name||'')}</div>`:''}`;
 }
 else if(G.type==='bank'){
   body=`<div class="q">${esc(G.question)}</div><div class="grid3"><button class="mode" onclick="bankRisk(500)">500</button><button class="mode" onclick="bankRisk(1500)">1500</button><button class="mode" onclick="bankRisk(3000)">3000</button></div>${G.depositOpen&&G.balances?.[me]>0?`<div class="actions"><input id="dep" class="input" placeholder="مبلغ الإيداع"><button class="btn primary" onclick="bankDeposit()">🏦 إيداع</button></div>`:''}${G.phase==='bankResult'?`<div class="buzz">${G.result?.success?'✅ نجحت المخاطرة':'❌ خسرت المخاطرة'} (${G.result?.amount||0})</div><button class="btn gold" onclick="ms()">الجولة التالية</button>`:''}`;
 }
 else {
   body=`<div class="q">${esc(G.question?.q||'')}</div><div class="list">${(G.options||[]).map((x,i)=>x?`<button class="mode" onclick="millionAnswer(${i})">${i+1}. ${esc(x)}</button>`:'').join('')}</div><div class="actions"><button class="btn dark" onclick="millionLife('audience')">👥 الجمهور</button><button class="btn dark" onclick="millionLife('fifty')">50/50</button><button class="btn dark" onclick="millionLife('change')">🔄 تغيير السؤال</button><button class="btn gold" onclick="millionLife('secure')">🔒 تأمين</button><button class="btn primary" onclick="millionWalk()">الانسحاب</button></div><div class="q" style="font-size:28px">الجائزة: ${millionPrize(G.level?.[me]||0)}</div>${G.phase==='result'?`<div class="buzz">انتهت محاولتك</div>`:''}`;
 }
 const scores=Object.entries(G.scores||{}).map(([id,v])=>({id,v,name:G.players.find(p=>p.id===id)?.name||'لاعب'})).sort((a,b)=>b.v-a.v);
 set(`<div class="card"><div class="top"><div><div class="small">${name}</div><div class="room">${G.code}</div></div><button class="btn dark" onclick="home()">الرئيسية</button></div>${body}<h3>الترتيب</h3>${scores.map((x,i)=>`<div class="scoreline"><span>${i+1}. ${esc(x.name)}</span><b>${x.v}</b></div>`).join('')}</div>`);
}
function millionPrize(i){return [1000,5000,10000,25000,50000,100000,250000,500000,1000000][Math.max(0,Math.min(8,i))].toLocaleString('en-US')}
function ms(){socket.emit('mini:start')}function mbuzz(){socket.emit('mini:buzz')}function marketAnswer(){socket.emit('market:answer',{answer:document.getElementById('miniAns')?.value||''})}function mv(yes){socket.emit('market:vote',{yes})}function bombAnswer(){socket.emit('bomb:answer',{answer:document.getElementById('miniAns')?.value||''})}function lastAnswer(){socket.emit('last:answer',{answer:document.getElementById('miniAns')?.value||''})}function lastNext(){socket.emit('last:next')}function bankRisk(n){socket.emit('bank:risk',{amount:n})}function bankDeposit(){socket.emit('bank:deposit',{amount:document.getElementById('dep')?.value||0})}function millionAnswer(i){socket.emit('million:answer',{index:i})}function millionLife(k){socket.emit('million:life',{kind:k})}function millionWalk(){socket.emit('million:walk')}

function render(){if(!G)return home();if(G.type==='family')return role==='display'||role==='presenter'?ffScreen():ffPlayer();if(G.type==='guess')return guessRender();return miniRender()}
socket.on('room:created',x=>{code=x.code;role=x.role;me=x.playerId;mode=x.mode;history.replaceState({},'',`/?code=${code}`)});socket.on('joined',x=>{code=x.code;role='player';me=x.playerId});socket.on('display:ok',x=>{code=x.code;role='display'});socket.on('room:info',joinOptions);socket.on('state',s=>{G=s;render()});socket.on('errorMsg',toast);socket.on('ff:wrong',x=>{window.lastEvent=`❌ خطأ — Strike ${x.strikes}/3`;render()});socket.on('ff:correct',x=>{window.lastEvent=`✅ صحيح +${x.points}`;render()});socket.on('guess:correct',x=>{window.lastEvent=`🎉 صحيح +${x.points}`;render()});socket.on('guess:wrong',()=>{window.lastEvent='❌ ليست هي';render()});home();
</script></body></html>
