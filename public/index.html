const games=[['family','👨‍👩‍👧‍👦','Family Feud','تحدي الفرق وكشف الإجابات والدبل.'],['guess','🧠','خمنها','كلمة سرية، كشف، تخمين، ونقاط مستمرة.'],['market','💰','السوق','أجب بسرعة ثم خَلِّ البقية يحكمون.'],['bomb','💣','المفخخة','إجابة سريعة… لكن انتبه للمفاجأة.'],['last','🏆','الصملة','كل جولة أصعب من اللي قبلها.'],['bank','🏦','البنك','مخاطرة أعلى = مكسب أو خسارة أكبر.'],['million','👑','المليون','اصعد حتى القمة أو خاطر بكل شيء.']];
const cats=['🍔 أكلات','🐾 حيوانات','🌍 دول','🏠 أشياء منزلية','⚽ لاعبو كرة القدم','👨‍⚕️ وظائف'];
const SESSION_KEY='arena.sessions';function loadSessions(){try{const a=JSON.parse(localStorage.getItem(SESSION_KEY)||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}}function saveSession(roomCode,gameName,token,name){if(!roomCode||!token)return;let a=loadSessions().filter(x=>x.code!==roomCode);a.unshift({code:roomCode,game:gameName,token,name:name||'لاعب',updatedAt:Date.now()});localStorage.setItem(SESSION_KEY,JSON.stringify(a.slice(0,12)))}function forgetSession(roomCode){localStorage.setItem(SESSION_KEY,JSON.stringify(loadSessions().filter(x=>x.code!==roomCode)))}
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const audioFiles={click:'/audio/click.wav',buzz:'/audio/buzz.wav',tick:'/audio/tick.wav',win:'/audio/win.wav',wrong:'/audio/wrong.wav',reveal:'/audio/reveal.wav',vote:'/audio/vote.wav',million:'/audio/million.wav',suspense:'/audio/suspense.wav',explosion:'/audio/explosion.wav',countdown:'/audio/countdown.wav'};
function sound(kind){try{const a=new Audio(audioFiles[kind]||audioFiles.click);a.volume=kind==='buzz'?.7:.58;a.currentTime=0;a.play().catch(()=>{});}catch(e){}}
let marketAudio={phase:'',interval:null,suspense:null,lastSec:null};
function stopMarketAudio(){if(marketAudio.interval){clearInterval(marketAudio.interval);marketAudio.interval=null}if(marketAudio.suspense){try{marketAudio.suspense.pause();marketAudio.suspense.currentTime=0}catch(e){}marketAudio.suspense=null}marketAudio.lastSec=null}
function playMarketSound(kind,volume){try{const a=new Audio(audioFiles[kind]||audioFiles.click);a.volume=volume??(kind==='suspense'?.38:.58);a.currentTime=0;a.play().catch(()=>{});return a}catch(e){return null}}
function marketAudioSync(state){if(!state||state.type!=='market'){stopMarketAudio();marketAudio.phase='';return}const phase=state.phase;if(phase!==marketAudio.phase){stopMarketAudio();marketAudio.phase=phase}
  if(!['countdown','buzz','answer'].includes(phase))return;
  const until=phase==='countdown'?state.countdownUntil:(phase==='buzz'?state.buzzUntil:state.answerUntil);
  if(!until)return;
  const durationSec=Math.max(0,Math.ceil((until-Date.now())/1000));
  if(phase==='countdown'){
    marketAudio.lastSec=durationSec;
    if(durationSec>0)playMarketSound('countdown',.62);
    marketAudio.interval=setInterval(()=>{const n=Math.max(0,Math.ceil((until-Date.now())/1000));if(n>0&&n!==marketAudio.lastSec){marketAudio.lastSec=n;playMarketSound('countdown',.62)}if(n<=0){clearInterval(marketAudio.interval);marketAudio.interval=null}},80);
  }else{
    marketAudio.lastSec=durationSec;
    marketAudio.suspense=playMarketSound('suspense',.34);if(marketAudio.suspense)marketAudio.suspense.loop=true;
    if(durationSec>0)playMarketSound('tick',.62);
    marketAudio.interval=setInterval(()=>{const n=Math.max(0,Math.ceil((until-Date.now())/1000));if(n>0&&n!==marketAudio.lastSec){marketAudio.lastSec=n;playMarketSound('tick',.62)}if(n<=0){clearInterval(marketAudio.interval);marketAudio.interval=null}},80);
  }
}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2300)}
function set(x){document.getElementById('app').innerHTML=`<div class="wrap">${x}</div>`}
function tick(until,id){const el=document.getElementById(id);if(!el)return;const left=()=>Math.max(0,Math.ceil((until-Date.now())/1000));el.textContent=left();const iv=setInterval(()=>{const e=document.getElementById(id);if(!e){clearInterval(iv);return}const n=left();e.textContent=n;if(n<=0){clearInterval(iv);}},100)}
function home(){const ss=loadSessions();const resume=ss.length?`<div class="card sessionPanel"><div class="top"><div><h2 style="margin:0">🟡 لديك ألعاب غير مكتملة</h2><div class="muted">يمكنك الرجوع لنفس الغرفة واللاعب والنقاط من حيث توقفت.</div></div><span class="pill">${ss.length} جلسة</span></div><div class="grid3" style="margin-top:14px">${ss.map(x=>`<div class="game sessionTile"><span class="gameBadge">${esc(x.game||'لعبة')}</span><div class="code" style="font-size:30px;letter-spacing:4px">${esc(x.code)}</div><b>${esc(x.name||'لاعب')}</b><span class="small">آخر نشاط: ${new Date(x.updatedAt||Date.now()).toLocaleString('ar-SA')}</span><button class="btn primary" onclick="resumeSaved('${esc(x.code)}')">🔄 العودة للعبة</button><button class="btn dark" onclick="forgetSession('${esc(x.code)}');home()">حذف من القائمة</button></div>`).join('')}</div></div>`:'';set(`<div class="hero"><div class="pill">PLAY • COMPETE • WIN</div><h1 class="title">الساحة</h1><p class="sub">منصة ألعاب جماعية واحدة — كل لعبة لها نظامها وأجواؤها ومؤثراتها.</p><div class="row" style="max-width:760px;margin:22px auto 0"><button class="btn primary" onclick="sound('click');joinForm()">🎮 انضمام لغرفة</button><button class="btn blue" onclick="sound('click');displayForm()">🖥️ شاشة العرض</button></div></div>${resume}<div class="grid" style="margin-top:18px">${games.map(g=>`<div class="game" onclick="sound('click');createForm('${g[0]}')"><div class="ico">${g[1]}</div><h2>${g[2]}</h2><p class="muted">${g[3]}</p><button class="btn primary" onclick="event.stopPropagation();sound('click');createForm('${g[0]}')">✨ إنشاء غرفة</button><div class="small" style="margin-top:12px">تم إنشاء اللعبة من قبل أغيد</div></div>`).join('')}</div>`)}
function resumeSaved(c){const x=loadSessions().find(s=>s.code===String(c).toUpperCase());if(!x)return home();code=x.code;sessionToken=x.token;role='player';pendingGame=(x.game||'').includes('Family')?'family':pendingGame;const m=code[0]==='A'?code[1]:'';if(code[0]==='A'){saveSession(code,x.game,x.token,x.name);return location.href='/games/family-feud/players?code='+encodeURIComponent(code)+'&mode='+encodeURIComponent(m)}socket.emit('room:resume',{code,sessionToken})}
function modes(t){if(t==='guess')return '';if(t==='market')return `<h3>طريقة اللعب</h3><div class="marketModeGrid"><button class="mode selected marketModeCard" id="m-presenter" onclick="pickMode('presenter')"><b>🎙️ مقدم + شاشة + لاعبين</b><span>مقدم للتحكم والحكم • شاشة عرض • لاعبين مع Buzz وDouble</span></button><button class="mode marketModeCard" id="m-players" onclick="pickMode('players')"><b>👥 لاعبين فقط</b><span>لاعبون يتنافسون والتصويت الجماعي يحسم الإجابة</span></button></div>`;return `<h3>طريقة اللعب</h3><div class="grid3"><button class="mode selected" id="m-presenter" onclick="pickMode('presenter')">🎙️ مقدم + شاشة</button><button class="mode" id="m-display" onclick="pickMode('display')">🖥️ شاشة + لاعبين</button><button class="mode" id="m-players" onclick="pickMode('players')">👥 لاعبين</button></div>`}
function createForm(t){const g=games.find(x=>x[0]===t);window.selMode=t==='guess'?'players':'presenter';window.selRounds=t==='guess'?5:10;if(t==='family')return ffModes();if(t==='bomb')return bombModes();set(`<div class="card"><div class="top"><div><div class="small">إنشاء غرفة</div><h1>${g[1]} ${g[2]}</h1></div><button class="btn dark" onclick="home()">رجوع</button></div>${modes(t)}<h3>عدد الجولات</h3><div class="grid3">${[5,10,15,20,30].map(n=>`<button class="mode ${n===window.selRounds?'selected':''}" id="r${n}" onclick="pickRounds(${n})">${n} جولات</button>`).join('')}</div><input id="name" class="input" placeholder="اسمك"><button class="btn primary" style="width:100%;font-size:18px" onclick="create('${t}')">✨ إنشاء الغرفة</button></div>`)}
function pickMode(m){window.selMode=m;document.querySelectorAll('.mode').forEach(x=>x.classList.remove('selected'));document.getElementById('m-'+m)?.classList.add('selected')}
function pickRounds(n){window.selRounds=n;document.querySelectorAll('[id^=r]').forEach(x=>x.classList.remove('selected'));document.getElementById('r'+n)?.classList.add('selected')}
function ffModes(){window.ffRounds=5;window.ffMode='1';set(`<div class="card"><div class="top"><h1>👨‍👩‍👧‍👦 Family Feud</h1><button class="btn dark" onclick="home()">رجوع</button></div><h3>عدد الجولات</h3><div class="grid3">${[5,10,15,20].map(n=>`<button class="mode ${n===5?'selected':''}" onclick="ffR(${n})">${n} جولات</button>`).join('')}</div><h3>طريقة اللعب</h3><div class="grid3"><button class="mode selected" onclick="ffM('1')">🎙️ لعب شفهي — مقدم + شاشة</button><button class="mode" onclick="ffM('2')">✍️ لعب كتابي — مقدم + شاشة</button><button class="mode" onclick="ffM('3')">👥 لاعبين فقط</button></div><input id="name" class="input" placeholder="اسمك"><button class="btn primary" style="width:100%" onclick="createFF()">✨ إنشاء الغرفة</button></div>`)}
function ffR(n){window.ffRounds=n;document.querySelectorAll('[id^=ff]').forEach(x=>x.classList.remove('selected'));document.getElementById('ff'+n)?.classList.add('selected')};function ffM(m){window.ffMode=m;document.querySelectorAll('.mode').forEach(x=>x.classList.remove('selected'));event.currentTarget.classList.add('selected')}
function createFF(){pendingGame='family';const n=document.getElementById('name')?.value.trim()||'المقدم';socket.emit('room:create',{game:'family',mode:window.ffMode,rounds:window.ffRounds||5,name:n,team:'A'})}
function bombModes(){window.bombMode='1';window.bombRounds=10;set(`<div class="card"><div class="top"><div><div class="small">إنشاء غرفة</div><h1>💣 المفخخة</h1></div><button class="btn dark" onclick="home()">رجوع</button></div><p class="muted">ثلاثة أنماط مستقلة: مقدم + شاشة + لاعبين، شاشة + لاعبين، أو لاعبين فقط.</p><h3>طريقة اللعب</h3><div class="grid3"><button class="mode selected" id="bm1" onclick="bombM('1')">🎙️ مقدم + شاشة + لاعبين</button><button class="mode" id="bm2" onclick="bombM('2')">🖥️ شاشة + لاعبين</button><button class="mode" id="bm3" onclick="bombM('3')">👥 لاعبين فقط</button></div><h3>عدد الجولات</h3><div class="grid3">${[5,10,15,20,30].map(n=>`<button class="mode ${n===10?'selected':''}" id="br${n}" onclick="bombR(${n})">${n} جولات</button>`).join('')}</div><input id="name" class="input" placeholder="اسمك"><select id="bombTeam" class="input"><option value="A">🔴 الفريق الأحمر</option><option value="B">🔵 الفريق الأزرق</option></select><button class="btn primary" style="width:100%;font-size:18px" onclick="createBomb()">💣 إنشاء الغرفة والدخول كلاعب</button></div>`)}
function bombM(m){window.bombMode=m;document.querySelectorAll('[id^=bm]').forEach(x=>x.classList.remove('selected'));document.getElementById('bm'+m)?.classList.add('selected')}
function bombR(n){window.bombRounds=n;document.querySelectorAll('[id^=br]').forEach(x=>x.classList.remove('selected'));document.getElementById('br'+n)?.classList.add('selected')}
function createBomb(){pendingGame='bomb';const n=document.getElementById('name')?.value.trim()||'لاعب';const t=document.getElementById('bombTeam')?.value||'A';socket.emit('room:create',{game:'bomb',mode:window.bombMode||'1',maxRounds:window.bombRounds||10,name:n,team:t})}
function create(t){pendingGame=t;const n=document.getElementById('name')?.value.trim()||'لاعب';socket.emit('room:create',{game:t,mode:window.selMode,maxRounds:window.selRounds||10,name:n})}
function joinForm(){set(`<div class="card"><div class="top"><h1>🎮 انضمام لغرفة</h1><button class="btn dark" onclick="home()">رجوع</button></div><p class="muted">أدخل الكود فقط. سيتم التعرف على اللعبة والنمط تلقائيًا من الكود.</p><input id="codeIn" class="input" maxlength="4" inputmode="text" autocomplete="off" placeholder="A101 / A201 / A301 / B123 ..."><button class="btn red" style="width:100%" onclick="lookup()">متابعة</button></div>`);document.getElementById('codeIn')?.focus()}
function lookup(){const c=document.getElementById('codeIn').value.trim().toUpperCase();if(!/^(?:A[1-3]\d{2}|[B-G]\d{3})$/.test(c))return toast('اكتب كودًا صحيحًا مثل A101 أو A201 أو A301');window.pending=c;const local=loadSessions().find(x=>x.code===c);if(local){code=c;sessionToken=local.token;role='player';socket.emit('room:resume',{code,sessionToken});return}joinOptions({code:c,game:c[0]==='A'?'family':({B:'guess',C:'market',D:'bomb',E:'last',F:'bank',G:'million'}[c[0]]||'')})}
function joinOptions(info){const names={family:'👨‍👩‍👧‍👦 Family Feud',guess:'🧠 خمنها',market:'💰 السوق',bomb:'💣 المفخخة',last:'🏆 الصملة',bank:'🏦 البنك',million:'👑 المليون'};const mode=info.game==='family'?({1:'🎙️ النمط الشفهي',2:'✍️ النمط الكتابي',3:'👥 نمط اللاعبين فقط'}[String(info.code||'')[1]]||'') : info.game==='bomb'?({1:'🎙️ مقدم + شاشة + لاعبين',2:'🖥️ شاشة + لاعبين',3:'👥 لاعبين فقط'}[String(info.code||'')[1]]||'') : info.game==='market'?(info.mode==='presenter'?'🎙️ مقدم + شاشة + لاعبين':'👥 لاعبين فقط'):'';set(`<div class="card"><div class="top"><h1>${names[info.game]||'🎮 اللعبة'}</h1><span class="pill">${info.code}</span></div>${mode?`<div class="notice">${mode}<br><span class="small">تم تحديد طريقة اللعب تلقائيًا من الكود.</span></div>`:''}<input id="joinName" class="input" placeholder="اسمك" autocomplete="nickname">${info.game==='family'||info.game==='bomb'?'<select id="team" class="input"><option value="A">🔴 الفريق الأحمر</option><option value="B">🔵 الفريق الأزرق</option></select>':''}<button class="btn primary" style="width:100%" onclick="join()">دخول الغرفة</button></div>`);document.getElementById('joinName')?.focus()}
function leaveRoom(){const leaving=code;try{socket.emit('room:leave',{code:leaving});forgetSession(leaving)}catch(e){}code='';sessionToken='';me=null;G=null;setTimeout(()=>location.href='/',80)}
function join(){const c=window.pending;const n=document.getElementById('joinName').value.trim()||'لاعب';const t=document.getElementById('team')?.value||'A';if(/^A[1-3]\d{2}$/.test(c)){localStorage.setItem('arena.pending.join',JSON.stringify({code:c,name:n,team:t,at:Date.now()}));location.href='/games/family-feud/players?code='+encodeURIComponent(c)+'&mode='+encodeURIComponent(c[1])+'&name='+encodeURIComponent(n)+'&team='+encodeURIComponent(t);return}socket.emit('room:join',{code:c,name:n,team:t})}
function displayForm(){set(`<div class="card"><div class="top"><h1>🖥️ شاشة العرض</h1><button class="btn dark" onclick="home()">رجوع</button></div><p class="muted">أدخل الكود وسيتم تحديد طريقة اللعب تلقائيًا من الغرفة.</p><input id="dc" class="input" maxlength="4" placeholder="A1XX / A2XX / B123 ..."><button class="btn primary" style="width:100%" onclick="openDisplayByCode()">تشغيل الشاشة</button></div>`)}
function openDisplayByCode(){const c=document.getElementById('dc').value.trim().toUpperCase();if(!/^(?:A[1-3]\d{2}|[B-G]\d{3})$/.test(c))return toast('اكتب كودًا صحيحًا مثل A101 أو A201 أو B123');socket.emit('room:display',{code:c})}
function ffTeam(t,showStatus=false){const buzz=t.id===G?.lock?.team?G.lock:null;const ans=t.id===G?.answerLock?.team?G.answerLock:null;return `<div class="team ${t.id==='A'?'a':'b'} ${showStatus&&ans?.double?'doubleActive':''}"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><b>${t.id==='A'?'🔴':'🔵'} ${esc(t.name)}</b>${showStatus&&buzz?`<span class="teamStatus buzzStatus stageFlash">🔔 ${esc(buzz.name)}</span>`:''}${showStatus&&ans?.double?`<span class="teamStatus doubleStatus stageFlash">⚡ دبل</span>`:''}</div><div class="score">${t.score}</div><div>${'✕'.repeat(t.strikes)}${'○'.repeat(3-t.strikes)}</div><div class="small">${t.players.map(p=>esc(p.name)).join(' • ')||'لا يوجد لاعبين'}</div></div>`}
function ffAnswers(){return (G.answers||[]).map((a,i)=>`<div class="ans ${a.revealed?'reveal':'hidden'}">${a.revealed?`<b>${esc(a.text)}</b><span class="small">${a.points} نقطة</span>`:'؟'}${(role==='presenter'||(role==='player'&&G.mode!=='presenter'))&&!a.revealed?`<button class="btn red" style="margin-top:8px" onclick="ffReveal(${i})">كشف</button>`:''}${a.revealed&&!a.awarded&&(role==='presenter'||role==='player'&&G.mode!=='presenter')?`<div class="row" style="margin-top:8px"><button class="btn red" onclick="ffAward(${i},'A')">🔴 +${a.points}</button><button class="btn blue" onclick="ffAward(${i},'B')">🔵 +${a.points}</button></div>`:''}</div>`).join('')}
function ffScreen(){set(`<div class="card"><div class="top"><div><div class="small">رمز الغرفة</div><div class="code">${G.code}</div></div><div class="pill">الجولة ${G.currentRound}/${G.rounds}</div></div><div class="teams">${G.teams.map(t=>ffTeam(t,true)).join('')}</div><div class="q">${esc(G.question||'بانتظار السؤال…')}</div><div class="answers">${ffAnswers()}</div><div class="row" style="margin-top:15px">${role==='presenter'?`<button class="btn gold" onclick="ffStart()">🎲 ${G.phase==='lobby'?'ابدأ الجولة':'سؤال عشوائي'}</button>`:''}${(role==='presenter'||role==='player'&&G.mode!=='presenter')?`<button class="btn danger" onclick="ffStrike('A')">Strike 🔴</button><button class="btn danger" onclick="ffStrike('B')">Strike 🔵</button>`:''}</div></div>`)}

valid?'+1':'-1'}</b></div>`).join('')}</div>`:''}</div>`;else{const bal=G.balances?.[me]??10000;body=`<div class="gameIntro ${t.class}"><span class="pill">الجولة ${G.round}/${G.maxRounds}</span><h2 class="marketQ">${esc(G.question)}</h2><div class="balanceHero">💳 ${bal.toLocaleString()}</div>${G.phase==='bank'?`<div class="riskGrid">${[500,1500,3000].map(a=>`<button class="mode ${G.selectedRisk?.[me]===a?'selected':''}" onclick="bankRisk(${a})">💰 ${a.toLocaleString()}</button>`).join('')}</div>${G.selectedRisk?.[me]?`<input id="bankIn" class="input" placeholder="اكتب إجابتك"><button class="btn primary bigGameAction" onclick="bankAnswer()">🏦 أجب</button>`:'<div class="notice">اختر مستوى المخاطرة أولًا.</div>'}`:''}</div>`}set(`<div class="card gameShell ${t.class}"><div class="top"><div><div class="small">${t.icon} ${t.name}</div><div class="code">${G.code}</div></div><span class="pill">${G.players.length} لاعبين</span></div>${body}<h3>الترتيب</h3>${G.players.slice().sort((a,b)=>(G.scores?.[b.id]||0)-(G.scores?.[a.id]||0)).map(x=>`<div class="scoreline"><span>${esc(x.name)} ${x.id===me?'⭐':''} ${x.online===false?'🟡':''}</span><b>${G.type==='bank'?(G.balances?.[x.id]??10000).toLocaleString():G.scores?.[x.id]||0}</b></div>`).join('')}</div>`);if(G.type==='last'&&G.phase==='turn'&&G.turnPlayer===me)tick(G.answerUntil,'lat');if(G.type==='bomb'&&G.phase==='bombAnswer')tick(G.answerUntil,'bat')}
function miniDisplay(){const t=miniTheme(G.type);set(`<div class="card gameShell ${t.class}" style="min-height:90vh"><div class="top"><div><div class="small">${t.icon} ${t.name} • شاشة العرض</div><div class="code">${G.code}</div></div><span class="pill">${G.round}/${G.maxRounds}</span></div><div class="gameIntro"><div class="gameIcon">${t.icon}</div><h1>${t.name}</h1><h2 class="marketQ">${esc(G.question||'بانتظار البداية')}</h2>${G.current?`<div class="winner stageFlash"><h2>🔥 ${esc(G.current.name)}</h2></div>`:''}</div><div class="grid">${G.players.map(p=>`<div class="game"><b>${esc(p.name)}</b><div class="score">${G.type==='bank'?(G.balances?.[p.id]??10000).toLocaleString():G.scores?.[p.id]||0}</div></div>`).join('')}</div></div>`)}
function miniPresenter(){const t=miniTheme(G.type);set(`<div class="card gameShell ${t.class}" style="min-height:90vh"><div class="top"><div><div class="small">${t.icon} لوحة المقدم • ${t.name}</div><div class="code">${G.code}</div></div><button class="btn dark" onclick="window.open('/display?code=${G.code}','_blank')">🖥️ الشاشة</button></div><div class="gameIntro"><h1>${t.icon} ${t.name}</h1><p>${esc(G.question||'جاهز؟')}</p><button class="btn gold bigGameAction" onclick="${G.phase==='lobby'?'ms()':G.type==='bomb'?'bombNext()':G.type==='last'?'lastNext()':'bankNext()'}">${G.phase==='lobby'?'🚀 بدء اللعبة':'الجولة التالية ▶'}</button></div>${G.players.map(p=>`<div class="scoreline"><span>${esc(p.name)} ${p.online===false?'🟡 غير متصل':''}</span><b>${G.type==='bank'?(G.balances?.[p.id]??10000).toLocaleString():G.scores?.[p.id]||0}</b></div>`).join('')}</div>`)}

function ffDisplay(){set(`<div class="card" style="min-height:90vh;background:radial-gradient(circle at 50% 0,rgba(124,92,255,.16),transparent 38%),linear-gradient(180deg,#090b14,#05060b)"><div class="top"><div><div class="small">الساحة • شاشة العرض</div><div class="code">${G.code}</div></div><span class="pill">${G.currentRound||0} / ${G.rounds||0}</span></div><div class="teams">${G.teams.map(t=>ffTeam(t,true)).join('')}</div><div class="q">${esc(G.question||'بانتظار المقدم…')}</div><div class="answers">${(G.answers||[]).map((a,i)=>`<div class="ans ${a.revealed?'reveal':'hidden'}">${a.revealed?`<b>${esc(a.text)}</b><span class="small">${a.awardedPoints||a.points} نقطة</span>`:'؟'}</div>`).join('')}</div></div>`)}
function ffPresenter(){set(`<div class="card" style="min-height:90vh"><div class="top"><div><div class="small">لوحة المقدم</div><div class="code">${G.code}</div></div><div class="row"><button class="btn dark" onclick="window.open('/display?code=${G.code}','_blank')">🖥️ فتح الشاشة</button><button class="btn dark" onclick="leaveRoom()">🚪 خروج</button><button class="btn dark" onclick="home()">الرئيسية</button></div></div><div class="teams">${G.teams.map(ffTeam).join('')}</div><div class="notice">📋 <b>لوحة الإجابات الخاصة بالمقدم</b> — الإجابات كاملة هنا، ولا تظهر للاعبين/الشاشة إلا بعد الكشف.</div><div class="q">${esc(G.question||'بانتظار بدء الجولة…')}</div><div class="answers presenterAnswers">${(G.answers||[]).map((a,i)=>`<div class="ans ${a.revealed?'reveal':'hidden'}"><div class="answerNo">${i+1}</div><b>${esc(a.text)}</b><span class="small">${a.points} نقطة • ${a.revealed?'مكشوفة':'مخفية'}</span>${!a.revealed?`<button class="btn red" style="margin-top:8px" onclick="ffReveal(${i})">كشف الإجابة</button>`:''}${a.revealed&&!a.awarded?`<div class="row" style="margin-top:8px"><button class="btn red" onclick="ffAward(${i},'A')">🔴 +${a.points}</button><button class="btn blue" onclick="ffAward(${i},'B')">🔵 +${a.points}</button></div>`:''}</div>`).join('')}</div><div class="row" style="margin-top:18px"><button class="btn gold" onclick="ffStart()">🎲 ${G.phase==='lobby'?'ابدأ الجولة':'سؤال عشوائي'}</button><button class="btn blue" onclick="ffChange()">🔄 تغيير السؤال</button><button class="btn danger" onclick="ffStrike('A')">Strike 🔴</button><button class="btn danger" onclick="ffStrike('B')">Strike 🔵</button><button class="btn green" onclick="ffResetStrikes('A')">تصفير 🔴</button><button class="btn green" onclick="ffResetStrikes('B')">تصفير 🔵</button></div></div>`)}
function marketDisplay(){const last=G.history?.[G.history.length-1];let body='';if(G.phase==='lobby')body=`<div class="marketHero"><div class="marketLogo">🛒</div><div class="eyebrow">THE MARKET</div><h1>السوق</h1><p>بانتظار المقدم…</p><div class="roundChip">ج${G.round+1} / ${G.maxRounds}</div></div>`;else if(G.phase==='countdown')body=`<div class="marketStage questionStage"><span class="stageLabel">السؤال</span><h1 class="marketQuestion">${esc(G.question)}</h1><div class="countRing" id="mcd">3</div></div>`;else if(G.phase==='points')body=`<div class="marketStage pointsStage stageFlash"><span class="stageLabel">قيمة الجولة</span><h1 class="marketQuestion">${esc(G.question)}</h1><div class="megaPoints">${G.points}<small>نقطة</small></div></div>`;else if(G.phase==='buzz')body=`<div class="marketStage buzzStage"><span class="stageLabel">⚡ اضغطوا الآن</span><h1 class="marketQuestion">${esc(G.question)}</h1><div class="megaPoints">${G.points}<small>نقطة</small></div><div class="timer" id="mbuzz">5</div><div class="notice">أول لاعب يضغط يحصل على فرصة الإجابة</div></div>`;else if(G.phase==='answer')body=`<div class="marketStage answerStage stageFlash"><span class="stageLabel">${G.current?.double?'⚡ DOUBLE':'🔥 اللاعب'}</span><h1>${esc(G.current?.name)}</h1><div class="answerBadge">${G.points*(G.current?.double?2:1)} نقطة</div><div class="timer hugeTimer" id="mat">5</div><p>وقت الإجابة</p></div>`;else if(G.phase==='judge')body=`<div class="judgePanel"><span class="stageLabel">🎙️ انتظار حكم المقدم</span><h1>${esc(G.current?.name)}</h1><div class="judgeValue">${G.current?.double?'⚡ DOUBLE • ':''}${G.points*(G.current?.double?2:1)} نقطة</div></div>`;else if(G.phase==='vote')body=`<div class="voteStage"><span class="stageLabel">🗳️ تصويت</span><h1>اللاعبون يحكمون</h1><h2>${esc(G.current?.name)}</h2><div class="voteCount">نعم ${Object.values(G.votes||{}).filter(v=>v==='yes').length} • لا ${Object.values(G.votes||{}).filter(v=>v==='no').length}</div></div>`;else if(G.phase==='finished')body=`<div class="marketHero"><div class="marketLogo">🏆</div><h1>انتهت اللعبة</h1></div>`;else body=`<div class="marketResult stageFlash"><div class="resultIcon">${last?.result==='صحيح'?'✅':last?.result==='تعادل'?'⚖️':'❌'}</div><h1>${last?.result==='صحيح'?'إجابة صحيحة':last?.result==='تعادل'?'تعادل':'إجابة غير صحيحة'}</h1><div class="resultDelta ${last?.delta>0?'positive':last?.delta<0?'negative':'neutral'}">${last?.delta>0?'+':''}${last?.delta||0}</div></div>`;set(`<div class="card marketShell displayMarket"><div class="marketTop"><div><div class="marketBrand">🛒 السوق • شاشة العرض</div><div class="code">${G.code}</div></div><div class="marketTopMeta"><span>ج${G.round}/${G.maxRounds}</span></div></div>${body}<div class="marketScores">${G.players.slice().sort((a,b)=>(G.scores[b.id]||0)-(G.scores[a.id]||0)).map((p,i)=>`<div class="marketScoreRow"><span><i>${i+1}</i>${esc(p.name)}</span><b>${G.scores[p.id]||0}</b></div>`).join('')}</div></div>`);if(G.phase==='countdown')tick(G.countdownUntil,'mcd');if(G.phase==='buzz')tick(G.buzzUntil,'mbuzz');if(G.phase==='answer')tick(G.answerUntil,'mat')}
function millionDisplay(){set(`<div class="card million" style="min-height:90vh"><div class="top"><div><div class="small">المليون • شاشة العرض</div><div class="code">${G.code}</div></div><span class="pill">كل لاعب في مساره</span></div><div class="grid">${G.players.map(p=>{const x=G.playersState?.[p.id]||{};return `<div class="game"><b>${esc(p.name)}</b><div class="score">${(x.bank||0).toLocaleString()}</div><div class="small">${x.active?'🔥 مستمر':'⏸️ متوقف'}</div></div>`}).join('')}</div></div>`)}
function millionPresenter(){set(`<div class="card million" style="min-height:90vh"><div class="top"><div><div class="small">لوحة المقدم • المليون</div><div class="code">${G.code}</div></div><button class="btn dark" onclick="window.open('/display?code=${G.code}','_blank')">🖥️ الشاشة</button></div><div class="grid">${G.players.map(p=>{const x=G.playersState?.[p.id]||{};return `<div class="game"><h2>${esc(p.name)}</h2><div class="score">${(x.bank||0).toLocaleString()}</div><p>${x.active?'مستمر':'متوقف'}</p></div>`}).join('')}</div><button class="btn gold" onclick="millionStart()">🔥 بدء اللعبة</button></div>`)}
function miniDisplay(){miniRender();}
function miniPresenter(){miniRender();}

function render(){if(!G)return home();if(G.type==='family')return role==='display'?ffDisplay():role==='presenter'?ffPresenter():ffPlayer();if(G.type==='guess')return guessRender();if(G.type==='market')return role==='display'?marketDisplay():marketRender();if(G.type==='million')return role==='display'?millionDisplay():role==='presenter'?millionPresenter():millionRender();return role==='display'?miniDisplay():role==='presenter'?miniPresenter():miniRender()}
socket.on('room:created',x=>{code=x.code;role=x.role;me=x.playerId||null;mode=x.mode||'';sessionToken=x.sessionToken||sessionToken;if(role==='player'&&sessionToken)saveSession(code,({family:'Family Feud',guess:'خمنها',market:'السوق',bomb:'المفخخة',last:'الصملة',bank:'البنك',million:'المليون'}[pendingGame]||'لعبة'),sessionToken,document.getElementById('name')?.value||'لاعب');if(pendingGame==='bomb'&&role==='player'){const n=document.getElementById('name')?.value||'لاعب';const t=x.team||document.getElementById('bombTeam')?.value||'A';if(String(mode)==='3'){location.href='/games/bomb/players?code='+encodeURIComponent(code)+'&name='+encodeURIComponent(n)+'&team='+encodeURIComponent(t)+'&sessionToken='+encodeURIComponent(sessionToken||'');return}location.href='/games/bomb/roles?code='+encodeURIComponent(code)+'&mode='+encodeURIComponent(mode)+'&name='+encodeURIComponent(n)+'&team='+encodeURIComponent(t)+'&sessionToken='+encodeURIComponent(sessionToken||'');return}if(pendingGame==='bomb'&&role==='player'){location.href='/games/bomb/players?code='+encodeURIComponent(code)+'&name='+encodeURIComponent(document.getElementById('name')?.value||'')+'&team=A&sessionToken='+encodeURIComponent(sessionToken||'');return}history.replaceState({},'',`/${role==='presenter'?'presenter':role==='display'?'display':'player'}?code=${code}`);});socket.on('joined',x=>{code=x.code;role='player';me=x.playerId;sessionToken=x.sessionToken||sessionToken;const gameName=({family:'Family Feud',guess:'خمنها',market:'السوق',bomb:'المفخخة',last:'الصملة',bank:'البنك',million:'المليون'}[pendingGame]||'لعبة');saveSession(code,gameName,sessionToken,document.getElementById('joinName')?.value||document.getElementById('name')?.value||'لاعب');if(x.code[0]==='A'){location.href='/games/family-feud/players?code='+encodeURIComponent(x.code)+'&mode='+encodeURIComponent(x.code[1]);return}if(x.code[0]==='D'){location.href='/games/bomb/players?code='+encodeURIComponent(x.code)+'&name='+encodeURIComponent(document.getElementById('joinName')?.value||'')+'&team='+encodeURIComponent(document.getElementById('team')?.value||'A')+'&sessionToken='+encodeURIComponent(sessionToken||'');return}render()});socket.on('disconnect',()=>{if(role==='player'&&code)toast('🟡 انقطع الاتصال مؤقتًا… سنحاول إعادتك لنفس الجلسة.');});socket.on('connect',()=>{if(role==='player'&&code&&sessionToken){socket.emit('room:resume',{code,sessionToken});}});socket.on('display:ok',x=>{code=x.code;role='display';if(code[0]==='D'){location.href='/games/bomb/display?code='+encodeURIComponent(code);return}});socket.on('room:info',joinOptions);let prevPhase='';socket.on('state',s=>{const old=G;G=s;if(role==='player'&&sessionToken)saveSession(code,({family:'Family Feud',guess:'خمنها',market:'السوق',bomb:'المفخخة',last:'الصملة',bank:'البنك',million:'المليون'}[s?.type||pendingGame]||'لعبة'),sessionToken,s?.players?.find(x=>x.id===me)?.name||'لاعب');const changed=s?.phase!==prevPhase;prevPhase=s?.phase||'';if(s?.type==='market'){marketAudioSync(s);if(changed&&s.phase==='results')sound(s.history?.[s.history.length-1]?.result==='صحيح'?'win':'wrong')}else if(changed){if(s.phase==='countdown')sound('countdown');else if(s.phase==='buzz'||s.phase==='question')sound('buzz');else if(s.phase==='answer'||s.phase==='bombAnswer'||s.phase==='turn'||s.phase==='judge')sound('suspense');else if(s.phase==='vote')sound('vote');else if(s.phase==='results'||s.phase==='lastResult'||s.phase==='bankResult')sound('win');else if(s.phase==='finished')sound('win');}if(s?.type==='bomb'&&s.phase==='bombResult')sound(s.result?.kind==='trap'?'explosion':s.result?.kind==='listed'||s.result?.kind==='outside'?'correct':'wrong');if(s?.type==='family'&&s.answerLock?.double){sound('suspense');try{navigator.vibrate?.([80,50,120,50,180])}catch(e){}}render()});socket.on('errorMsg',toast);socket.on('ff:wrong',x=>{sound('wrong');toast(`❌ خطأ — Strike ${x.strikes}/3`)});socket.on('ff:correct',x=>{sound('win');toast(x.smart?`🧠 تم احتسابها من قبل التصحيح الذكي — +${x.points}`:`✅ إجابة صحيحة +${x.points}`)});socket.on('guess:correct',x=>{sound('win');toast(`🎉 صحيح +${x.points}`)});socket.on('guess:wrong',()=>{sound('wrong');toast('❌ ليست هي')});socket.on('market:wrong',()=>sound('wrong'));socket.on('market:vote',()=>sound('vote'));socket.on('guess:revealed',()=>sound('reveal'));socket.on('million:audience',()=>sound('vote'));socket.on('million:win',x=>{sound('win');toast(`👑 مليون! ${x.name}`)});socket.on('million:wrong',x=>{sound('wrong');toast(`❌ ${x.name} عاد إلى ${x.bank}`)});const pathName=location.pathname;if(pathName==='/display'){role='display';const q=new URLSearchParams(location.search).get('code');if(q)socket.emit('room:display',{code:q});else displayForm();}else if(pathName==='/presenter'){role='presenter';const q=new URLSearchParams(location.search).get('code');if(q){code=q;socket.emit('room:presenter',{code:q})}else home();}else if(pathName==='/player'){role='player';const q=new URLSearchParams(location.search).get('code');if(q){const c=q.toUpperCase();if(/^A[1-3]\d{2}$/.test(c)){location.replace('/games/family-feud/players?code='+encodeURIComponent(c)+'&mode='+encodeURIComponent(c[1]));}else{window.pending=c;const saved=loadSessions().find(x=>x.code===c);if(saved){code=c;sessionToken=saved.token;socket.emit('room:resume',{code,sessionToken})}else joinForm()}}else home();}else home();

/* Family Feud flow v24 - dedicated role pages, based on v20 */
function ffModes(){window.ffRounds=5;window.ffMode='1';set(`<div class="card"><div class="top"><div><div class="small">الساحة • اللعبة</div><h1>👨‍👩‍👧‍👦 Family Feud</h1></div><button class="btn dark" onclick="home()">رجوع</button></div><h3>عدد الجولات</h3><div class="grid3">${[5,10,15,20].map(n=>`<button class="mode ${n===5?'selected':''}" id="ff${n}" onclick="ffR(${n})">${n} جولات</button>`).join('')}</div><h3>طريقة اللعب</h3><div class="grid3"><button class="mode selected" id="ffm-1" onclick="ffM('1')">🎙️ لعب شفهي — مقدم + شاشة</button><button class="mode" id="ffm-2" onclick="ffM('2')">✍️ لعب كتابي — مقدم + شاشة</button><button class="mode" id="ffm-3" onclick="ffM('3')">👥 لاعبين فقط</button></div><button class="btn primary" style="width:100%;margin-top:18px;font-size:19px" onclick="ffContinue()">متابعة ▶</button></div>`)}
function ffR(n){window.ffRounds=n;document.querySelectorAll('[id^="ff"]').forEach(x=>x.classList.remove('selected'));document.getElementById('ff'+n)?.classList.add('selected')}
function ffM(m){window.ffMode=m;document.querySelectorAll('[id^="ffm-"]').forEach(x=>x.classList.remove('selected'));document.getElementById('ffm-'+m)?.classList.add('selected')}
function ffContinue(){sound('click');location.href='/games/family-feud/?rounds='+(window.ffRounds||5)+'&mode='+(window.ffMode||'presenter')}

</script></body></html>
