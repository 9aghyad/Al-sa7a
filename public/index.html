<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>الساحة</title><script src="/socket.io/socket.io.js"></script><style>
:root{--bg:#070a14;--card:#10172a;--card2:#151e35;--line:#2b3857;--muted:#9aa8c1;--white:#f7f8ff;--purple:#765cff;--red:#ef4052;--blue:#3c82ff;--gold:#f4c95d;--green:#35d39a;--shadow:0 24px 80px #0008}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#202b4a 0,#090c17 42%,#05070e 100%);color:var(--white);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}.app{width:min(1500px,96vw);margin:auto;padding:20px 0 45px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{display:flex;align-items:center;gap:12px}.mark{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:30px;background:linear-gradient(135deg,#765cff,#ef4052);box-shadow:0 14px 50px #0007}.brand h1{margin:0;font-size:28px}.muted{color:var(--muted)}.hero{margin-top:20px;padding:52px 24px;border:1px solid #354260;border-radius:32px;background:linear-gradient(145deg,#182343,#0e1527);box-shadow:var(--shadow);text-align:center}.hero .eyebrow{font-weight:900;letter-spacing:3px;color:#aab6d0;font-size:12px}.hero h2{font-size:clamp(42px,8vw,88px);line-height:1;margin:18px 0 10px}.hero h2 span{background:linear-gradient(90deg,#bdaeff,#fff,#ff9aaa);-webkit-background-clip:text;color:transparent}.hero p{max-width:700px;margin:0 auto;color:#aeb9cd;font-size:17px;line-height:1.8}.btn{border:1px solid #354260;background:#18233a;color:#fff;border-radius:16px;padding:13px 18px;font-weight:900;transition:.15s;box-shadow:0 10px 30px #0002}.btn:hover{transform:translateY(-1px);filter:brightness(1.08)}.primary{background:linear-gradient(135deg,#765cff,#6848ef);border-color:#866fff}.red{background:linear-gradient(135deg,#ef4052,#c92c3f);border-color:#ff5b6b}.blue{background:linear-gradient(135deg,#3c82ff,#2868da);border-color:#5b99ff}.gold{background:linear-gradient(135deg,#f4c95d,#e9ae34);color:#16110a;border-color:#ffe28b}.dark{background:#121a2b}.danger{background:#7e2230;border-color:#a73444}.games{margin-top:30px}.head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:14px}.head h2{margin:3px 0 0;font-size:34px}.kicker{color:#99a8c6;font-weight:900;letter-spacing:2px;font-size:12px}.pill{display:inline-flex;padding:7px 11px;border-radius:999px;background:#18243c;border:1px solid #34425f;color:#d4dced;font-size:12px}.gameGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.game{border:1px solid #33415f;border-radius:26px;background:linear-gradient(145deg,#121b2e,#0c1220);padding:22px;display:flex;gap:18px;align-items:center;min-height:190px;position:relative;overflow:hidden}.game.active{border-color:#6f5cff88;box-shadow:0 18px 60px #0005}.gameIcon{width:74px;height:74px;border-radius:22px;display:grid;place-items:center;font-size:37px;background:#202c46;flex:none}.gameInfo{flex:1}.gameInfo h3{font-size:27px;margin:0 0 7px}.gameInfo p{color:#aab6cb;line-height:1.65;margin:0}.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.tags span{font-size:11px;padding:6px 9px;border-radius:999px;background:#1d2942;border:1px solid #31405e;color:#ccd6e8}.gameActions{display:flex;flex-direction:column;gap:8px;min-width:135px}.soon{opacity:.58}.features{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}.feature{padding:18px;border:1px solid #293651;border-radius:20px;background:#0e1627}.feature b{display:block;margin-bottom:5px}.feature span{font-size:12px;color:#8998b2}.shell{max-width:920px;margin:auto}.panel{border:1px solid #354260;border-radius:28px;background:linear-gradient(145deg,#131d32,#0d1424);padding:25px;box-shadow:var(--shadow);margin-top:20px}.panel h2{margin-top:0;font-size:30px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.label{display:block;color:#aebbd0;font-weight:800;font-size:13px;margin:4px 0 7px}.input,select{width:100%;background:#0d1424;border:1px solid #34425f;color:#fff;border-radius:15px;padding:14px 15px;outline:none}.input:focus,select:focus{border-color:#816cff;box-shadow:0 0 0 3px #765cff20}.modeGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:12px 0}.mode{padding:17px;border:1px solid #354260;background:#10192b;border-radius:19px;text-align:right;color:#fff}.mode.selected{border-color:#896fff;box-shadow:0 0 0 2px #765cff35;background:#201c45}.mode b{display:block;font-size:16px;margin-bottom:6px}.mode span{display:block;color:#99a8c0;font-size:12px;line-height:1.55}.roomCode{font-size:52px;font-weight:1000;letter-spacing:8px;text-align:center;padding:14px;background:#0b1120;border:1px solid #34425f;border-radius:20px;margin:15px 0}.gameBoard{margin-top:18px}.scorebar{display:grid;grid-template-columns:1fr 180px 1fr;gap:14px;align-items:stretch}.team{border:1px solid #33415f;border-radius:22px;background:#10192b;padding:17px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.team.a{border-color:#71323e}.team.b{border-color:#294b86}.teamName{font-weight:1000;font-size:18px}.players{font-size:12px;color:#99a7bf;margin-top:5px}.score{font-size:44px;font-weight:1000}.centerRound{border:1px solid #354260;border-radius:22px;background:#0d1424;text-align:center;padding:12px}.centerRound small{color:#9eacc3}.centerRound b{display:block;font-size:22px}.board{border:1px solid #354260;border-radius:28px;background:radial-gradient(circle at 50% 0,#1d2b4b,#0c1322 70%);padding:24px;margin-top:15px}.boardTop{display:flex;justify-content:space-between;gap:10px;align-items:center}.question{font-size:clamp(24px,3vw,42px);font-weight:1000;text-align:center;line-height:1.4;margin:25px auto;max-width:900px}.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.answer{min-height:115px;border:1px solid #34425f;border-radius:19px;background:#17213a;padding:15px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.answer.hidden{background:linear-gradient(145deg,#18243c,#10192c)}.answer .num{font-size:13px;color:#9eabc1}.answer .text{font-size:20px;font-weight:900;margin-top:7px}.answer .points{font-size:28px;font-weight:1000;color:#f4cf69}.answerControls{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap;justify-content:center}.turn{display:flex;justify-content:center;align-items:center;gap:15px;padding:12px 16px;border:1px solid #4b3d80;background:#211b43;border-radius:18px;margin-bottom:12px}.timer{font-size:34px;font-weight:1000;color:#ffd86b}.answerBox{display:flex;gap:9px;max-width:760px;margin:14px auto}.answerBox .input{flex:1}.notice{text-align:center;min-height:28px;font-weight:800;margin:8px}.good{color:#4ce0ad}.bad{color:#ff7180}.actions{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:15px}.lobby{margin-top:16px;padding:18px;border:1px solid #293651;border-radius:20px;background:#0e1627}.lobbyTeams{display:grid;grid-template-columns:1fr 1fr;gap:12px}.lobbyTeam{padding:14px;border-radius:16px;background:#131e33;border:1px solid #33415f}.guessCategories{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.cat{padding:16px;border:1px solid #354260;border-radius:18px;background:#10192b;color:#fff;font-weight:900}.cat.selected{border-color:#8b72ff;background:#211b47}.guessPlayers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.gplayer{padding:15px;border:1px solid #34425f;border-radius:18px;background:#121c30;text-align:center}.gscore{font-size:30px;font-weight:1000}.reveal{font-size:13px;color:#ffd86b;margin-top:5px}.displayBanner{padding:10px 14px;text-align:center;border:1px solid #34425f;border-radius:14px;background:#111a2e;color:#b9c6da;margin-bottom:12px}.buzzed{padding:18px 20px;border:2px solid #f4c95d;background:#251f38;border-radius:20px;text-align:center;margin:12px 0;font-size:22px;font-weight:1000}.presenterBoard{padding:20px}.presenterScorebar{grid-template-columns:1fr 1fr!important}.presenterScorebar .team{min-height:120px}.presenterQuestion{font-size:clamp(28px,4vw,54px);margin:18px auto 22px}.presenterAnswers{grid-template-columns:repeat(3,1fr);gap:14px}.presenterAnswers .answer{min-height:130px}.strikeRow{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin:12px 0}.strikeBox{display:flex;gap:4px;align-items:center;padding:9px 12px;border-radius:14px;background:#121a2b;border:1px solid #34425f}.strikeDot{width:14px;height:14px;border-radius:50%;border:2px solid #6d7890}.strikeDot.on{background:var(--red);border-color:var(--red)}.buzzBtn{font-size:22px;padding:18px 30px}.disabledBtn{opacity:.45;pointer-events:none}.hiddenInput{display:none}@media(max-width:900px){.presenterAnswers{grid-template-columns:repeat(2,1fr)}.gameGrid{grid-template-columns:1fr}.features{grid-template-columns:1fr}.modeGrid{grid-template-columns:1fr}.answers{grid-template-columns:repeat(2,1fr)}.scorebar{grid-template-columns:1fr 1fr}.centerRound{grid-column:1/-1;grid-row:1}.team{min-height:95px}.gameActions{min-width:120px}.guessCategories{grid-template-columns:repeat(2,1fr)}.guessPlayers{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.presenterScorebar{grid-template-columns:1fr 1fr!important;gap:8px}.presenterScorebar .team{padding:11px;min-width:0}.presenterScorebar .teamName{font-size:14px}.presenterScorebar .players{font-size:10px}.presenterScorebar .score{font-size:32px}.presenterAnswers{grid-template-columns:repeat(2,1fr);gap:8px}.presenterAnswers .answer{min-height:105px;padding:10px}.presenterQuestion{font-size:27px}.app{width:94vw}.hero{padding:38px 16px}.hero h2{font-size:48px}.grid{grid-template-columns:1fr}.game{align-items:flex-start}.gameActions{min-width:110px}.answers{grid-template-columns:1fr}.scorebar{grid-template-columns:1fr 1fr}.score{font-size:34px}.question{font-size:25px}.answerBox{flex-direction:column}.lobbyTeams{grid-template-columns:1fr}.guessCategories,.guessPlayers{grid-template-columns:1fr 1fr}.top .btn{padding:10px 12px}}
</style></head><body><main id="app" class="app"></main><script>
let socket=null,S=null,roomCode='',myRole='player',myTeam='A',myName='';
function initSocket(){if(socket||typeof io!=='function')return false; socket=io(); bindSocket(); return true}
function waitForSocket(){if(initSocket())return; setTimeout(waitForSocket,250)}const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function top(){return `<div class="top"><div class="brand"><div class="mark">⚔️</div><div><h1>الساحة</h1><div class="muted">منصة ألعاب جماعية تنافسية</div></div></div><button class="btn dark" onclick="home()">الرئيسية</button></div>`}
function home(){roomCode='';app.innerHTML=`${top()}<section class="hero"><div class="eyebrow">PLAY • COMPETE • WIN 🎮</div><h2>كل ألعابكم<br><span>في ساحة واحدة</span></h2><p>غرف خاصة، منافسة مباشرة، نقاط وجولات — اختاروا اللعبة وابدأوا.</p><div class="actions"><button class="btn red" onclick="showJoin()">🎮 دخول غرفة</button></div></section><section class="games"><div class="head"><div><div class="kicker">GAME HUB</div><h2>اختر لعبتك</h2></div><span class="pill">لعبتان متاحتان الآن</span></div><div class="gameGrid"><div class="game active"><div class="gameIcon">👨‍👩‍👧‍👦</div><div class="gameInfo"><h3>Family Feud</h3><p>تحدي الفرق — إجابات، Strikes، دبل ونقاط بأسلوب احترافي.</p><div class="tags"><span>🔥 فرق</span><span>⚡ 10 ثواني</span><span>⚡ دبل</span></div></div><div class="gameActions"><button class="btn primary" onclick="createFamily()">إنشاء غرفة</button></div></div><div class="game active"><div class="gameIcon">🧠</div><div class="gameInfo"><h3>خمنها</h3><p>كل لاعب لديه كلمة سرية، اسألوا بعض وخمنوا من دون أن ترى كلمتك.</p><div class="tags"><span>🕵️ كلمة سرية</span><span>🏆 3 • 2 • 1</span><span>⚽ كرة قدم</span></div></div><div class="gameActions"><button class="btn primary" onclick="createGuess()">إنشاء غرفة</button></div></div><div class="game soon"><div class="gameIcon">💰</div><div class="gameInfo"><h3>السوق</h3><p>زايد وخاطر واشترِ الإجابات قبل أن تعرف قيمتها.</p><span class="pill">قريبًا</span></div></div><div class="game soon"><div class="gameIcon">💣</div><div class="gameInfo"><h3>المفخخة</h3><p>بعض الإجابات تربحك وبعضها يقلب النتيجة.</p><span class="pill">قريبًا</span></div></div></div></section><section class="features"><div class="feature"><b>🔐 كود خاص</b><span>Family Feud يبدأ بحرف A، وخمنها بحرف B.</span></div><div class="feature"><b>🖥️ ثلاثة أنماط</b><span>مقدم + شاشة + لاعبين، شاشة + لاعبين، أو لاعبين فقط.</span></div><div class="feature"><b>⚡ لحظي</b><span>كل حركة تظهر فورًا للجميع.</span></div></section>`}
function createFamily(){app.innerHTML=`${top()}<section class="panel"><h2>👨‍👩‍👧‍👦 إنشاء غرفة Family Feud</h2><div class="grid"><div><label class="label">اسمك</label><input class="input" id="name" placeholder="اكتب اسمك"></div><div><label class="label">عدد الجولات</label><input class="input" id="rounds" type="number" min="1" max="50" value="5"></div><div><label class="label">اسم الفريق الأحمر</label><input class="input" id="teamA" value="الفريق الأحمر"></div><div><label class="label">اسم الفريق الأزرق</label><input class="input" id="teamB" value="الفريق الأزرق"></div></div><label class="label" style="margin-top:15px">نظام الغرفة</label><div class="modeGrid"><button class="mode selected" id="m1" onclick="selectMode('presenter')"><b>🎙️ مقدم + 🖥️ شاشة + لاعبين</b><span>المقدم يدير اللعبة، والشاشة للعرض، واللاعبون يجيبون.</span></button><button class="mode" id="m2" onclick="selectMode('displayPlayers')"><b>🖥️ شاشة + لاعبين</b><span>بدون مقدم. الإجابات الكتابية نفسها تظهر على الشاشة للجميع.</span></button><button class="mode" id="m3" onclick="selectMode('players')"><b>📱 لاعبين فقط</b><span>كل شيء من جوالات اللاعبين بدون شاشة منفصلة.</span></button></div><input type="hidden" id="mode" value="presenter"><button class="btn primary" style="width:100%;margin-top:10px" onclick="makeFamily()">🚀 إنشاء غرفة</button></section></div>`}
function selectMode(m){$('mode').value=m;['m1','m2','m3'].forEach((x,i)=>$(x).classList.toggle('selected',['presenter','displayPlayers','players'][i]===m))}
function createGuess(){app.innerHTML=`${top()}<section class="panel"><h2>🧠 إنشاء غرفة خمنها</h2><label class="label">اسمك</label><input class="input" id="name" placeholder="اكتب اسمك"><p class="muted">لا توجد شاشة عرض في خمنها؛ اللعبة مصممة للاعبين فقط.</p><button class="btn primary" style="width:100%;margin-top:10px" onclick="makeGuess()">🚀 إنشاء غرفة</button></section></div>`}
function makeFamily(){const name=$('name')?.value.trim();if(!name)return alert('اكتب اسمك');socket.emit('room:create',{game:'family',mode:$('mode').value,name,rounds:+$('rounds').value||5,teamA:$('teamA').value,teamB:$('teamB').value,team:'A'})}
function makeGuess(){const name=$('name')?.value.trim();if(!name)return alert('اكتب اسمك');socket.emit('room:create',{game:'guess',name,mode:'players'})}
function joinHome(){showJoin()}
function showJoin(){app.innerHTML=`${top()}<section class="panel"><h2>🎮 دخول غرفة</h2><label class="label">كود الغرفة</label><input class="input" id="joinCode" placeholder="مثال: A123 أو B123" maxlength="4" autocapitalize="characters"><button class="btn dark" style="width:100%;margin-top:10px" onclick="lookup()">تحقق من الغرفة</button><div id="joinDetails"></div></section></div>`}
function lookup(){const c=$('joinCode').value.trim().toUpperCase();if(!/^[AB]\d{3}$/.test(c))return alert('الكود يجب أن يكون حرفًا ورقمين؟ لا: حرف + 3 أرقام مثل A123');socket.emit('room:lookup',{code:c})}
function renderJoin(info){const c=$('joinCode').value.trim().toUpperCase();if(info.gameType==='guess'){$('joinDetails').innerHTML=`<div class="lobby" style="margin-top:15px"><h3>🧠 خمنها</h3><label class="label">اسمك</label><input class="input" id="jn" placeholder="اكتب اسمك"><button class="btn primary" style="width:100%;margin-top:10px" onclick="joinRoom('player')">دخول اللعبة 🚀</button></div>`;return}const allowDisplay=info.mode!=='players';const presenter=info.mode==='presenter';$('joinDetails').innerHTML=`<div class="lobby" style="margin-top:15px"><h3>👨‍👩‍👧‍👦 Family Feud</h3><div class="muted">نظام الغرفة: ${presenter?'مقدم + شاشة + لاعبين':info.mode==='displayPlayers'?'شاشة + لاعبين':'لاعبين فقط'}</div><div style="margin-top:12px"><button class="mode selected" onclick="joinRole('player')"><b>📱 لاعب</b><span>الدخول كلاعب إلى الفريق.</span></button>${allowDisplay?`<button class="mode" style="margin-top:8px;width:100%" onclick="joinRole('display')"><b>🖥️ شاشة عرض</b><span>فتح شاشة العرض على هذا الجهاز.</span></button>`:''}${presenter?`<button class="mode" style="margin-top:8px;width:100%" onclick="joinRole('presenter')"><b>🎙️ مقدم</b><span>دخول لوحة تحكم المقدم.</span></button>`:''}</div><div id="roleForm" style="margin-top:12px"></div></div>`;joinRole('player')}
function joinRole(role){myRole=role;const infoText=role==='display'?'':`<label class="label">اسمك</label><input class="input" id="jn" placeholder="اكتب اسمك">${myRole==='player'?`<label class="label" style="margin-top:10px">فريقك</label><select class="input" id="jt"><option value="A">🔴 الفريق الأحمر</option><option value="B">🔵 الفريق الأزرق</option></select>`:''}`;$('roleForm').innerHTML=`${infoText}<button class="btn ${role==='display'?'blue':'primary'}" style="width:100%;margin-top:10px" onclick="joinRoom('${role}')">${role==='display'?'🖥️ فتح الشاشة':'🚀 دخول الغرفة'}</button>`}
function joinRoom(role){const c=$('joinCode').value.trim().toUpperCase();const n=$('jn')?.value.trim()||'';const team=$('jt')?.value||'A';if(role!=='display'&&!n)return alert('اكتب اسمك');socket.emit('room:join',{code:c,name:n,role,team})}
function showRoomCode(c,game){roomCode=c;history.replaceState({},'',`/?join=${encodeURIComponent(c)}`);app.innerHTML=`${top()}<section class="panel" style="text-align:center"><div class="muted">رمز ${game==='guess'?'خمنها':'Family Feud'}</div><div class="roomCode">${esc(c)}</div><p class="muted">أرسل هذا الكود لباقي اللاعبين.</p><button class="btn primary" onclick="enterCurrent()">فتح اللعبة</button></section>`}
function enterCurrent(){if(S)renderState(S)}
function renderState(s){S=s;if(s.gameType==='guess')return renderGuess(s);renderFamily(s)}
function renderFamily(s){
 if(s.displayRole)return renderDisplayFamily(s);
 const control=s.canControl;
 const meTeam=myTeam;
 const mode=s.mode;
 const verbal=mode==='presenter';
 const myTurn=s.answerLock&&myRole==='player'&&s.answerLock.name===myName;
 const myBuzz=s.lock&&myRole==='player'&&s.lock.name===myName&&s.lock.team===myTeam;
 const answers=(s.answers||[]).map((a,i)=>`<div class="answer ${a.revealed?'':'hidden'}"><span class="num">الإجابة ${i+1}</span><div class="text">${a.revealed?esc(a.text):'🔒 ؟'}</div>${a.revealed?`<div class="points">${a.points}</div>`:''}${control?`<div class="answerControls">${!a.revealed?`<button class="btn red" onclick="revealFF(${i})">👁️ كشف</button>`:''}${a.revealed&&!a.awarded?`<button class="btn red" onclick="awardFF(${i},'A')">🔴 +${a.points}</button><button class="btn blue" onclick="awardFF(${i},'B')">🔵 +${a.points}</button>`:''}</div>`:''}</div>`).join('');
 const myTeamObj=s.teams.find(t=>t.id===myTeam);
 const playerAction=mode==='presenter'
   ? ((!s.lock&&!s.answerLock)?`<button class="btn primary buzzBtn" onclick="buzzFF()">🔔 أضغط للإجابة</button><button class="btn gold buzzBtn" onclick="doubleFF()" ${myTeamObj?.doubleUsed?'disabled':''}>⚡ دبل</button>`:(s.answerLock?`<div class="muted">⏱️ ${s.answerLock.double?'⚡ دبل — ':''}${s.answerLock.name===myName?'🎤 أنت تجاوب الآن':`🎤 ${esc(s.answerLock.name)} يجاوب الآن`}</div>`:`<div class="muted">${myBuzz?'🎤 أنت المضغوط عليك الآن':`🔔 ${esc(s.lock.name)} ضغط أولًا`}</div>`))
   : (s.phase==='question'&&myRole==='player'&&!s.answerLock?`<button class="btn primary" onclick="readyFF()">✍️ أجاوب كتابيًا</button><button class="btn gold" onclick="doubleFF()" ${myTeamObj?.doubleUsed?'disabled':''}>⚡ دبل</button>`:'');
 const answerBox=!verbal&&s.phase==='question'&&myTurn?`<div class="answerBox"><input class="input" id="answerInput" placeholder="اكتب إجابتك خلال 10 ثواني" maxlength="120" onkeydown="if(event.key==='Enter')submitFF()"><button class="btn primary" onclick="submitFF()">إرسال</button></div>`:'';
 const buzz=verbal&&s.lock?`<div class="buzzed">🔔 <b>${esc(s.lock.name)}</b> من ${s.lock.team==='A'?'🔴 '+esc(s.teams[0].name):'🔵 '+esc(s.teams[1].name)} ضغط أولًا — يجاوب صوتيًا الآن</div>`:'';
 const strikes=control?`<div class="strikeRow"><div class="strikeBox"><b>🔴 ${esc(s.teams[0].name)}</b>${[0,1,2].map(i=>`<span class="strikeDot ${i<s.teams[0].strikes?'on':''}"></span>`).join('')}<button class="btn red" onclick="strikeFF('A')">Strike</button></div><div class="strikeBox"><b>🔵 ${esc(s.teams[1].name)}</b>${[0,1,2].map(i=>`<span class="strikeDot ${i<s.teams[1].strikes?'on':''}"></span>`).join('')}<button class="btn blue" onclick="strikeFF('B')">Strike</button></div></div>`:'';
 app.innerHTML=`${top()}<div class="gameBoard"><div class="scorebar ${verbal?'presenterScorebar':''}">${teamCard(s.teams[0])}${verbal?'':`<div class="centerRound"><small>الجولة</small><b>${s.currentRound} / ${s.rounds}</b><span class="pill">${s.phase==='lobby'?'اللوبي':s.phase==='question'?'سؤال':'منتهية'}</span></div>`}${verbal?teamCard(s.teams[1]):teamCard(s.teams[1])}</div><section class="board ${verbal?'presenterBoard':''}">${mode==='displayPlayers'?'<div class="displayBanner">🖥️ هذا الجهاز في وضع شاشة العرض — اللاعبين يجيبون من جوالاتهم</div>':''}<div class="boardTop"><span class="pill">${esc(s.code)}</span>${s.presenterName?`<span class="pill">🎙️ ${esc(s.presenterName)}</span>`:''}${verbal?`<span class="pill">الجولة ${s.currentRound} / ${s.rounds}</span>`:''}</div><div class="question ${verbal?'presenterQuestion':''}">${s.question?esc(s.question):'جاهزين؟ ابدأوا بسؤال عشوائي.'}</div>${buzz}${s.answerLock?`<div class="turn"><div>⏱️ <b>${esc(s.answerLock.name)}</b> يجاوب الآن ${s.answerLock.double?'⚡ دبل':''}</div><div class="timer" id="timer">10</div></div>`:''}${answerBox}${strikes}<div class="notice" id="notice"></div><div class="answers ${verbal?'presenterAnswers':''}">${answers}</div><div class="actions">${s.phase==='lobby'&&control?`<button class="btn gold" onclick="startFF()">🎲 سؤال عشوائي</button>`:''}${s.phase==='question'&&control?`<button class="btn gold" onclick="nextFF()">🎲 سؤال عشوائي</button>`:''}${playerAction}${s.phase==='question'&&control?`<button class="btn danger" onclick="endFF()">إنهاء اللعبة</button>`:''}</div></section>${s.phase==='lobby'?`<div class="lobby"><h3>👥 اللاعبين</h3><div class="lobbyTeams">${s.teams.map(t=>`<div class="lobbyTeam"><b>${t.id==='A'?'🔴':'🔵'} ${esc(t.name)}</b><div class="players">${t.players.map(p=>esc(p.name)).join(' • ')||'لا يوجد'}</div></div>`).join('')}</div>${s.mode!=='players'?'<p class="muted">💡 افتح نفس الكود من جهاز آخر واختر «شاشة عرض».</p>':''}</div>`:''}</div>`;
 if(myTurn)setTimeout(()=>$('answerInput')?.focus(),40);
 if(s.answerLock)startTimer(s.answerLock.until);
}
function teamCard(t){return `<div class="team ${t.id==='A'?'a':'b'}"><div><div class="teamName">${t.id==='A'?'🔴':'🔵'} ${esc(t.name)}</div><div class="players">${t.players.map(p=>esc(p.name)).join(' • ')||'لا يوجد'}</div><div class="pill" style="margin-top:7px">${t.doubleUsed?'⚡ الدبل مستخدم':'⚡ الدبل متاح'}</div></div><div class="score">${t.score}</div></div>`}
function renderDisplayFamily(s){
 myRole='display';
 const verbal=s.mode==='presenter';
 app.innerHTML=`${top()}<div class="gameBoard"><div class="scorebar ${verbal?'presenterScorebar':''}">${teamCard(s.teams[0])}${verbal?'':`<div class="centerRound"><small>الجولة</small><b>${s.currentRound} / ${s.rounds}</b><span class="pill">شاشة عرض</span></div>`}${teamCard(s.teams[1])}</div><section class="board ${verbal?'presenterBoard':''}"><div class="displayBanner">🖥️ شاشة العرض ${verbal?'— مقدم + لاعبين':''}</div><div class="question ${verbal?'presenterQuestion':''}">${s.question?esc(s.question):'بانتظار بدء السؤال'}</div>${s.lock?`<div class="buzzed">🔔 <b>${esc(s.lock.name)}</b> ضغط أولًا — يجاوب صوتيًا الآن</div>`:''}${s.answerLock?`<div class="turn"><b>${esc(s.answerLock.name)} يجاوب ${s.answerLock.double?'⚡ دبل':''}</b><div class="timer" id="timer">10</div></div>`:''}<div class="answers ${verbal?'presenterAnswers':''}">${(s.answers||[]).map((a,i)=>`<div class="answer ${a.revealed?'':'hidden'}"><span class="num">${i+1}</span><div class="text">${a.revealed?esc(a.text):'؟'}</div>${a.revealed?`<div class="points">${a.points}</div>`:''}</div>`).join('')}</div></section></div>`;
 if(s.answerLock)startTimer(s.answerLock.until)
}
function startTimer(until){clearInterval(window.tt);window.tt=setInterval(()=>{const e=$('timer');if(!e)return clearInterval(window.tt);e.textContent=Math.max(0,Math.ceil((until-Date.now())/1000));if(+e.textContent<=0)clearInterval(window.tt)},100);}
function startFF(){socket.emit('player:startRound',{code:roomCode,questionIndex:-1})}function nextFF(){socket.emit('player:nextQuestion',{code:roomCode})}function readyFF(){socket.emit('player:answerReady',{code:roomCode})}function buzzFF(){socket.emit('buzzer:press',{code:roomCode})}function doubleFF(){socket.emit('player:double',{code:roomCode})}function submitFF(){const e=$('answerInput');if(!e?.value.trim())return;socket.emit('player:submitAnswer',{code:roomCode,answer:e.value.trim()})}function revealFF(i){socket.emit('player:reveal',{code:roomCode,index:i})}function awardFF(i,t){socket.emit('player:award',{code:roomCode,team:t,answerIndex:i})}function strikeFF(t){socket.emit('player:strike',{code:roomCode,team:t})}function endFF(){if(confirm('إنهاء اللعبة؟'))socket.emit('player:end',{code:roomCode})}
function renderGuess(s){const me=s.players.find(p=>p.id===myName)||null;const isRound=s.phase==='round';if(s.phase==='lobby'){app.innerHTML=`${top()}<section class="panel"><div class="scorebar"><div class="team a"><div><div class="teamName">🧠 خمنها</div><div class="players">الكود ${esc(s.code)}</div></div><div class="score">${s.round}/${s.maxRounds}</div></div></div><h2>اختاروا الفئة</h2><div class="guessCategories">${s.categories.map(c=>`<button class="cat ${s.category===c?'selected':''}" onclick="pickCat('${esc(c).replace(/'/g,"&#39;")}')">${esc(c)}</button>`).join('')}</div><div class="actions"><button class="btn primary" onclick="startGuess()" ${s.category?'':'disabled'}>🚀 ابدأ الجولة</button></div></section><section class="panel"><h2>👥 اللاعبين</h2><div class="guessPlayers">${s.players.map(p=>`<div class="gplayer"><b>${esc(p.name)}</b><div class="gscore">${p.score}</div></div>`).join('')}</div></section></div>`;return}const my=s.players.find(p=>p.id===window.guessPlayerId);app.innerHTML=`${top()}<section class="panel"><div class="head"><div><div class="kicker">🧠 خمنها</div><h2 style="margin:4px 0">${esc(s.category)}</h2></div><span class="pill">الجولة ${s.round}/${s.maxRounds}</span></div><p class="muted">اسألوا بعض شفهيًا. كلمتك مخفية عنك.</p><div class="guessPlayers">${s.players.map(p=>`<div class="gplayer"><b>${esc(p.name)}</b><div class="gscore">${p.score}</div>${p.revealedWord?`<div class="reveal">🔓 ${esc(p.revealedWord)}</div>`:''}${p.guessed?' <div class="good">✓ خمّن</div>':''}${p.id!==window.guessPlayerId?`<button class="btn dark" style="margin-top:8px" onclick="revealGuess('${p.id}')">👁️ كشف</button>`:''}</div>`).join('')}</div><div class="actions" style="margin-top:20px">${isRound&&!my?.guessed?`<input class="input" id="guessInput" placeholder="اكتب تخمينك"><button class="btn primary" onclick="sendGuess()">تخمين 🎯</button>`:''}${s.phase==='results'?`<button class="btn gold" onclick="nextGuess()">🎲 الجولة التالية</button>`:''}</div><div id="gnotice" class="notice"></div></section></div>`;}
function pickCat(c){window.guessCategory=c;document.querySelectorAll('.cat').forEach(x=>x.classList.toggle('selected',x.textContent.trim()===c))}function startGuess(){socket.emit('guess:start',{code:roomCode,category:window.guessCategory||S.category})}function sendGuess(){const v=$('guessInput')?.value.trim();if(v)socket.emit('guess:guess',{code:roomCode,text:v})}function revealGuess(id){socket.emit('guess:reveal',{code:roomCode,targetId:id})}function nextGuess(){socket.emit('guess:next',{code:roomCode})}
// category selection is local + synced by starting; add server-side lightweight selection via guess:start only.
function bindSocket(){socket.on('room:created',x=>{roomCode=x.code;myRole=x.role||'player';myName=x.name||'';myTeam=x.team||'A';window.guessPlayerId=x.playerId||window.guessPlayerId;showRoomCode(x.code,x.game);});socket.on('room:joined',x=>{myRole=x.role||myRole;myName=x.name||myName;myTeam=x.team||myTeam;window.guessPlayerId=x.playerId||window.guessPlayerId;if(x.game==='family'){showRoomCode(roomCode,'family')}else{showRoomCode(roomCode,'guess')}});socket.on('room:info',x=>{if(!x.ok)return alert('رمز الغرفة غير صحيح');renderJoin(x)});socket.on('state',s=>{S=s;if(s.gameType==='guess'){if(!window.guessPlayerId&&s.players.length===1)window.guessPlayerId=s.players[0].id;renderGuess(s)}else{const me=s.teams.flatMap(t=>t.players).find(p=>p.name===myName);if(me)myTeam=s.teams.find(t=>t.players.some(p=>p.name===myName))?.id||myTeam;renderFamily(s)}});socket.on('guess:result',x=>{const e=$('gnotice');if(e){e.className='notice '+(x.ok?'good':'bad');e.textContent=x.ok?`🎉 إجابة صحيحة! +${x.points}`:'❌ مو صحيحة';}});socket.on('error:msg',m=>alert(m));socket.on('connect',()=>{const q=new URLSearchParams(location.search).get('join');if(q)showJoin()});}
home(); waitForSocket();
</script></body></html>
