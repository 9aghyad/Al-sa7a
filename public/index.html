<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070914"><title>الساحة — ألعاب جماعية</title><script src="/socket.io/socket.io.js"></script><style>
:root{--bg:#060711;--panel:#0d1020;--panel2:#15192c;--line:#29304b;--txt:#f7f8ff;--muted:#9ba5c2;--gold:#ffd45a;--red:#ff405f;--blue:#4c8dff;--green:#37e6a0;--purple:#8667ff;--cyan:#44d8ff;--shadow:0 30px 90px #0009}*{box-sizing:border-box}html,body{margin:0;background:radial-gradient(circle at 50% -10%,#1b1640 0,#090a16 38%,#05060c 100%);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;min-height:100%;overflow-x:hidden}button,input,select{font:inherit}.app{min-height:100vh}.wrap{width:min(1450px,94vw);margin:auto;padding:22px 0 70px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px}.brand{display:flex;align-items:center;gap:12px;font-weight:1000}.logo{width:52px;height:52px;border-radius:17px;background:conic-gradient(from 220deg,#ff3e67,#ffb23e,#8b63ff,#3cc8ff,#ff3e67);display:grid;place-items:center;font-size:27px;box-shadow:0 15px 45px #0008}.brand span{font-size:24px}.btn{border:1px solid #ffffff12;border-radius:15px;padding:12px 16px;color:var(--txt);background:#171b30;cursor:pointer;font-weight:900;transition:.16s transform,.16s filter,.16s box-shadow}.btn:hover{transform:translateY(-2px);filter:brightness(1.1)}.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}.primary{background:linear-gradient(135deg,#8767ff,#5d4be9);box-shadow:0 10px 30px #765cff30}.gold{background:linear-gradient(135deg,#ffe487,#d9a82f);color:#211806}.red{background:linear-gradient(135deg,#ff4666,#b51f43)}.blue{background:linear-gradient(135deg,#4f95ff,#2457b9)}.green{background:linear-gradient(135deg,#43e8ab,#169b72);color:#06150f}.danger{background:#5b1829}.ghost{background:#0b0f1e}.card{background:linear-gradient(180deg,#11162bf2,#0a0d18f5);border:1px solid #2b3351;border-radius:28px;box-shadow:var(--shadow);padding:25px}.hero{position:relative;overflow:hidden;padding:70px 30px;text-align:center}.hero:before{content:"";position:absolute;inset:-30%;background:radial-gradient(circle,#765cff1c 0,transparent 45%);animation:float 8s ease-in-out infinite}.hero>*{position:relative}.hero h1{font-size:clamp(50px,9vw,105px);line-height:.9;margin:14px 0;background:linear-gradient(90deg,#fff,#b9b9ff,#fff);-webkit-background-clip:text;color:transparent}.hero p{color:var(--muted);font-size:18px}.games{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:18px}.game{position:relative;overflow:hidden;min-height:250px;padding:25px;display:flex;flex-direction:column;justify-content:space-between}.game:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-70px;top:-70px;background:var(--accent);opacity:.13;filter:blur(10px)}.gameTop{display:flex;align-items:flex-start;justify-content:space-between;gap:15px}.gameIcon{width:66px;height:66px;border-radius:21px;display:grid;place-items:center;font-size:33px;background:linear-gradient(135deg,#ffffff16,#ffffff05);border:1px solid #ffffff15}.code{font-weight:1000;font-size:13px;color:var(--muted);padding:7px 10px;border:1px solid #ffffff12;border-radius:999px}.game h2{margin:14px 0 7px;font-size:30px}.game p{color:var(--muted);line-height:1.65;margin:0 0 18px}.gameActions{display:flex;gap:10px;flex-wrap:wrap}.credit{text-align:center;color:#737c99;font-size:12px;margin-top:28px;font-weight:800}.modal{position:fixed;inset:0;background:#000b;backdrop-filter:blur(12px);display:grid;place-items:center;z-index:50;padding:20px}.modalBox{width:min(720px,96vw);max-height:90vh;overflow:auto}.close{float:left}.label{font-size:13px;color:#9ba5c2;margin:12px 0 6px}.input,select{width:100%;background:#080b16;border:1px solid #303957;border-radius:14px;padding:13px;color:#fff;outline:none}.input:focus,select:focus{border-color:#7761ff;box-shadow:0 0 0 3px #765cff1c}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mode{padding:14px;border:1px solid #303957;border-radius:16px;background:#0b0f1d;cursor:pointer}.mode.on{border-color:#7a64ff;background:#211c45;box-shadow:0 0 0 2px #7a64ff1c}.stage{min-height:100vh;padding:18px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 0,#24214c 0,#090b16 45%,#05060b 100%)}.stageCard{width:min(1700px,98vw);min-height:min(940px,96vh);padding:clamp(16px,2vw,30px);position:relative;overflow:hidden}.stageHead{display:flex;align-items:center;justify-content:space-between;gap:12px}.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pill{display:inline-flex;align-items:center;gap:6px;padding:8px 11px;border-radius:999px;background:#171c31;border:1px solid #303957;color:#d9def1;font-weight:900}.gameTitle{font-size:clamp(25px,3vw,48px);font-weight:1000}.questionBox{text-align:center;padding:20px 8px}.eyebrow{color:#929dbc;font-size:13px;font-weight:900;letter-spacing:.7px}.questionBox h1{font-size:clamp(32px,5vw,68px);line-height:1.1;margin:10px auto;max-width:1200px}.scoreRow{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.scoreCard{padding:17px;border-radius:22px;border:1px solid #303957;background:#0c1120;position:relative;overflow:hidden}.scoreCard.a{border-color:#6d293b}.scoreCard.b{border-color:#2c5ca0}.scoreName{font-weight:1000;font-size:18px}.scoreNum{font-size:clamp(40px,5vw,74px);font-weight:1000;line-height:1;margin:8px 0}.scoreSub{color:#9ba5c2}.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.answerTile{min-height:100px;border-radius:19px;border:2px solid #2c3652;background:linear-gradient(180deg,#1c2540,#111729);display:grid;place-items:center;text-align:center;padding:14px;font-size:22px;font-weight:1000;position:relative;overflow:hidden}.answerTile.hidden{background:radial-gradient(circle,#273557,#111627);font-size:42px}.answerTile.reveal{animation:reveal .6s cubic-bezier(.2,.9,.2,1)}.pts{display:block;color:var(--gold);font-size:17px;margin-top:6px}.buzzer{width:min(380px,70vw);aspect-ratio:1;border-radius:50%;margin:25px auto;border:8px solid #3d0c17;background:radial-gradient(circle at 35% 28%,#ff758b,#f21f45 40%,#97132d 72%,#420916);box-shadow:0 0 0 10px #ff405f12,0 25px 70px #ff163b3b,inset 0 -25px 45px #0007;color:white;font-size:clamp(30px,5vw,58px);font-weight:1000;cursor:pointer;transition:.12s;position:relative}.buzzer:active{transform:scale(.96)}.buzzer.lock{filter:grayscale(.6);opacity:.55;cursor:not-allowed}.timer{font-size:58px;font-weight:1000;text-align:center;color:var(--gold)}.actionBar{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:15px 0}.feedback{min-height:55px;display:grid;place-items:center;text-align:center;font-size:22px;font-weight:1000;border-radius:18px;background:#11172a;border:1px solid #293452;padding:10px}.dangerFlash{position:fixed;inset:0;z-index:90;pointer-events:none;display:grid;place-items:center;font-size:clamp(70px,15vw,230px);font-weight:1000;animation:flash .9s ease-out forwards}.confetti{font-size:50px;letter-spacing:8px;text-align:center}.playersGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.playerChip{padding:13px;border:1px solid #2b3550;border-radius:16px;background:#0d1221}.playerChip.dead{opacity:.35;text-decoration:line-through}.bigBalance{text-align:center;font-size:clamp(60px,9vw,120px);font-weight:1000;color:var(--gold);line-height:1}.riskGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.risk{padding:20px;border-radius:20px;border:1px solid #33405c;background:#0d1221;text-align:center;cursor:pointer}.risk strong{display:block;font-size:28px}.risk small{color:#9ba5c2}.millionLayout{display:grid;grid-template-columns:1.5fr .6fr;gap:16px}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}.option{padding:18px;border:2px solid #33405c;border-radius:18px;background:#11182a;text-align:right;font-size:20px;font-weight:1000;cursor:pointer}.ladder{border:1px solid #303957;border-radius:20px;padding:14px;background:#090d19}.ladder div{padding:9px 11px;border-radius:10px;display:flex;justify-content:space-between}.ladder .cur{background:#7059f533;color:#fff}.lifelines{display:flex;gap:8px;flex-wrap:wrap}.small{font-size:13px;color:#9ba5c2}.hidden{display:none!important}@keyframes reveal{0%{transform:rotateX(90deg) scale(.8);filter:brightness(2)}100%{transform:none}}@keyframes flash{0%{opacity:0;transform:scale(.5)}25%{opacity:1;transform:scale(1.08)}100%{opacity:0;transform:scale(1.25)}}@keyframes float{50%{transform:translateY(20px)}}@media(max-width:850px){.games{grid-template-columns:1fr}.scoreRow,.millionLayout{grid-template-columns:1fr}.answers{grid-template-columns:1fr 1fr}.riskGrid{grid-template-columns:1fr}.hero{padding:45px 20px}.stage{padding:8px}.stageCard{min-height:100vh;border-radius:20px}.top{align-items:flex-start}}
</style></head><body><div id="app" class="app"></div><script>
const socket=io();let state=null,info=null,joinCode='',gameCode='',meName='',meTeam='',role='player',mode='players',audioOn=true,selectedGame=null;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const G={family:{key:'A',title:'Family Feud',icon:'👨‍👩‍👧‍👦',desc:'مواجهة الفرق الكلاسيكية مع Buzzer وDouble وكشف الإجابات.',accent:'#ff405f',modes:['presenter','display-players','players-only']},guess:{key:'B',title:'خمنها',icon:'🤔',desc:'اكشف كلمة خصمك وخله يحاول يخمنها — ذكاء، خداع ونقاط.',accent:'#8667ff',modes:['players-only']},market:{key:'C',title:'السوق',icon:'💰',desc:'اضغط أولًا، جاوب بسرعة، وخلي الأغلبية تحكم على إجابتك.',accent:'#44d8ff',modes:['presenter','display-players','players-only']},trap:{key:'D',title:'المفخخة',icon:'💣',desc:'إجابة قد تجيب لك ثروة… أو تفجرك. الـBuzzer ينتظر.',accent:'#ff9d2e',modes:['presenter','display-players','players-only']},standing:{key:'E',title:'الصملة',icon:'🏆',desc:'صمّد أكثر من غيرك. التشابه في الإجابات ممكن يطيّح الاثنين.',accent:'#37e6a0',modes:['display-players','players-only']},bank:{key:'F',title:'البنك',icon:'🏦',desc:'خاطر، اربح، أمّن رصيدك… ولا تطمع أكثر من اللازم.',accent:'#ffd45a',modes:['display-players','players-only']},million:{key:'G',title:'المليون',icon:'👑',desc:'سلم جوائز، مساعدات، انسحاب… وهل تقدر توصل للمليون؟',accent:'#ffd45a',modes:['presenter','display-players','players-only']}};
function tone(freq=440,d=.12,type='sine',gain=.05){if(!audioOn)return;try{const C=window.AudioContext||window.webkitAudioContext,ctx=window._ctx||(window._ctx=new C());const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=freq;g.gain.value=gain;o.connect(g);g.connect(ctx.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+d);o.stop(ctx.currentTime+d)}catch(e){}}
function click(){tone(560,.06,'square',.035)}function success(){tone(740,.12,'triangle',.05);setTimeout(()=>tone(980,.18,'triangle',.05),90)}function error(){tone(170,.2,'sawtooth',.06)}function boom(){tone(80,.5,'sawtooth',.1);setTimeout(()=>tone(50,.4,'square',.08),80)}
function top(back=true){return `<div class="top"><div class="brand"><div class="logo">🎮</div><span>الساحة</span></div>${back?`<button class="btn ghost" onclick="home()">الرئيسية</button>`:''}</div>`}
function home(){click();state=null;app.innerHTML=`<div class="wrap">${top(false)}<section class="card hero"><div class="eyebrow">ARENA • PARTY GAMES</div><h1>الساحة</h1><p>سبع ألعاب. سبع شخصيات. ليلة كاملة من الحماس.</p><div class="actionBar"><button class="btn primary" onclick="joinStart()">🚪 دخول غرفة</button></div></section><section class="games">${Object.entries(G).map(([k,g])=>`<article class="card game" style="--accent:${g.accent}"><div><div class="gameTop"><div class="gameIcon">${g.icon}</div><span class="code">${g.key}###</span></div><h2>${g.title}</h2><p>${g.desc}</p></div><div class="gameActions"><button class="btn primary" onclick="openCreate('${k}')">🚀 إنشاء غرفة</button></div></article>`).join('')}</section><div class="credit">تم إنشاء اللعبة من قبل أغيد</div></div>`}
function openCreate(k){click();selectedGame=k;const g=G[k];const modes=g.modes.map((m,i)=>`<div class="mode ${i===0?'on':''}" data-mode="${m}" onclick="pickMode(this)">${m==='presenter'?'🎙️ مقدم + شاشة + لاعبين':m==='display-players'?'📺 شاشة + لاعبين':'🎮 لاعبين فقط'}</div>`).join('');app.insertAdjacentHTML('beforeend',`<div class="modal" id="createModal"><div class="card modalBox"><button class="btn close" onclick="closeModal()">✕</button><h2>${g.icon} إنشاء ${g.title}</h2><div class="label">اسمك</div><input class="input" id="createName" placeholder="اكتب اسمك"><div class="label">عدد الجولات</div><select id="createRounds"><option>5</option><option>10</option><option>15</option><option>20</option><option>30</option></select><div class="label">طريقة اللعب</div><div class="grid3" id="modeGrid">${modes}</div>${k==='family'?`<div class="label">الفريق</div><select id="createTeam"><option value="A">🔴 الفريق الأحمر</option><option value="B">🔵 الفريق الأزرق</option></select>`:''}<button class="btn primary" style="width:100%;margin-top:16px" onclick="createRoom()">إنشاء الغرفة 🚀</button></div></div>`)}
function pickMode(el){document.querySelectorAll('#modeGrid .mode').forEach(x=>x.classList.remove('on'));el.classList.add('on');click()}function closeModal(){$('createModal')?.remove()}
function createRoom(){const name=$('createName').value.trim();if(!name)return toast('اكتب اسمك أولًا');const m=document.querySelector('#modeGrid .mode.on')?.dataset.mode||'players-only';const rounds=+$('createRounds').value||5;const team=$('createTeam')?.value||'A';click();socket.emit('room:create',{game:G[selectedGame].key,rounds,mode:m,name,team})}
function joinStart(){click();app.innerHTML=`<div class="wrap">${top()}<section class="card" style="max-width:650px;margin:auto;text-align:center"><div class="gameIcon" style="margin:auto">🚪</div><h1>دخول غرفة</h1><p class="small">أدخل الرمز فقط. الساحة بتتعرف على اللعبة أولًا.</p><input class="input" id="joinCode" maxlength="4" placeholder="A123" style="font-size:28px;text-align:center;letter-spacing:8px;text-transform:uppercase"><button class="btn primary" style="width:100%;margin-top:12px" onclick="lookup()">تحقق من الغرفة</button></section></div>`}
function lookup(){const c=$('joinCode').value.trim().toUpperCase();if(!/^[A-G]\d{3}$/.test(c))return toast('الرمز يجب أن يكون مثل A123 أو D456');joinCode=c;socket.emit('room:lookup',{code:c})}
function showJoin(info){const g=Object.values(G).find(x=>x.key===info.name?false:x.key===joinCode[0]);const actual=G[info.game];const family=info.game==='family';app.innerHTML=`<div class="wrap">${top()}<section class="card" style="max-width:720px;margin:auto"><div class="row"><div class="gameIcon">${actual.icon}</div><div><div class="eyebrow">${joinCode}</div><h1 style="margin:4px 0">${actual.title}</h1><div class="small">${info.rounds} جولات</div></div></div><div class="label">اسمك</div><input class="input" id="joinName" placeholder="اكتب اسمك">${family?`<div class="label">الفريق</div><select class="input" id="joinTeam">${info.teams.map(t=>`<option value="${t.id}">${t.id==='A'?'🔴':'🔵'} ${esc(t.name)}</option>`).join('')}</select>`:''}<div class="label">الدخول كـ</div><div class="grid3" id="joinRoles">${actual.modes.map((m,i)=>`<div class="mode ${i===actual.modes.length-1?'on':''}" data-role="${m}" onclick="pickRole(this)">${m==='presenter'?'🎙️ مقدم':m==='display-players'?'📺 شاشة':'🎮 لاعب'}</div>`).join('')}</div><button class="btn primary" style="width:100%;margin-top:16px" onclick="joinRoom()">دخول 🚀</button></section></div>`}
function pickRole(el){document.querySelectorAll('#joinRoles .mode').forEach(x=>x.classList.remove('on'));el.classList.add('on');click()}function joinRoom(){const n=$('joinName').value.trim(),r=document.querySelector('#joinRoles .mode.on')?.dataset.role||'players-only',t=$('joinTeam')?.value||'A';if(!n&&r!=='display')return toast('اكتب اسمك');meName=n;role=r;meTeam=t;click();socket.emit('room:join',{code:joinCode,name:n,team:t,role:r})}
function toast(m){let x=$('toast');if(!x){x=document.createElement('div');x.id='toast';x.style='position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:100;background:#151b30;border:1px solid #394462;border-radius:999px;padding:12px 18px;font-weight:900;box-shadow:0 20px 60px #0008';document.body.appendChild(x)}x.textContent=m;clearTimeout(window.tt);window.tt=setTimeout(()=>x.remove(),2600)}
function flash(text,kind=''){$('fx')?.remove();const d=document.createElement('div');d.id='fx';d.className='dangerFlash';d.textContent=text;d.style.color=kind==='good'?'#43e8ab':kind==='gold'?'#ffd45a':'#ff405f';document.body.appendChild(d);setTimeout(()=>d.remove(),1000)}
function countdown(deadline){const el=$('liveTimer');if(!el)return;const tick=()=>{const n=Math.max(0,Math.ceil((deadline-Date.now())/1000));el.textContent=n;if(n<=0)clearInterval(window.tick)};tick();clearInterval(window.tick);window.tick=setInterval(tick,100)}
function scoreList(){return state.players.slice().sort((a,b)=>b.score-a.score)}
function render(){if(!state)return;const g=state.type;const fn={family:renderFamily,guess:renderGuess,market:renderMarket,trap:renderTrap,standing:renderStanding,bank:renderBank,million:renderMillion}[g];fn();}
function shell(title,body){app.innerHTML=`<div class="stage"><main class="card stageCard"><div class="stageHead"><div><div class="eyebrow">${state.code} • ${state.currentRound}/${state.rounds}</div><div class="gameTitle">${title}</div></div><div class="meta"><span class="pill">👥 ${state.players.length}</span><button class="btn ghost" onclick="audioOn=!audioOn">🔊</button><button class="btn ghost" onclick="home()">⌂</button></div></div>${body}<div class="credit">تم إنشاء اللعبة من قبل أغيد</div></main></div>`}
function renderLobby(extra=''){const list=state.players.map(p=>`<div class="playerChip">👤 ${esc(p.name)} <b>${p.score}</b></div>`).join('');return `<div class="questionBox"><div class="eyebrow">الغرفة جاهزة</div><h1>جاهزين؟</h1><p class="small">الهوست: ${state.host===undefined?'': 'أغيد'} • اختاروا اللعب وابدأوا.</p><div class="playersGrid">${list||'<div class="small">بانتظار اللاعبين…</div>'}</div>${role==='player'&&meName?`<button class="btn primary" style="margin-top:20px" onclick="startGame()">🎲 ابدأ اللعبة</button>`:''}${extra}</div>`}
function startGame(){click();socket.emit('room:start')}
function renderFamily(){const teams=state.teams||[];const answers=state.answers||[];const canStart=role==='player';const me=teams.find(t=>t.id===meTeam);const written=state.mode==='display-players';let controls='';if(state.phase==='lobby')controls=renderLobby();else{const buzz=state.buzzer;controls=`<div class="scoreRow">${teams.map(t=>`<div class="scoreCard ${t.id==='A'?'a':'b'}"><div class="scoreName">${t.id==='A'?'🔴':'🔵'} ${esc(t.name)}</div><div class="scoreNum">${t.score}</div><div class="scoreSub">${t.strikes?'❌'.repeat(t.strikes):'بدون ضربات'} • ${t.players.map(p=>esc(p.name)).join('، ')}</div></div>`).join('')}</div><div class="questionBox"><div class="eyebrow">السؤال ${state.currentRound} من ${state.rounds}</div><h1>${esc(state.question?.text||'')}</h1>${buzz?`<div class="feedback">🔔 <b>${esc(buzz.name)}</b> ضغط أولًا — ${buzz.team==='A'?'الفريق الأحمر':'الفريق الأزرق'}</div>`:''}${state.double?`<div class="feedback" style="color:var(--gold)">⚡ DOUBLE — ${esc(state.double.name)} ×2</div>`:''}<div class="answers">${answers.map((a,i)=>`<div class="answerTile ${a.revealed?'reveal':'hidden'}">${a.revealed?`<div>${esc(a.text)}<span class="pts">${a.points} نقطة</span></div>`:'؟'}</div>`).join('')}</div>${role==='player'&&me&&!buzz&&!written?`<button class="buzzer" onclick="familyBuzz()">BUZZ</button><div class="actionBar"><button class="btn gold" onclick="familyDouble()" ${me.doubleUsed?'disabled':''}>⚡ DOUBLE</button></div>`:''}${role==='player'&&me&&written&&!state.answerLock?`<div class="actionBar"><button class="btn gold" onclick="familyWritten()">✍️ أجاوب كتابيًا <small>10 ثواني</small></button><button class="btn gold" onclick="familyWrittenDouble()" ${me.doubleUsed?'disabled':''}>⚡ Double كتابي</button></div>`:''}${state.answerLock&&state.answerLock.id===socket.id?`<div class="actionBar"><input class="input" id="familyAnswer" placeholder="إجابتك" style="max-width:500px"><button class="btn primary" onclick="familyWrittenSubmit()">إرسال</button><span class="pill">⏱️ <span id="liveTimer">10</span></span></div>`:''}${state.answerLock&&state.answerLock.id!==socket.id?`<div class="feedback">✍️ ${esc(state.answerLock.name)} يجاوب الآن — ⏱️ <span id="liveTimer">10</span></div>`:''}<div class="actionBar">${role!=='display'?`<button class="btn ghost" onclick="revealAllFamily()">👁️ كشف الكل</button>`:''}${state.currentRound<state.rounds&&role==='player'?`<button class="btn primary" onclick="nextGame()">السؤال التالي 🎲</button>`:''}</div></div>`}shell('Family Feud',controls)}
function familyBuzz(){click();socket.emit('family:buzz')}function familyDouble(){click();socket.emit('family:double')}function familyWritten(){click();socket.emit('family:written',{answer:''})}function familyWrittenDouble(){click();socket.emit('family:writtenDouble')}function familyWrittenSubmit(){const a=$('familyAnswer')?.value.trim();if(!a)return toast('اكتب إجابتك');socket.emit('family:writtenSubmit',{answer:a})}function revealAllFamily(){click();(state.answers||[]).forEach((_,i)=>socket.emit('family:reveal',{index:i}))}function nextGame(){click();socket.emit('game:next')}
function renderGuess(){if(state.phase==='lobby')return shell('خمنها',renderLobby());const cards=state.players.map(p=>{const rev=state.revealed?.[p.id];return `<div class="playerChip ${p.id===socket.id?'':'" style="min-height:140px'}"><b>${esc(p.name)}</b><div style="font-size:34px;margin:12px 0">${p.id===socket.id?'🙈':rev?`🪄 ${esc(state.secret?.[p.id]||'')}`:'🔒 ؟؟؟'}</div>${p.id!==socket.id&&!rev?`<button class="btn primary" onclick="guessReveal('${p.id}')">كشف</button>`:''}${p.id!==socket.id&&rev?`<div class="row"><input class="input" id="guess_${p.id}" placeholder="خمن الكلمة"><button class="btn gold" onclick="guessTry('${p.id}')">خمن</button></div>`:''}</div>`}).join('');shell('خمنها',`<div class="questionBox"><div class="eyebrow">التصنيف</div><h1>${esc(state.category||'')}</h1><div class="playersGrid">${cards}</div>${state.guessResult?`<div class="feedback" style="margin-top:16px;color:${state.guessResult.ok?'var(--green)':'var(--red)'}">${state.guessResult.ok?'🎯 صح!':'❌ خطأ!'} ${esc(state.guessResult.guesser)} → ${esc(state.guessResult.target)} ${state.guessResult.ok?`+${state.guessResult.points}`:''}</div>`:''}<div class="actionBar">${state.currentRound<state.rounds?`<button class="btn primary" onclick="nextGame()">تصنيف جديد 🔄</button>`:`<button class="btn gold" onclick="podium()">🏆 النتيجة</button>`}</div></div>`)}
function guessReveal(id){click();socket.emit('guess:reveal',{target:id})}function guessTry(id){const a=$('guess_'+id)?.value.trim();if(!a)return toast('اكتب التخمين');socket.emit('guess:guess',{target:id,answer:a})}function podium(){const s=scoreList();flash('🏆','gold');toast('1️⃣ '+(s[0]?.name||'—')+' • '+(s[0]?.score||0)+' نقطة')}
function renderMarket(){if(state.phase==='lobby')return shell('السوق',renderLobby());let body=`<div class="questionBox"><div class="eyebrow">تحدي السوق • ${state.currentRound}/${state.rounds}</div><h1>${esc(state.question?.q||'')}</h1><div class="pill" style="margin:auto">💰 قيمة التحدي ${state.question?.points||0}</div>`;if(state.phase==='countdown')body+=`<div class="timer" id="liveTimer">3</div><div class="feedback">استعدوا… الـBuzzer يفتح بعد العد التنازلي</div>`;if(state.phase==='buzzer')body+=`<button class="buzzer" onclick="marketBuzz()">اضغط!</button>`;if(state.phase==='answer')body+=`<div class="feedback">🔥 ${esc(state.buzzer?.name||'')} يجاوب الآن — <span id="liveTimer">5</span></div>`;if(state.phase==='vote')body+=`<div class="feedback">🗳️ هل قام ${esc(state.buzzer?.name||'')} بالإجابة بشكل صحيح؟</div><div class="actionBar">${state.players.filter(p=>p.id!==state.buzzer?.id).map(p=>`<button class="btn green" onclick="marketVote(true)">✅ نعم</button><button class="btn red" onclick="marketVote(false)">❌ لا</button>`).slice(0,2).join('')}</div>`;if(state.marketResult?.result)body+=`<div class="feedback" style="color:${state.marketResult.result==='correct'?'var(--green)':'var(--red)'}">${state.marketResult.result==='correct'?'🎉 أُقرت الإجابة!':'💥 رُفضت الإجابة!'} ${state.buzzer?.name}</div>`;body+=`<div class="playersGrid" style="margin-top:20px">${scoreList().map(p=>`<div class="playerChip">${esc(p.name)} <b style="float:left">${p.score}</b></div>`).join('')}</div><div class="actionBar">${state.phase==='result'||state.marketResult?.result?`<button class="btn primary" onclick="nextGame()">التالي</button>`:''}</div></div>`;shell('السوق',body);if(state.deadline)countdown(state.deadline)}
function marketBuzz(){click();socket.emit('market:buzz')}function marketVote(y){click();socket.emit('market:vote',{yes:y})}
function renderTrap(){if(state.phase==='lobby')return shell('المفخخة',renderLobby());let body=`<div class="questionBox"><div class="eyebrow">المفخخة • ${state.currentRound}/${state.rounds}</div><h1>${esc(state.question?.text||'')}</h1>${state.phase==='buzzer'?`<button class="buzzer" onclick="trapBuzz()">💣 BUZZ</button>`:''}${state.phase==='answer'?`<div class="feedback">${esc(state.buzzer?.name||'')} معه <span id="liveTimer">3</span> ثواني!</div><div class="actionBar"><input class="input" id="trapAnswer" placeholder="قل إجابتك" style="max-width:520px"><button class="btn primary" onclick="trapSubmit()">كشف الإجابة 🎭</button></div>`:''}<div class="answers">${(state.answers||[]).map(a=>`<div class="answerTile ${a.revealed?'reveal':'hidden'}">${a.revealed?`<div>${esc(a.text)}<span class="pts">${a.points>0?'+':''}${a.points}</span></div>`:'؟'}</div>`).join('')}</div>${state.trapResult?`<div class="feedback" style="color:${state.trapResult.kind==='trap'?'var(--red)':'var(--green)'}">${state.trapResult.kind==='trap'?'💣 BOOM! إجابة مفخخة':'✅ إجابة صحيحة'} — ${esc(state.trapResult.answer)} ${state.trapResult.kind==='outside'?`<small> • صحيحة خارج اللائحة +${state.trapResult.points}</small>`:''}</div>`:''}<div class="actionBar">${state.phase==='result'?`<button class="btn primary" onclick="nextGame()">التالي</button>`:''}</div></div>`;shell('المفخخة',body);if(state.deadline)countdown(state.deadline)}
function trapBuzz(){click();socket.emit('trap:buzz')}function trapSubmit(){const a=$('trapAnswer')?.value.trim();if(!a)return toast('اكتب إجابتك');socket.emit('trap:answer',{answer:a})}
function renderStanding(){if(state.phase==='lobby')return shell('الصملة',renderLobby());const active=state.players.filter(p=>p.alive);let body=`<div class="questionBox"><div class="eyebrow">الصملة • الجولة ${state.currentRound}</div><h1>${esc(state.question?.text||'')}</h1>${state.phase==='answering'?`<div class="timer" id="liveTimer">7</div><div class="actionBar"><input class="input" id="standAnswer" placeholder="إجابتك بسرعة" style="max-width:600px"><button class="btn primary" onclick="standSubmit()">صملتها 💪</button></div>`:''}${state.phase==='result'?`<div class="feedback">⚔️ تم الحسم. راجعوا من خرج ومن صمل.</div>`:''}<div class="playersGrid">${state.players.map(p=>`<div class="playerChip ${p.alive?'':'dead'}">${p.alive?'🟢':'💀'} ${esc(p.name)} <b style="float:left">${p.score}</b></div>`).join('')}</div>${state.phase==='result'?`<div class="actionBar"><button class="btn primary" onclick="nextGame()">الجولة التالية</button></div>`:''}</div>`;shell('الصملة',body);if(state.deadline)countdown(state.deadline)}
function standSubmit(){const a=$('standAnswer')?.value.trim();if(!a)return;socket.emit('standing:answer',{answer:a})}
function renderBank(){if(state.phase==='lobby')return shell('البنك',renderLobby());const me=state.players.find(p=>p.id===socket.id)||state.players[0]||{score:5000};const info=state.bankInfo||{};let body=`<div class="questionBox"><div class="eyebrow">البنك • الجولة ${state.currentRound}/${state.rounds}</div><div class="bigBalance">${(info.bank??me.score).toLocaleString()} 💰</div><div class="small">الرصيد المؤمّن: ${(info.secured||0).toLocaleString()} 🏦</div><h1>${esc(state.question?.q||'')}</h1>${state.phase==='risk'?`<div class="riskGrid"><div class="risk" onclick="bankRisk(500)"><strong>500</strong><small>آمن</small></div><div class="risk" onclick="bankRisk(1500)"><strong>1,500</strong><small>جريء</small></div><div class="risk" onclick="bankRisk(3000)"><strong>3,000</strong><small>مجنون</small></div></div>`:''}${state.phase==='bankAnswer'?`<div class="feedback">🎯 أثبت نفسك — <span id="liveTimer">5</span> ثواني</div><div class="actionBar"><button class="btn green" onclick="bankResult(true)">✅ نجحت</button><button class="btn red" onclick="bankResult(false)">❌ فشلت</button></div>`:''}${state.depositOpen?`<div class="feedback" style="margin-top:15px">🏦 <b>فتح البنك!</b> تقدر تؤمّن جزءًا من رصيدك.</div><div class="actionBar"><button class="btn gold" onclick="deposit()">🔒 إيداع الرصيد الحالي</button></div>`:''}<div class="actionBar">${state.phase==='risk'&&state.currentRound<state.rounds?`<button class="btn primary" onclick="nextGame()">تحدي جديد</button>`:''}</div></div>`;shell('البنك',body);if(state.deadline)countdown(state.deadline)}
function bankRisk(n){click();socket.emit('bank:risk',{amount:n})}function bankResult(ok){click();socket.emit('bank:result',{ok})}function deposit(){click();socket.emit('bank:deposit',{amount:state.bankInfo?.bank||0});flash('🏦','gold')}
function renderMillion(){if(state.phase==='lobby')return shell('المليون',renderLobby());const ladder=[1000,5000,10000,25000,50000,100000,250000,500000,1000000];let body=`<div class="millionLayout"><div><div class="questionBox"><div class="eyebrow">السؤال ${state.currentRound} • الجائزة التالية</div><h1>${esc(state.question?.q||'')}</h1><div class="options">${(state.options||[]).map((o,i)=>`<button class="option" onclick="millionAnswer(${i})">${o?esc(o):'—'}</button>`).join('')}</div><div class="lifelines" style="justify-content:center;margin-top:15px">${Object.entries({audience:'👥 الجمهور',fifty:'✂️ 50/50',switch:'🔄 تغيير',secure:'🛡️ تأمين'}).map(([k,v])=>`<button class="btn ghost" onclick="millionLife('${k}')" ${state.lifelines?.[k]?'':'disabled'}>${v}</button>`).join('')}</div></div></div><aside class="ladder">${ladder.slice().reverse().map((n,i)=>{const idx=ladder.length-1-i;return `<div class="${idx===state.currentRound-1?'cur':''}"><span>${idx+1}</span><b>${n.toLocaleString()}</b></div>`}).join('')}</aside></div>`;shell('المليون',body)}
function millionAnswer(i){click();socket.emit('million:answer',{index:i})}function millionLife(k){click();socket.emit('million:life',{kind:k})}
socket.on('room:created',x=>{gameCode=x.code;joinCode=x.code;meName=x.name;toast('تم إنشاء '+x.code);setTimeout(()=>socket.emit('room:join',{code:x.code,name:meName,team:'A',role:'player'}),100)})
socket.on('room:info',x=>{info=x;showJoin(x)})
socket.on('error:msg',m=>{error();toast('⚠️ '+m)})
socket.on('state',s=>{const prev=state;state=s;if(s.buzzer&&(!prev||!prev.buzzer))tone(880,.25,'square',.08);if(s.trapResult?.kind==='trap'&&(!prev||!prev.trapResult))boom();if(s.trapResult?.kind==='listed'&&(!prev||!prev.trapResult))success();if(s.phase==='finished'&&(!prev||prev.phase!=='finished'))flash('🏆','gold');render()})
const q=new URLSearchParams(location.search).get('join');if(q){joinCode=q.toUpperCase();socket.emit('room:lookup',{code:joinCode})}else home();
</script></body></html>
