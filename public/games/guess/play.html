<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>خمنها • لعب</title><style>body{margin:0;background:#070812;color:#fff;font-family:Tahoma,Arial}.wrap{max-width:1100px;margin:auto;padding:18px}.card{background:#11172a;border:1px solid #303a58;border-radius:24px;padding:22px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.player{padding:18px;border:1px solid #394562;border-radius:18px;background:#151d31}.btn{padding:14px;border:0;border-radius:14px;background:#765cff;color:white;font-weight:bold;cursor:pointer}.input{width:100%;padding:14px;box-sizing:border-box;background:#080d19;color:#fff;border:1px solid #3a4560;border-radius:14px}.word{font-size:46px;font-weight:1000;text-align:center;margin:30px}.muted{color:#aeb5ca}</style></head><body><main class="wrap"><div id="app" class="card"><h2>جارٍ الاتصال…</h2></div></main><script src="/socket.io/socket.io.js"></script><script>const s=io(),code=new URLSearchParams(location.search).get('code');function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function render(g){document.getElementById('app').innerHTML='<h1>🎯 خمنها</h1><div class="muted">الغرفة: '+esc(g.code)+' • الجولة '+g.round+'/'+g.maxRounds+'</div><div class="grid">'+g.players.map(p=>'<div class="player"><b>'+esc(p.name)+'</b><div>النقاط: '+(p.score||0)+'</div><div style="margin-top:10px"><button class="btn" onclick="reveal(\''+p.id+'\')">كشف</button></div>'+ (p.revealedWord?'<div class="word" style="font-size:24px">'+esc(p.revealedWord)+'</div>':'')+'</div>').join('')+'</div>'+(g.phase==='lobby'?'<button class="btn" style="width:100%;margin-top:18px" onclick="start()">ابدأ الجولة</button>':g.phase==='round'?'<div style="margin-top:18px"><input id="a" class="input" placeholder="اكتب تخمينك"><button class="btn" style="width:100%;margin-top:8px" onclick="guess()">تخمين</button></div>':'<button class="btn" style="width:100%;margin-top:18px" onclick="next()">الجولة التالية</button>')}s.on('state',render);s.emit('room:join',{code,name:localStorage.getItem('guess_name')||'لاعب',sessionToken:localStorage.getItem('guess_session')});function start(){s.emit('guess:start')}function next(){s.emit('guess:next')}function guess(){s.emit('guess:guess',{answer:document.getElementById('a').value})}function reveal(id){s.emit('guess:reveal',{targetId:id})}s.on('guess:wrong',()=>alert('❌ إجابة غير صحيحة'));s.on('guess:correct',x=>alert('✅ صحيح! +'+x.points));s.on('errorMsg',x=>alert(x))</script></body></html>
