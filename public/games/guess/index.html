<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>خمنها • الساحة</title><style>body{margin:0;background:#070812;color:#fff;font-family:Tahoma,Arial}.wrap{max-width:900px;margin:auto;padding:24px}.card{background:#11172a;border:1px solid #303a58;border-radius:24px;padding:24px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.btn{padding:18px;border:0;border-radius:16px;font-weight:bold;cursor:pointer;background:#765cff;color:white;font-size:18px}.input{width:100%;padding:15px;border-radius:14px;border:1px solid #3a4560;background:#080d19;color:white;box-sizing:border-box;margin:8px 0}.muted{color:#aeb5ca}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="card"><h1>🎯 خمنها</h1><p class="muted">لعبة مستقلة. اختر فئة، أنشئ غرفة أو انضم إليها.</p><div class="grid"><button class="btn" onclick="create()">إنشاء غرفة</button><button class="btn" onclick="join()">انضمام</button></div><div id="form"></div></div></main><script src="/socket.io/socket.io.js"></script><script>const s=io();let token=localStorage.getItem('guess_session')||((crypto.randomUUID&&crypto.randomUUID())||Math.random().toString(36));localStorage.setItem('guess_session',token);function create(){document.getElementById('form').innerHTML='<input id="name" class="input" placeholder="اسمك"><select id="cat" class="input"><option>🍔 أكلات</option><option>🐾 حيوانات</option><option>🌍 دول</option><option>🏠 أشياء منزلية</option><option>⚽ لاعبي كرة قدم</option><option>👨‍⚕️ وظائف</option></select><button class="btn" style="width:100%" onclick="goCreate()">ابدأ</button>'}function join(){document.getElementById('form').innerHTML='<input id="code" class="input" placeholder="رمز الغرفة"><input id="name" class="input" placeholder="اسمك"><button class="btn" style="width:100%" onclick="goJoin()">دخول</button>'}function goCreate(){s.emit('room:create',{game:'guess',name:document.getElementById('name').value||'لاعب',category:document.getElementById('cat').value,maxRounds:5})}function goJoin(){s.emit('room:join',{code:document.getElementById('code').value,name:document.getElementById('name').value||'لاعب',sessionToken:token})}s.on('room:created',x=>location.href='/games/guess/play?code='+x.code);s.on('joined',x=>location.href='/games/guess/play?code='+x.code);s.on('errorMsg',x=>alert(x));</script></body></html>
