<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>🎨 ارسمها</title><link rel="stylesheet" href="/shared/connection.css"><script src="/socket.io/socket.io.js"></script><script src="/shared/room-lobby.js"></script><style>
:root{--bg:#080b14;--panel:#111727;--line:#27314a;--text:#f7f8fc;--muted:#9ba7bf;--accent:#7c5cff;--ok:#2ed69a}*{box-sizing:border-box}html,body{margin:0;background:radial-gradient(circle at 50% -10%,#273064 0,#080b14 50%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Tahoma,sans-serif;min-height:100%;overflow-x:hidden}.wrap{width:min(1200px,100%);margin:auto;padding:76px 10px 12px}.card{background:rgba(17,23,39,.94);border:1px solid var(--line);border-radius:22px;padding:12px;box-shadow:0 20px 60px #0005}.board{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:10px}.canvasBox{position:relative;background:#fafaf7;border-radius:18px;overflow:hidden;border:2px solid #2c3651;touch-action:none;box-shadow:0 16px 45px #0005}.canvas{display:block;width:100%;height:min(72vh,760px);min-height:430px;touch-action:none;background:#fafaf7}.timer{position:absolute;top:10px;left:10px;padding:7px 12px;background:#080b14dd;border-radius:999px;font-size:18px;font-weight:1000}.toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}.tool{min-width:42px;height:42px;padding:0 9px;border-radius:12px;border:1px solid var(--line);background:#151c2d;color:#fff;font-weight:900}.tool.active{background:#6f56ff;border-color:#9b87ff}.color{width:34px;height:34px;min-width:34px;border-radius:50%;padding:0;border:2px solid #fff}.sizeBox{display:flex;align-items:center;gap:5px;background:#0d1322;border:1px solid var(--line);border-radius:12px;padding:4px}.sizeBox b{min-width:34px;text-align:center}.secret{background:#171e31;border:1px solid #39445f;border-radius:16px;padding:12px;text-align:center;margin-bottom:8px}.secret small{display:block;color:var(--muted);margin-bottom:4px}.secret b{font-size:23px}.side h3{margin:0 0 7px}.guessRow{display:flex;gap:6px}.guessRow input{flex:1;min-width:0}.guessRow input,.btn{min-height:44px;border-radius:12px;border:1px solid var(--line);padding:9px 11px;font:inherit}.btn{background:#151c2d;color:#fff;font-weight:900}.primary{background:linear-gradient(135deg,#7c5cff,#4d7cff);border:0}.chat{height:240px;overflow:auto;margin-top:8px;padding:6px;background:#0c1220;border-radius:14px;border:1px solid #202940}.msg{padding:7px 8px;border-bottom:1px solid #1d2638;font-size:12px}.msg.correct{background:rgba(46,214,154,.10);border-color:rgba(46,214,154,.25);color:#8ff0c5;font-weight:900}.msg .ans{color:#dce2ef}.scores{margin-top:8px}.score{display:flex;justify-content:space-between;padding:8px 10px;border:1px solid #202940;border-radius:11px;margin-top:5px;font-size:12px}.result{text-align:center;padding:16px}.answer{font-size:30px;font-weight:1000;margin:8px}.winnerRows{display:grid;gap:6px;margin:10px 0}.winnerRow{display:flex;justify-content:space-between;padding:8px 10px;border-radius:11px;background:#141b2b;border:1px solid #28324a}.notice{color:var(--muted);line-height:1.6}.conn{margin-bottom:8px;padding:8px 10px;border-radius:12px;background:#171e31;border:1px solid #2a3550;color:#aab5ca;text-align:center;font-size:11px}.hidden{display:none}@media(max-width:820px){.wrap{padding-top:68px}.board{grid-template-columns:1fr}.side{order:2}.canvas{height:62vh;min-height:390px}.chat{height:190px}}
</style></head><body><main class="wrap"><div id="conn" class="conn">🟡 جاري الاتصال بالغرفة…</div><section id="app" class="card"><div class="notice">جاري تجهيز الغرفة…</div></section></main><script src="/shared/connection.js"></script><script>
const socket=io({reconnection:true,reconnectionAttempts:Infinity,reconnectionDelay:500,reconnectionDelayMax:3000});const qs=new URLSearchParams(location.search),code=(qs.get('code')||'').toUpperCase();let token=qs.get('sessionToken')||'',name=qs.get('name')||'لاعب',me=null,G=null,canvas,ctx,drawing=false,points=[],tool='pen',color='#111827',width=5,lastRound=0;const SESSION_KEY='saha.draw.sessions';try{if(!token){const saved=JSON.parse(localStorage.getItem(SESSION_KEY)||'[]').find(x=>x.code===code);if(saved?.token){token=saved.token;name=saved.name||name}}}catch(e){}if(!code)location.href='/';
function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&bsol;','"':'&quot;'}[c]||c))}function fmt(ms){return Math.max(0,Math.ceil(ms/1000))}function setConn(ok,msg){const e=document.getElementById('conn');e.textContent=msg;e.style.borderColor=ok?'#245c4b':'#653344';e.style.color=ok?'#91e7c4':'#ff9bad'}function save(){try{const a=JSON.parse(localStorage.getItem(SESSION_KEY)||'[]').filter(x=>x.code!==code);if(token)a.unshift({code,name,token,updatedAt:Date.now()});localStorage.setItem(SESSION_KEY,JSON.stringify(a.slice(0,8)))}catch(e){}}function join(){if(!socket.connected)return;setConn(true,token?'🟢 متصل — استعادة الجلسة…':'🟢 متصل — دخول الغرفة…');socket.emit(token?'room:resume':'room:join',token?{code,sessionToken:token,name}:{code,name})}socket.on('connect',join);socket.on('disconnect',()=>setConn(false,'🔴 انقطع الاتصال — إعادة الاتصال تلقائيًا…'));socket.on('connect_error',()=>setConn(false,'🟠 تعذر الاتصال مؤقتًا — نحاول من جديد…'));socket.on('joined',x=>{if(x.code===code){me=x.playerId;token=x.sessionToken||token;save();setConn(true,'🟢 متصل بالغرفة');}});socket.on('resumeFailed',x=>{if(x?.code===code)setConn(false,x.message||'تعذر استعادة الجلسة')});socket.on('errorMsg',x=>{if(x)alert(x)});
function applyStroke(st){if(!ctx||!st?.points?.length)return;const r=canvas.getBoundingClientRect();ctx.save();ctx.strokeStyle=st.color||'#111827';ctx.fillStyle=st.color||'#111827';ctx.lineWidth=(st.width||5)*r.width;ctx.lineCap='round';ctx.lineJoin='round';const p0=st.points[0],x0=p0.x*r.width,y0=p0.y*r.height;if(st.points.length===1){ctx.beginPath();ctx.arc(x0,y0,Math.max(1,(st.width||5)*r.width/2),0,Math.PI*2);ctx.fill()}else{ctx.beginPath();ctx.moveTo(x0,y0);st.points.slice(1).forEach(p=>ctx.lineTo(p.x*r.width,p.y*r.height));ctx.stroke()}ctx.restore()}
function fillAt(x,y,c){if(!ctx||!canvas)return;const r=canvas.getBoundingClientRect(),w=canvas.width,h=canvas.height;let px=Math.max(0,Math.min(w-1,Math.floor(x*w))),py=Math.max(0,Math.min(h-1,Math.floor(y*h)));const img=ctx.getImageData(0,0,w,h),d=img.data,idx=(py*w+px)*4,target=[d[idx],d[idx+1],d[idx+2],d[idx+3]],rgb=hexRgb(c);if(!rgb)return;if(Math.abs(target[0]-rgb[0])+Math.abs(target[1]-rgb[1])+Math.abs(target[2]-rgb[2])<10)return;const q=[[px,py]],seen=new Uint8Array(w*h);seen[py*w+px]=1;const tol=35;while(q.length){const [cx,cy]=q.pop(),i=(cy*w+cx)*4;if(Math.abs(d[i]-target[0])+Math.abs(d[i+1]-target[1])+Math.abs(d[i+2]-target[2])+Math.abs(d[i+3]-target[3])>tol)continue;d[i]=rgb[0];d[i+1]=rgb[1];d[i+2]=rgb[2];d[i+3]=255;const ns=[[cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]];for(const [nx,ny] of ns)if(nx>=0&&nx<w&&ny>=0&&ny<h){const ni=ny*w+nx;if(!seen[ni]){seen[ni]=1;q.push([nx,ny])}}}ctx.putImageData(img,0,0)}function hexRgb(h){const m=String(h).match(/^#([0-9a-f]{6})$/i);return m?[parseInt(m[1].slice(0,2),16),parseInt(m[1].slice(2,4),16),parseInt(m[1].slice(4,6),16)]:null}
function redraw(){if(!canvas)return;const r=canvas.getBoundingClientRect();ctx.fillStyle='#fafaf7';ctx.fillRect(0,0,r.width,r.height);(G?.strokes||[]).forEach(applyStroke);(G?.fills||[]).forEach(f=>fillAt(f.x,f.y,f.color))}
function setup(){canvas=document.getElementById('canvas');if(!canvas)return;const r=canvas.getBoundingClientRect(),d=devicePixelRatio||1;canvas.width=Math.max(1,Math.floor(r.width*d));canvas.height=Math.max(1,Math.floor(r.height*d));ctx=canvas.getContext('2d');ctx.setTransform(d,0,0,d,0,0);ctx.fillStyle='#fafaf7';ctx.fillRect(0,0,r.width,r.height);redraw();canvas.onpointerdown=e=>{if(!(G?.drawerIds||[]).includes(me)||!socket.connected)return;const p=pos(e);if(tool==='fill'){socket.emit('draw:fill',{x:p.x,y:p.y,color});fillAt(p.x,p.y,color);return}drawing=true;points=[p];canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drawing)return;points.push(pos(e));drawPreview()};canvas.onpointerup=e=>{if(!drawing)return;drawing=false;if(points.length)socket.emit('draw:stroke',{points,color,width});points=[];redraw()};canvas.onpointercancel=()=>{drawing=false;points=[];redraw()}}
function pos(e){const r=canvas.getBoundingClientRect();return{x:Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),y:Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))}}function drawPreview(){redraw();if(!points.length)return;applyStroke({points,color,width})}function setTool(t){tool=t;if(t==='eraser')color='#fafaf7';render();}function setColor(c){color=c;tool='pen';render()}function size(d){width=Math.max(2,Math.min(30,width+d));render()}function undo(){socket.emit('draw:undo')}function clearCanvas(){if(confirm('مسح الرسم كاملًا؟'))socket.emit('draw:clear')}function guess(){const e=document.getElementById('guess');if(e?.value.trim())socket.emit('draw:guess',{answer:e.value.trim()});if(e)e.value=''}function tick(){const e=document.getElementById('timer');if(e){e.textContent=fmt((G?.roundEndsAt||0)-Date.now());if(G?.phase==='drawing')setTimeout(tick,500)}}
function render(){if(!G)return;const drawer=(G.drawerIds||[]).includes(me),host=G.hostId===me;if(G.phase==='lobby'){document.getElementById('app').innerHTML=`<div class="result"><div style="font-size:54px">🎨</div><h2>جاهزون للرسم</h2><p class="notice">افتح «الغرفة» بالأعلى لرؤية الكود والـQR والإعدادات واللاعبين.</p><div class="scores">${G.players.map(p=>`<div class="score"><span>${esc(p.name)}</span><b>${p.online===false?'غير متصل':'متصل ✓'}</b></div>`).join('')}</div></div>`;return}if(G.phase==='drawing'){document.getElementById('app').innerHTML=`<div class="board"><div><div class="canvasBox"><canvas id="canvas" class="canvas"></canvas><div class="timer" id="timer">${fmt(G.roundEndsAt-Date.now())}</div></div>${drawer?`<div class="secret"><small>الكلمة السرية ${G.style==='together'?'لكم أنتم الاثنين':''}</small><b>${esc(G.word)}</b><div class="toolbar"><button class="tool ${tool==='pen'?'active':''}" onclick="setTool('pen')">🖊️</button><button class="tool ${tool==='eraser'?'active':''}" onclick="setTool('eraser')">🧽</button><button class="tool ${tool==='fill'?'active':''}" onclick="setTool('fill')">🪣</button><div class="sizeBox"><button class="tool" onclick="size(-2)">−</button><b>${width}</b><button class="tool" onclick="size(2)">+</button></div><button class="tool color" style="background:#111827" onclick="setColor('#111827')"></button><button class="tool color" style="background:#e53935" onclick="setColor('#e53935')"></button><button class="tool color" style="background:#1e88e5" onclick="setColor('#1e88e5')"></button><button class="tool color" style="background:#43a047" onclick="setColor('#43a047')"></button><button class="tool color" style="background:#f6c945" onclick="setColor('#f6c945')"></button><button class="tool" onclick="undo()">↩️</button><button class="tool" onclick="clearCanvas()">🗑️</button></div></div>`:'<div class="notice">🎯 شاهد الرسم واكتب تخمينك. الإجابات الصحيحة تُحتسب حسب ترتيب الوصول.</div>'}</div><aside class="side"><h3>الجولة ${G.round}/${G.maxRounds}</h3><div class="notice">${G.style==='together'?'👥 رسامان معًا':'🎨 رسام واحد'} • ${drawer?'أنت ترسم':'أنت تخمّن'}</div>${!drawer?`<div class="guessRow" style="margin-top:8px"><input id="guess" maxlength="60" placeholder="اكتب تخمينك…" onkeydown="if(event.key==='Enter')guess()"><button class="btn primary" onclick="guess()">إرسال</button></div>`:''}<div class="chat">${(G.guesses||[]).slice().map(x=>`<div class="msg ${x.correct?'correct':''}"><b>${esc(x.player)}</b>: <span class="ans">${esc(x.answer||'تخمين')}</span> ${x.correct?`<span>✓ عرفها +${x.points}</span>`:''}</div>`).join('')||'<div class="notice">لا توجد إجابات بعد.</div>'}</div><div class="scores">${G.players.map(p=>`<div class="score"><span>${esc(p.name)}</span><b>${G.scores?.[p.id]||0}</b></div>`).join('')}</div></aside></div>`;setup();tick();return}if(G.phase==='roundResult'){const rows=G.roundResult?.winners||[];document.getElementById('app').innerHTML=`<div class="result"><div style="font-size:48px">🎉</div><h2>انتهت الجولة</h2><div class="answer">${esc(G.roundResult?.answer||'')}</div>${rows.length?`<div class="winnerRows">${rows.map(r=>`<div class="winnerRow"><span>${r.place}. ${esc(r.name)}</span><b>+${r.points}</b></div>`).join('')}</div>`:'<p>⏰ لم يعرفها أحد قبل انتهاء الوقت.</p>'}<p class="notice">الجولة التالية ستبدأ تلقائيًا، وسيأتي دور اللاعب التالي.</p></div>`;return}if(G.phase==='finished'){const rows=[...G.players].sort((a,b)=>(G.scores[b.id]||0)-(G.scores[a.id]||0));document.getElementById('app').innerHTML=`<div class="result"><div style="font-size:62px">🏆</div><h1>نهاية ارسمها</h1>${rows.map((p,i)=>`<div class="score"><span>${i+1}. ${esc(p.name)}</span><b>${G.scores?.[p.id]||0}</b></div>`).join('')}<div style="margin-top:12px"><button class="btn primary" onclick="socket.emit('draw:restart')">🔄 لعب مرة أخرى</button></div></div>`}}
socket.on('draw:state',s=>{G=s;render()});socket.on('draw:stroke',st=>{G=G||{};G.strokes=[...(G.strokes||[]),st];if(document.getElementById('canvas')){applyStroke(st)}});socket.on('draw:fill',f=>{G=G||{};G.fills=[...(G.fills||[]),f];fillAt(f.x,f.y,f.color)});socket.on('draw:sync',x=>{if(G){G.strokes=x.strokes||[];G.fills=x.fills||[];redraw()}});socket.on('draw:guessResult',x=>{if(G){G.guesses=[...(G.guesses||[]),x];try{new Audio(x.correct?'/audio/correct.wav':'/audio/wrong.wav').play().catch(()=>{})}catch(e){}render()}});socket.on('draw:correct',x=>{try{new Audio('/audio/correct.wav').play().catch(()=>{})}catch(e){}if(G){G.scores=G.scores||{};G.scores[me]=(G.scores[me]||0)+(x.points||0);render()}});join();
</script></body></html>
