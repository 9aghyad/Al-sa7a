</style></head><body><main class="page"><div id="conn" style="display:none"></div><div class="drawTop"><div class="roundPill" id="roundPill">🎨 ارسمها</div><div class="playersStrip" id="playersStrip"></div></div><section id="app" class="canvasStage"><div class="notice">جاري تجهيز اللعبة…</div></section></main><script src="/shared/connection.js"></script><script>
const socket=io({reconnection:true,reconnectionAttempts:Infinity,reconnectionDelay:500,reconnectionDelayMax:3000});const qs=new URLSearchParams(location.search),code=(qs.get('code')||'').toUpperCase();let token=qs.get('sessionToken')||'',name=qs.get('name')||'لاعب',me=null,G=null,canvas=null,ctx=null,drawing=false,points=[],tool='pen',color='#111827',width=3,guessOpen=false;const SESSION_KEY='saha.draw.sessions';
try{if(!token){const saved=JSON.parse(localStorage.getItem(SESSION_KEY)||'[]').find(x=>x.code===code);if(saved?.token){token=saved.token;name=saved.name||name}}}catch(e){}if(!code)location.href='/';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]||c));const fmt=ms=>Math.max(0,Math.ceil(ms/1000));function save(){try{let a=JSON.parse(localStorage.getItem(SESSION_KEY)||'[]').filter(x=>x.code!==code);if(token)a.unshift({code,name,token,updatedAt:Date.now()});localStorage.setItem(SESSION_KEY,JSON.stringify(a.slice(0,8)))}catch(e){}}
function join(){if(!socket.connected)return;socket.emit(token?'room:resume':'room:join',token?{code,sessionToken:token,name}:{code,name})}socket.on('connect',join);socket.on('joined',x=>{if(x.code!==code)return;me=x.playerId;token=x.sessionToken||token;save()});socket.on('disconnect',()=>{});socket.on('resumeFailed',x=>{if(x?.code===code){try{localStorage.setItem(SESSION_KEY,JSON.stringify(JSON.parse(localStorage.getItem(SESSION_KEY)||'[]').filter(s=>s.code!==code)))}catch(e){}alert(x.message||'تعذر استعادة الجلسة')}});socket.on('errorMsg',x=>x&&alert(x));
function isDrawer(){return !!(G?.drawerIds||[]).includes(me)}function hexRgb(h){const m=String(h).match(/^#([0-9a-f]{6})$/i);return m?[parseInt(m[1].slice(0,2),16),parseInt(m[1].slice(2,4),16),parseInt(m[1].slice(4,6),16)]:null}
function applyStroke(st){if(!ctx||!canvas||!st?.points?.length)return;const r=canvas.getBoundingClientRect();ctx.save();ctx.strokeStyle=st.color||'#111827';ctx.fillStyle=st.color||'#111827';ctx.lineWidth=(st.width||3);ctx.lineCap='round';ctx.lineJoin='round';const p0=st.points[0],x0=p0.x*r.width,y0=p0.y*r.height;if(st.points.length===1){ctx.beginPath();ctx.arc(x0,y0,Math.max(1,(st.width||3)/2),0,Math.PI*2);ctx.fill()}else{ctx.beginPath();ctx.moveTo(x0,y0);st.points.slice(1).forEach(p=>ctx.lineTo(p.x*r.width,p.y*r.height));ctx.stroke()}ctx.restore()}
function fillAt(x,y,c){if(!ctx||!canvas)return;const r=canvas.getBoundingClientRect(),w=Math.max(1,canvas.width),h=Math.max(1,canvas.height),px=Math.max(0,Math.min(w-1,Math.floor(x*w))),py=Math.max(0,Math.min(h-1,Math.floor(y*h)));const img=ctx.getImageData(0,0,w,h),d=img.data,rgb=hexRgb(c);if(!rgb)return;const i0=(py*w+px)*4,target=[d[i0],d[i0+1],d[i0+2],d[i0+3]],q=[[px,py]],seen=new Uint8Array(w*h);seen[py*w+px]=1;const tol=35;while(q.length){const [cx,cy]=q.pop(),i=(cy*w+cx)*4;if(Math.abs(d[i]-target[0])+Math.abs(d[i+1]-target[1])+Math.abs(d[i+2]-target[2])+Math.abs(d[i+3]-target[3])>tol)continue;d[i]=rgb[0];d[i+1]=rgb[1];d[i+2]=rgb[2];d[i+3]=255;for(const [nx,ny] of [[cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]])if(nx>=0&&nx<w&&ny>=0&&ny<h){const ni=ny*w+nx;if(!seen[ni]){seen[ni]=1;q.push([nx,ny])}}}ctx.putImageData(img,0,0)}
function redraw(){if(!canvas||!ctx)return;const r=canvas.getBoundingClientRect();ctx.fillStyle='#fff';ctx.fillRect(0,0,r.width,r.height);(G?.strokes||[]).forEach(applyStroke);(G?.fills||[]).forEach(f=>fillAt(f.x,f.y,f.color))}
function resizeCanvas(){if(!canvas)return;const r=canvas.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);canvas.width=Math.max(1,Math.floor(r.width*d));canvas.height=Math.max(1,Math.floor(r.height*d));ctx=canvas.getContext('2d');ctx.setTransform(d,0,0,d,0,0);ctx.fillStyle='#fff';ctx.fillRect(0,0,r.width,r.height);redraw()}
function pos(e){const r=canvas.getBoundingClientRect();return{x:Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),y:Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))}}
function preview(){redraw();if(points.length)applyStroke({points,color:tool==='eraser'?'#fff':color,width})}
function setupCanvas(){canvas=document.getElementById('canvas');if(!canvas)return;resizeCanvas();canvas.onpointerdown=e=>{if(!isDrawer()||!socket.connected)return;const p=pos(e);if(tool==='fill'){socket.emit('draw:fill',{x:p.x,y:p.y,color});fillAt(p.x,p.y,color);return}drawing=true;points=[p];try{canvas.setPointerCapture(e.pointerId)}catch(_){}preview()};canvas.onpointermove=e=>{if(!drawing)return;points.push(pos(e));preview()};const finish=e=>{if(!drawing)return;drawing=false;if(points.length)socket.emit('draw:stroke',{points,color:tool==='eraser'?'#fff':color,width:tool==='eraser'?Math.max(8,width*2):width});points=[];redraw()};canvas.onpointerup=finish;canvas.onpointercancel=finish}
function setTool(t){tool=t;render()}function setColor(c){color=c;tool='pen';render()}function size(delta){width=Math.max(1,Math.min(16,width+delta));render()}function undo(){if(isDrawer())socket.emit('draw:undo')}function clearCanvas(){if(isDrawer()&&confirm('مسح كل الرسم؟'))socket.emit('draw:clear')}function toggleGuess(){guessOpen=!guessOpen;render()}function submitGuess(){const e=document.getElementById('guessInput');if(e?.value.trim())socket.emit('draw:guess',{answer:e.value.trim()});if(e)e.value=''}
function topPlayers(){const strip=document.getElementById('playersStrip');if(!strip||!G)return;strip.innerHTML=(G.players||[]).map(p=>`<div class="playerChip ${p.id===me?'me':''} ${G.drawerIds?.includes(p.id)?'drawer':''}"><span class="avatar">${p.avatar?`<img src="${esc(p.avatar)}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block">`:G.drawerIds?.includes(p.id)?'✏️':'👤'}</span><div><div class="pname">${esc(p.name)}${p.id===me?' • أنت':''}</div><div class="pscore">${G.scores?.[p.id]||0} نقطة</div></div><i class="topStatus ${p.online!==false?'on':''}"></i></div>`).join('')}
function guessItems(drawer){return (G?.guesses||[]).slice().sort((a,b)=>(a.at||0)-(b.at||0)).map(x=>x.correct?`<div class="guessItem correct">✓ <b>${esc(x.player)}</b> عرف الإجابة! <span>+${x.points}</span></div>`:(G?.showGuesses!==false||drawer)?`<div class="guessItem"><b>${esc(x.player)}</b>: <span class="answerText">${esc(x.answer||'')}</span></div>`:`<div class="guessItem"><b>${esc(x.player)}</b> حاول التخمين…</div>`).join('')||'<div class="muted" style="padding:12px;text-align:center">لا توجد تخمينات بعد.</div>'}
function tools(){return `<div class="tools"><button class="tool ${tool==='pen'?'active':''}" title="قلم" onclick="setTool('pen')">✏️</button><button class="tool ${tool==='fill'?'active':''}" title="تعبئة" onclick="setTool('fill')">🪣</button><button class="tool ${tool==='eraser'?'active':''}" title="مسح يدوي" onclick="setTool('eraser')">🧽</button><button class="tool" title="تراجع" onclick="undo()">↩️</button><div class="sizeCtl"><button class="tool" onclick="size(-1)">−</button><span class="sizeNum">${width}</span><button class="tool" onclick="size(1)">+</button></div><label class="colorWheel" title="اختيار أي لون"><input class="colorInput" type="color" value="${color}" oninput="setColor(this.value)"></label><button class="tool" title="مسح كامل" onclick="clearCanvas()">🗑️</button></div>`}
function recentGuessFlash(){const now=Date.now();const arr=(G?.guesses||[]).filter(x=>x.answer&&((now-(x.at||0))<3000));const x=arr[arr.length-1];return x?`<div class="guessFlash"><span>${esc(x.player)}</span><b>${esc(x.answer)}</b></div>`:''}
function guessChat(){return `<div class="guessChat"><div class="guessChatHead">إجابات اللاعبين</div><div class="guessChatList">${guessItems(false)}</div></div>`}
function render(){if(!G)return;topPlayers();document.getElementById('roundPill').textContent=G.phase==='lobby'?'🎨 غرفة ارسمها':`الجولة ${G.round}/${G.maxRounds}`;const app=document.getElementById('app');if(G.phase==='lobby'){app.innerHTML=`<div class="notice"><div style="font-size:42px">🎨</div><h2>جاهزون للرسم</h2><div class="muted">الكود والإعدادات واللاعبون موجودون في زر «الغرفة» بالأعلى.</div></div>`;return}if(G.phase==='drawing'){const drawer=isDrawer();app.innerHTML=`<div class="canvasBox"><canvas id="canvas" class="canvas"></canvas><div class="timer" id="timer">${fmt(G.roundEndsAt-Date.now())}</div><div class="statusLine">${drawer?'🎨 أنت الرسام':'👀 خمن الكلمة'}</div>${recentGuessFlash()}${drawer?tools():''}${drawer?`<button class="floatingGuess" onclick="toggleGuess()" title="التخمينات">💬</button>`:''}${!drawer?`<div class="spectatorGuess"><input id="guessInput" maxlength="60" placeholder="اكتب تخمينك…" onkeydown="if(event.key==='Enter')submitGuess()"><button onclick="submitGuess()">إرسال</button></div>`:''}</div>${guessChat()}${drawer?`<div class="secretBar"><small>الكلمة السرية</small><span class="secretWord">${esc(G.word||'—')}</span></div>`:''}`;setupCanvas();tick();setTimeout(()=>{if(G?.phase==='drawing')render()},350);return}if(G.phase==='roundResult'){const rows=G.roundResult?.winners||[];app.innerHTML=`<div class="result"><div style="font-size:48px">🎉</div><h2>انتهت الجولة</h2><div class="resultAnswer">الإجابة: ${esc(G.roundResult?.answer||'')}</div>${rows.length?rows.map(r=>`<div class="scoreRow"><span>${r.place}. ${esc(r.name)}</span><b>+${r.points}</b></div>`).join(''):'<p class="muted">⏰ لم يعرفها أحد قبل انتهاء الوقت.</p>'}<p class="muted">الجولة التالية تبدأ تلقائيًا.</p></div>`;return}if(G.phase==='finished'){const rows=[...(G.players||[])].sort((a,b)=>(G.scores?.[b.id]||0)-(G.scores?.[a.id]||0));app.innerHTML=`<div class="result"><div style="font-size:58px">🏆</div><h1>نهاية ارسمها</h1>${rows.map((p,i)=>`<div class="scoreRow"><span>${i+1}. ${esc(p.name)}</span><b>${G.scores?.[p.id]||0}</b></div>`).join('')}<button class="primary" onclick="socket.emit('draw:restart')" style="margin-top:12px">🔄 لعب مرة أخرى</button></div>`}}
function tick(){const e=document.getElementById('timer');if(!e)return;e.textContent=fmt((G?.roundEndsAt||0)-Date.now());e.classList.toggle('urgent',fmt((G?.roundEndsAt||0)-Date.now())<=5);if(G?.phase==='drawing')setTimeout(tick,300)}
socket.on('draw:state',s=>{G=s;render()});socket.on('draw:stroke',st=>{G=G||{};G.strokes=[...(G.strokes||[]),st];if(document.getElementById('canvas'))applyStroke(st)});socket.on('draw:fill',f=>{G=G||{};G.fills=[...(G.fills||[]),f];if(document.getElementById('canvas'))fillAt(f.x,f.y,f.color)});socket.on('draw:sync',x=>{if(G){G.strokes=x.strokes||[];G.fills=x.fills||[];redraw()}});socket.on('draw:guessFeedback',x=>{if(x?.correct){try{new Audio('/audio/correct.wav').play().catch(()=>{})}catch(e){}}else{try{new Audio('/audio/wrong.wav').play().catch(()=>{})}catch(e){}}});socket.on('draw:correct',()=>{try{new Audio('/audio/correct.wav').play().catch(()=>{})}catch(e){}});window.addEventListener('resize',()=>{if(G?.phase==='drawing'){resizeCanvas()}});join();
</script><style>.guessFlash{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);z-index:8;padding:11px 18px;border-radius:16px;background:rgba(18,22,38,.94);border:1px solid rgba(124,92,255,.4);box-shadow:0 12px 35px rgba(0,0,0,.28);display:flex;gap:8px;align-items:center;animation:guessFlashIn .22s ease}.guessFlash span{color:#aeb5ca;font-size:12px}.guessFlash b{font-size:20px;color:#fff}.guessChat{position:fixed;right:14px;bottom:14px;width:min(310px,38vw);max-height:220px;z-index:20;border-radius:18px;background:rgba(10,14,26,.9);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(10px);overflow:hidden;box-shadow:0 18px 55px rgba(0,0,0,.35)}.guessChatHead{padding:10px 12px;font-weight:1000;border-bottom:1px solid rgba(255,255,255,.08)}.guessChatList{max-height:175px;overflow:auto}.guessChat .guessItem{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.05);font-size:12px}.guessChat .answerText{color:#fff}.guessChat .correct{color:#5fe1ad}@keyframes guessFlashIn{from{opacity:0;transform:translate(-50%,8px) scale(.96)}to{opacity:1;transform:translate(-50%,0) scale(1)}}@media(max-width:700px){.guessChat{width:calc(100vw - 28px);right:14px;bottom:8px;max-height:150px}.guessChatList{max-height:110px}.guessFlash{bottom:70px;max-width:80vw}}.canvasBox{position:relative}</style><script>socket.on('champion:return',x=>{if(x?.code)location.href='/games/champion/?code='+encodeURIComponent(x.code)+'&sessionToken='+encodeURIComponent(x.sessionToken||'')});</script></body></html>
