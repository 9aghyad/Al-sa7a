<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🎨 ارسمها</title><link rel="stylesheet" href="/shared/connection.css"><script src="/socket.io/socket.io.js"></script><script src="/shared/room-lobby.js"></script><style>
:root{--bg:#080b14;--panel:#111727;--line:#27314a;--text:#f7f8fc;--muted:#9ba7bf;--accent:#7c5cff;--ok:#2ed69a;--danger:#ff5872}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#273064 0,#080b14 48%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Tahoma,sans-serif;min-height:100vh}.wrap{width:min(1100px,100%);margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-weight:1000;font-size:22px}.pill{padding:7px 11px;border:1px solid var(--line);background:#111727;border-radius:999px;color:var(--muted);font-size:12px}.card{background:rgba(17,23,39,.92);border:1px solid var(--line);border-radius:24px;padding:18px;margin-top:14px;box-shadow:0 20px 60px #0005}.settings{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.settings label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}.btn,select,input{min-height:48px;border-radius:14px;border:1px solid var(--line);padding:10px 13px;font:inherit;background:#0d1322;color:var(--text)}button{cursor:pointer}.btn{font-weight:900}.primary{background:linear-gradient(135deg,#7c5cff,#4d7cff);border:0}.green{background:#176d52;border-color:#268f6b}.ghost{background:#151c2d}.full{width:100%}.board{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:14px}.canvasBox{position:relative;background:#f8f8f5;border-radius:22px;overflow:hidden;border:2px solid #2c3651;touch-action:none}.canvas{display:block;width:100%;aspect-ratio:16/10;touch-action:none}.timer{position:absolute;top:12px;left:12px;padding:8px 13px;background:#080b14dd;border-radius:999px;font-size:20px;font-weight:1000}.secret{background:#171e31;border:1px solid #39445f;border-radius:18px;padding:15px;text-align:center;margin-bottom:12px}.secret small{display:block;color:var(--muted);margin-bottom:5px}.secret b{font-size:26px}.tools{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.tools button{width:44px;height:44px;padding:0}.color{border-radius:50%!important;border:2px solid #fff!important}.side h3{margin:0 0 10px}.guessRow{display:flex;gap:7px}.guessRow input{flex:1}.guesses{max-height:310px;overflow:auto;margin-top:10px}.guess{padding:9px 10px;border-bottom:1px solid #202940;color:#cbd3e5}.scores{margin-top:12px}.score{display:flex;justify-content:space-between;padding:10px 12px;border:1px solid #202940;border-radius:12px;margin-top:7px}.result{text-align:center;padding:25px}.result .answer{font-size:38px;font-weight:1000;margin:10px}.notice{color:var(--muted);line-height:1.7}.hidden{display:none}.together{border-color:#8c6dff;box-shadow:0 0 0 2px #7c5cff22}.footerBtns{display:flex;gap:8px;margin-top:12px}.footerBtns>*{flex:1}.conn{margin-top:10px;padding:10px 12px;border-radius:13px;background:#171e31;border:1px solid #2a3550;color:#aab5ca;text-align:center;font-size:12px}.conn.ok{border-color:#245c4b;color:#91e7c4}.conn.bad{border-color:#653344;color:#ff9bad}.retry{display:none;margin-top:10px}.retry.show{display:block}@media(max-width:760px){.board{grid-template-columns:1fr}.settings{grid-template-columns:1fr 1fr}.side{order:2}.canvas{aspect-ratio:1/1}.top{align-items:flex-start}}
</style></head><body><main class="wrap"><div class="top"><div class="brand">🎨 ارسمها</div></div><div id="conn" class="conn">🟡 جاري الاتصال بالغرفة…</div><button id="retry" class="btn primary full retry">🔄 إعادة الدخول للغرفة</button><section id="app" class="card"><div class="notice">جاري تجهيز الغرفة…</div></section></main><script src="/shared/connection.js"></script><script>
const socket=io({reconnection:true,reconnectionAttempts:Infinity,reconnectionDelay:500,reconnectionDelayMax:3000});
const qs=new URLSearchParams(location.search),code=(qs.get('code')||'').toUpperCase();let token=qs.get('sessionToken')||'',name=qs.get('name')||'لاعب',me=null,G=null,canvas,ctx,drawing=false,last=null,color='#111827',width=5,joinAttempted=false,readyState=false,joinedOnce=false;
const SESSION_KEY='saha.draw.sessions';
try{if(!token){const saved=JSON.parse(localStorage.getItem(SESSION_KEY)||'[]').find(x=>x.code===code);if(saved?.token){token=saved.token;if(!name||name==='لاعب')name=saved.name||name}}}catch(e){}
if(!code){location.href='/';}
function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmt(ms){return Math.max(0,Math.ceil(ms/1000))}
function setConn(ok,msg){const el=document.getElementById('conn');el.className='conn '+(ok?'ok':'bad');el.textContent=msg;document.getElementById('retry').classList.toggle('show',!ok)}
function saveSession(){try{const all=JSON.parse(localStorage.getItem(SESSION_KEY)||'[]').filter(x=>x.code!==code);if(token)all.unshift({code,name,token,updatedAt:Date.now()});localStorage.setItem(SESSION_KEY,JSON.stringify(all.slice(0,8)))}catch(e){}}
function joinOrResume(){if(!code||!socket.connected)return;joinAttempted=true;setConn(true,token?'🟢 متصل — استعادة جلستك…':'🟢 متصل — دخول الغرفة…');if(token)socket.emit('room:resume',{code,sessionToken:token,name});else socket.emit('room:join',{code,name})}
function render(){if(!G)return;const host=G.hostId===me,drawer=(G.drawerIds||[]).includes(me);if(G.phase==='lobby'){document.getElementById('app').innerHTML=`<div class="result"><div style="font-size:56px">🎨</div><h2>غرفة ارسمها جاهزة</h2><p class="notice">افتح زر <b>الغرفة</b> في الأعلى لمشاهدة اللاعبين والإعدادات. عندما يصبح هناك لاعبان متصلان، يبدأ المضيف اللعبة من هناك.</p><div class="scores">${G.players.map(p=>`<div class="score"><span>${esc(p.name)}</span><b>${p.online===false?'غير متصل':'متصل ✓'}</b></div>`).join('')}</div></div>`;return}
if(G.phase==='drawing'){document.getElementById('app').innerHTML=`<div class="board"><div><div class="canvasBox ${G.style==='together'?'together':''}"><canvas id="canvas" class="canvas"></canvas><div class="timer" id="timer">${fmt(G.roundEndsAt-Date.now())}</div></div>${drawer?`<div class="secret"><small>الكلمة السرية ${G.style==='together'?'لكم أنتم الاثنين':''}</small><b>${esc(G.word)}</b><div class="tools"><button class="color" style="background:#111827" onclick="setColor('#111827')"></button><button class="color" style="background:#e53935" onclick="setColor('#e53935')"></button><button class="color" style="background:#1e88e5" onclick="setColor('#1e88e5')"></button><button class="color" style="background:#43a047" onclick="setColor('#43a047')"></button><button class="color" style="background:#f6c945" onclick="setColor('#f6c945')"></button><button class="ghost" onclick="undo()">↩️</button><button class="ghost" onclick="clearCanvas()">🗑️</button></div></div>`:'<div class="notice">🎯 ركّز على الرسم! الرسم يظهر عندك مباشرة، واكتب تخمينك من الأسفل.</div>'}</div><aside class="side"><h3>الجولة ${G.round}/${G.maxRounds}</h3><div class="notice">${G.style==='together'?'👥 رسامان يرسمان معًا':'🎨 رسام واحد'} • ${drawer?'أنت ترسم':'أنت تخمّن'}</div>${!drawer?`<div class="guessRow" style="margin-top:12px"><input id="guess" maxlength="60" placeholder="ما الكلمة؟"><button class="btn primary" onclick="guess()">إرسال</button></div>`:''}<div class="guesses">${(G.guesses||[]).slice().reverse().map(x=>`<div class="guess">${esc(x.player)} ${x.correct?'🎉 عرفها!':'أرسل تخمينًا'}</div>`).join('')}</div><div class="scores">${G.players.map(p=>`<div class="score"><span>${esc(p.name)}</span><b>${G.scores?.[p.id]||0}</b></div>`).join('')}</div></aside></div>`;setupCanvas();tick();return}
if(G.phase==='roundResult'){document.getElementById('app').innerHTML=`<div class="result"><div>🎨 انتهت الجولة</div><div class="canvasBox" style="margin:14px auto;max-width:900px"><canvas id="canvas" class="canvas"></canvas></div><div class="answer">${esc(G.roundResult?.answer||'')}</div><p>${G.roundResult?.winner?`🏆 ${esc(G.roundResult.winner.name)} خمّنها وحصل على ${G.roundResult.winner.points} نقطة`:'⏰ انتهى الوقت — لا إجابة صحيحة'}</p>${G.hostId===me?`<button class="btn primary" onclick="socket.emit('draw:next')">${G.round>=G.maxRounds?'🏆 النتائج النهائية':'▶ الجولة التالية'}</button>`:'<p class="notice">بانتظار صاحب الغرفة…</p>'}</div>`;setupCanvas();return}
if(G.phase==='finished'){const rows=[...G.players].sort((a,b)=>(G.scores[b.id]||0)-(G.scores[a.id]||0));document.getElementById('app').innerHTML=`<div class="result"><div style="font-size:64px">🏆</div><h1>نهاية اللعبة</h1>${rows.map((p,i)=>`<div class="score"><span>${i+1}. ${esc(p.name)}</span><b>${G.scores?.[p.id]||0}</b></div>`).join('')}<div class="footerBtns">${G.hostId===me?`<button class="btn primary" onclick="socket.emit('draw:restart')">🔄 لعب مرة أخرى</button>`:''}<button class="btn ghost" onclick="location.href='/'">🏠 الرئيسية</button></div></div>`}}
function setupCanvas(){canvas=document.getElementById('canvas');if(!canvas)return;const r=canvas.getBoundingClientRect(),d=devicePixelRatio||1;canvas.width=Math.max(1,r.width*d);canvas.height=Math.max(1,r.height*d);ctx=canvas.getContext('2d');ctx.setTransform(d,0,0,d,0,0);ctx.lineCap='round';ctx.lineJoin='round';ctx.fillStyle='#f8f8f5';ctx.fillRect(0,0,r.width,r.height);(G.strokes||[]).forEach(drawStroke);canvas.onpointerdown=e=>{if(!(G.drawerIds||[]).includes(me)||!socket.connected)return;drawing=true;last=pos(e);canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drawing)return;const p=pos(e);const pts=[last,p];last=p;drawLocal(pts);socket.emit('draw:stroke',{points:pts,color,width})};canvas.onpointerup=()=>{drawing=false;last=null};canvas.onpointercancel=()=>{drawing=false;last=null}}
function pos(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height}}
function drawLocal(pts){if(!ctx||pts.length<2)return;const r=canvas.getBoundingClientRect();ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(pts[0].x*r.width,pts[0].y*r.height);for(const p of pts.slice(1))ctx.lineTo(p.x*r.width,p.y*r.height);ctx.stroke()}
function drawStroke(s){const r=canvas.getBoundingClientRect();if(!s.points?.length)return;ctx.strokeStyle=s.color||'#111827';ctx.lineWidth=s.width||5;ctx.beginPath();ctx.moveTo(s.points[0].x*r.width,s.points[0].y*r.height);for(const p of s.points.slice(1))ctx.lineTo(p.x*r.width,p.y*r.height);ctx.stroke()}
function setColor(c){color=c}function undo(){socket.emit('draw:undo')}function clearCanvas(){socket.emit('draw:clear')}function guess(){const v=document.getElementById('guess')?.value?.trim();if(v)socket.emit('draw:guess',{answer:v})}function saveSettings(){socket.emit('draw:setSettings',{style:document.getElementById('style').value,difficulty:'mixed',rounds:+document.getElementById('rounds').value,turnSec:+document.getElementById('time').value})}function tick(){if(G?.phase!=='drawing')return;const el=document.getElementById('timer');if(el){el.textContent=fmt(G.roundEndsAt-Date.now());if(G.roundEndsAt>Date.now())setTimeout(tick,250)}}
socket.on('connect',()=>{setConn(true,'🟢 متصل بالسيرفر');joinOrResume()});socket.on('disconnect',()=>{setConn(false,'🔴 فقدنا الاتصال مؤقتًا — نحاول إعادة الاتصال تلقائيًا…')});socket.on('connect_error',()=>setConn(false,'🟠 تعذر الاتصال بالسيرفر — جاري إعادة المحاولة…'));socket.on('joined',x=>{me=x.playerId;token=x.sessionToken||token;joinedOnce=true;joinAttempted=true;saveSession();setConn(true,'🟢 دخلت الغرفة بنجاح');render()});socket.on('draw:state',s=>{G=s;if(s?.myPlayerId)me=s.myPlayerId;if(s?.isHost&&me)joinedOnce=true;render()});socket.on('draw:stroke',s=>{if(!canvas)return;drawStroke(s)});socket.on('draw:sync',x=>{if(!canvas)return;G.strokes=x.strokes||[];setupCanvas()});socket.on('draw:correct',x=>{setConn(true,`🎉 ${x.player} عرفها! +${x.points}`)});socket.on('draw:guessResult',x=>{});socket.on('resumeFailed',x=>{joinedOnce=false;if(x?.finished||x?.expired){setConn(false,'⚪ انتهت الغرفة');document.getElementById('retry').classList.remove('show');document.getElementById('app').innerHTML='<div class="notice">انتهت هذه اللعبة. يمكنك العودة للرئيسية.</div>';return}token='';setConn(false,'🟠 لم نتمكن من استعادة الجلسة. اضغط إعادة الدخول.');});socket.on('errorMsg',m=>{setConn(false,'🟠 '+m)});document.getElementById('retry').onclick=()=>{joinAttempted=false;joinedOnce=false;if(!token){try{const saved=JSON.parse(localStorage.getItem(SESSION_KEY)||'[]').find(x=>x.code===code);if(saved?.token)token=saved.token}catch(e){}}joinOrResume()};
</script></body></html>
