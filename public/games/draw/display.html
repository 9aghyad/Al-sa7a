<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🎨 ارسمها — الشاشة</title><style>body{margin:0;background:#080b14;color:#fff;font-family:system-ui,Tahoma,sans-serif}.wrap{min-height:100vh;padding:18px;box-sizing:border-box}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:26px;font-weight:1000}.pill{background:#151c2d;border:1px solid #303b57;padding:8px 14px;border-radius:999px}.stage{max-width:1300px;margin:18px auto}.head{text-align:center}.head h1{font-size:clamp(36px,5vw,70px);margin:10px}.muted{color:#9ba7bf}.canvasBox{position:relative;background:#f8f8f5;border-radius:28px;overflow:hidden;border:3px solid #303b57;box-shadow:0 25px 100px #0008}.canvas{width:100%;display:block;aspect-ratio:16/9}.timer{position:absolute;top:18px;left:18px;background:#080b14e8;padding:12px 20px;border-radius:999px;font-size:32px;font-weight:1000}.status{text-align:center;margin:14px;font-size:22px;font-weight:900}.answer{font-size:clamp(38px,6vw,82px);font-weight:1000;text-align:center;margin:10px}.scores{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.score{padding:12px 18px;border-radius:16px;background:#111727;border:1px solid #29334d}.hidden{display:none}</style></head><body><main class="wrap"><div class="top"><div class="brand">🎨 ارسمها • شاشة العرض</div><div id="code" class="pill"></div></div><section class="stage"><div class="head"><div id="round" class="muted"></div><h1 id="title">جاهزين؟</h1></div><div id="board" class="canvasBox"><canvas id="canvas" class="canvas"></canvas><div id="timer" class="timer"></div></div><div id="status" class="status muted">بانتظار بداية اللعبة…</div><div id="answer" class="answer"></div><div id="scores" class="scores"></div></section></main><script src="/socket.io/socket.io.js"></script><script>
const socket=io(),qs=new URLSearchParams(location.search),code=(qs.get('code')||'').toUpperCase();let G=null,canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');if(!code)location.href='/';else socket.emit('room:display',{code});
function fit(){const r=canvas.getBoundingClientRect(),d=devicePixelRatio||1;canvas.width=r.width*d;canvas.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);ctx.fillStyle='#f8f8f5';ctx.fillRect(0,0,r.width,r.height);(G?.strokes||[]).forEach(draw)}
function draw(s){const r=canvas.getBoundingClientRect();if(!s.points?.length)return;ctx.strokeStyle=s.color||'#111827';ctx.lineWidth=s.width||5;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(s.points[0].x*r.width,s.points[0].y*r.height);for(const p of s.points.slice(1))ctx.lineTo(p.x*r.width,p.y*r.height);ctx.stroke()}
function fmt(ms){return Math.max(0,Math.ceil(ms/1000))}function render(){if(!G)return;document.getElementById('code').textContent=G.code;document.getElementById('round').textContent=G.phase==='lobby'?'استعدوا':`الجولة ${G.round} / ${G.maxRounds}`;document.getElementById('title').textContent=G.phase==='drawing'?(G.style==='together'?'👥 ارسموا سوا':'🎨 ارسمها'):G.phase==='roundResult'?'✨ انتهت الجولة':G.phase==='finished'?'🏆 انتهت اللعبة':'🎨 ارسمها';document.getElementById('status').textContent=G.phase==='drawing'?'أرسلوا تخميناتكم من الجوالات!':G.phase==='roundResult'?(G.roundResult?.winner?`🏆 ${G.roundResult.winner.name} عرفها!`:'⏰ انتهى الوقت'):'بانتظار اللاعبين…';document.getElementById('answer').textContent=G.phase==='roundResult'||G.phase==='finished'?`الإجابة: ${G.roundResult?.answer||''}`:'';document.getElementById('scores').innerHTML=(G.players||[]).sort((a,b)=>(G.scores[b.id]||0)-(G.scores[a.id]||0)).map(p=>`<div class="score">${p.name} • <b>${G.scores?.[p.id]||0}</b></div>`).join('');fit()}
socket.on('draw:state',s=>{G=s;render()});socket.on('draw:stroke',s=>draw(s));socket.on('draw:sync',x=>{if(G){G.strokes=x.strokes||[];fit()}});window.addEventListener('resize',fit);setInterval(()=>{if(G?.phase==='drawing')document.getElementById('timer').textContent=fmt(G.roundEndsAt-Date.now());else document.getElementById('timer').textContent=''},250);
</script></body></html>
