<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المفخخة • دخول</title><link rel="stylesheet" href="/games/family-feud/family-feud.css"><link rel="stylesheet" href="/games/bomb/bomb.css"></head><body><main class="wrap"><div id="roles" class="card"></div></main><script>const q=new URLSearchParams(location.search),code=(q.get('code')||'').toUpperCase(),mode=q.get('mode')||'1';const el=document.getElementById('roles');const player=`<div class="roleBox"><h2>👥 دخول المتسابقين</h2><input id="name" class="input" placeholder="اسم المتسابق"><select id="team" class="input"><option value="A">🔴 الفريق الأحمر</option><option value="B">🔵 الفريق الأزرق</option></select><button class="btn primary bigGameAction" onclick="player()">دخول المتسابقين</button></div>`;el.innerHTML=`<div class="top"><div><div class="small">💣 المفخخة</div><h1>اختيار طريقة الدخول</h1><div class="code">${code}</div></div></div><p class="muted">اختر الشاشة أو دورك. نفس الغرفة تستخدمها كل الأجهزة.</p><div class="roleGrid">${mode==='1'?`<button class="roleCard" onclick="go('presenter')"><span>🎙️</span><b>دخول المقدم</b><small>تحكم كامل وكشف الإجابات</small></button>`:''}<button class="roleCard" onclick="go('display')"><span>🖥️</span><b>دخول الشاشة</b><small>عرض السؤال والإجابات والانفجارات</small></button>${player}</div></div>`;function go(r){location.href='/games/bomb/'+r+'?code='+encodeURIComponent(code)}function player(){const n=document.getElementById('name').value.trim()||'لاعب';const t=document.getElementById('team').value;location.href='/games/bomb/players?code='+encodeURIComponent(code)+'&name='+encodeURIComponent(n)+'&team='+encodeURIComponent(t)}</script></body></html>
