<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المفخخة • اختيار الدخول</title><link rel="stylesheet" href="/games/family-feud/family-feud.css"><link rel="stylesheet" href="/games/bomb/bomb.css"></head><body class="bombEntry"><main class="wrap"><div id="roles" class="card bombEntryCard"></div></main><script>
const q=new URLSearchParams(location.search),code=(q.get('code')||'').toUpperCase(),mode=q.get('mode')||'1',creatorName=q.get('name')||'لاعب',creatorTeam=q.get('team')==='B'?'B':'A',token=q.get('sessionToken')||'';
const safe=(x)=>String(x||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const teamName=creatorTeam==='A'?'الفريق الأحمر':'الفريق الأزرق',teamEmoji=creatorTeam==='A'?'🔴':'🔵';let saved=null;try{saved=JSON.parse(localStorage.getItem('bomb.session.'+code)||'null')}catch(e){};const resume=saved&&saved.token?`<div class="resumeBombCard"><b>🟢 لديك جلسة محفوظة في هذه الغرفة</b><small>${safe(saved.name||'لاعب')} • ${saved.team==='B'?'🔵 الفريق الأزرق':'🔴 الفريق الأحمر'}</small><button class="btn primary bigGameAction" onclick="resumePlayer()">↩️ العودة للعبة بدون فقدان التقدم</button></div>`:'';
const playerCard=`<div class="creatorPlayerCard"><div class="playerIcon">${teamEmoji}</div><div><div class="small">أنت متسابق</div><h2>${safe(creatorName)}</h2><p>أنت مسجل مسبقًا في <b>${teamName}</b>. لا تحتاج إنشاء لاعب جديد.</p></div><button class="btn primary bigGameAction" onclick="enterPlayer()">👤 دخول كلاعب — ${teamName}</button></div>`;
let roles='';
if(mode==='1')roles+=`<button class="roleCard bombRolePresenter" onclick="go('presenter')"><span>🎙️</span><b>دخول المقدم</b><small>الإجابات كاملة أمامك والتحكم بالكشف والحكم</small></button>`;
if(mode!=='3')roles+=`<button class="roleCard bombRoleDisplay" onclick="go('display')"><span>🖥️</span><b>دخول الشاشة</b><small>لوحة كبيرة للسؤال والمربعات والمؤثرات</small></button>`;
roles+=playerCard;
document.getElementById('roles').innerHTML=`<div class="bombEntryHead"><div class="bombBadge">💣 المفخخة</div><div class="code bigCode">${safe(code)}</div><h1>اختر شاشة الدخول</h1><p>الغرفة جاهزة. اختر الجهاز الذي ستستخدمه — حسابك كلاعب محفوظ.</p>${resume}</div><div class="entryRoles">${roles}</div>`;
function go(r){location.href='/games/bomb/'+r+'?code='+encodeURIComponent(code)}
function enterPlayer(){location.href='/games/bomb/players?code='+encodeURIComponent(code)+'&name='+encodeURIComponent(creatorName)+'&team='+encodeURIComponent(creatorTeam)+'&sessionToken='+encodeURIComponent(token)}
function resumePlayer(){if(!saved?.token)return;location.href='/games/bomb/players?code='+encodeURIComponent(code)+'&name='+encodeURIComponent(saved.name||'لاعب')+'&team='+encodeURIComponent(saved.team||'A')+'&sessionToken='+encodeURIComponent(saved.token)+'&mode='+encodeURIComponent(mode)}
</script></body></html>
