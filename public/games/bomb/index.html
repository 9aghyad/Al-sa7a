<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المفخخة • الساحة</title><link rel="stylesheet" href="/games/bomb/bomb.css"><script src="/socket.io/socket.io.js"></script></head><body><main class="bombApp"><div id="app"></div></main><script>
const socket=io();let mode='1';
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){document.getElementById('app').innerHTML=`<section class="lobby createLobby"><div class="lobbyBomb">💣</div><span class="eyebrow">الساحة • لعبة جديدة</span><h1>المفخخة</h1><p>لعبة تيمات بإجابات مخفية ومفخخات. اختر طريقة اللعب ثم أنشئ الغرفة.</p><div class="modePicker"><button class="modeCard ${mode==='1'?'selected':''}" onclick="setMode('1')"><b>🎙️ مقدم + شاشة + لاعبين</b><small>الإجابة شفهية • المقدم يحكم</small></button><button class="modeCard ${mode==='2'?'selected':''}" onclick="setMode('2')"><b>🖥️ شاشة + لاعبين</b><small>الإجابة كتابية • تصحيح تلقائي</small></button><button class="modeCard ${mode==='3'?'selected':''}" onclick="setMode('3')"><b>🎮 لاعبين فقط</b><small>الإجابة كتابية • تصحيح تلقائي</small></button></div><div class="createFields">${mode!=='1'?`<input id="name" placeholder="اسمك" maxlength="24"><div class="teamPick"><button class="teamChoice redChoice" onclick="team='A';this.parentNode.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));this.classList.add('selected')">🔴 الأحمر</button><button class="teamChoice blueChoice" onclick="team='B';this.parentNode.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));this.classList.add('selected')">🔵 الأزرق</button></div>`:''}<select id="rounds"><option value="5">5 جولات</option><option value="10" selected>10 جولات</option><option value="15">15 جولة</option><option value="20">20 جولة</option></select></div><button class="startGame" onclick="createRoom()">🚀 إنشاء غرفة المفخخة</button><div class="joinBox"><input id="joinCode" placeholder="لديك كود؟ أدخله هنا" maxlength="4"><button onclick="joinRoom()">دخول</button></div><div id="msg"></div></section>`}
let team='A';function setMode(m){mode=m;render()}
function msg(x){document.getElementById('msg').textContent=x}
function createRoom(){const name=document.getElementById('name')?.value.trim()||'لاعب';if(mode!=='1'&&!name)return msg('اكتب اسمك أولًا');socket.emit('room:create',{game:'bomb',mode,name,team,rounds:Number(document.getElementById('rounds').value||10)},x=>{});}
function joinRoom(){const c=document.getElementById('joinCode').value.trim().toUpperCase();if(!c)return msg('أدخل الكود');const name=prompt('اكتب اسمك:','لاعب')||'لاعب';const t=prompt('الفريق؟ اكتب A للأحمر أو B للأزرق:','A')?.toUpperCase()==='B'?'B':'A';location.href='/games/bomb/players?code='+encodeURIComponent(c)+'&name='+encodeURIComponent(name)+'&team='+t}
socket.on('room:created',x=>{if(x.role==='presenter')location.href='/games/bomb/presenter?code='+encodeURIComponent(x.code);else location.href='/games/bomb/players?code='+encodeURIComponent(x.code)+'&name='+encodeURIComponent(document.getElementById('name')?.value||'لاعب')+'&team='+team+'&sessionToken='+encodeURIComponent(x.sessionToken||'')});
socket.on('errorMsg',msg);render();
</script></body></html>
