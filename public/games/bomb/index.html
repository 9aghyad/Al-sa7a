<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المفخخة • الساحة</title><link rel="stylesheet" href="/games/bomb/bomb.css"><script src="/socket.io/socket.io.js"></script><link rel="stylesheet" href="/shared/connection.css"><link rel="stylesheet" href="/shared/arena-ui.css"></head><body><main class="bombApp"><div id="app"></div></main><script>
const socket=io();
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){document.getElementById('app').innerHTML=`<section class="lobby createLobby player"><div class="lobbyBomb">💣</div><span class="eyebrow">الساحة • المفخخة</span><h1>جاهز للتحدي؟</h1><p>اكتب اسمك أولًا. إعدادات الفريق والجولات ستظهر داخل الغرفة.</p><div class="createFields"><input id="name" placeholder="اسمك" maxlength="24"></div><button class="startGame" onclick="createRoom()">🚀 إنشاء غرفة المفخخة</button><div class="joinBox"><input id="joinCode" placeholder="أدخل كود الغرفة" maxlength="4"><button onclick="joinRoom()">دخول</button></div><div id="msg"></div></section>`}
function msg(x){const e=document.getElementById('msg');if(e)e.textContent=x}
function createRoom(){const name=document.getElementById('name').value.trim();if(!name)return msg('اكتب اسمك أولًا');socket.emit('room:create',{game:'bomb',mode:'3',name,maxRounds:10})}
function joinRoom(){const c=document.getElementById('joinCode').value.trim().toUpperCase(),name=document.getElementById('name').value.trim()||prompt('اكتب اسمك:','لاعب')||'لاعب';if(!c)return msg('أدخل كود الغرفة');location.href='/games/bomb/players?code='+encodeURIComponent(c)+'&name='+encodeURIComponent(name)}
socket.on('room:created',x=>{location.href='/games/bomb/players?code='+encodeURIComponent(x.code)+'&name='+encodeURIComponent(document.getElementById('name').value.trim())+'&sessionToken='+encodeURIComponent(x.sessionToken||'')});socket.on('errorMsg',msg);render();
</script><script src="/shared/connection.js"></script></body></html>
