<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المفخخة • الساحة</title><link rel="stylesheet" href="/games/bomb/bomb.css"><script src="/socket.io/socket.io.js"></script></head><body><main class="bombApp"><div id="app"></div></main><script>
const socket=io();let team='A';
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){document.getElementById('app').innerHTML=`<section class="lobby createLobby player"><div class="playerIdentity"><span>💣 المفخخة</span><b>لعبة تيم ضد تيم</b></div><div class="lobbyBomb">💣</div><span class="eyebrow">الساحة • المفخخة</span><h1>جاهز للتحدي؟</h1><p>ادخل أو أنشئ غرفة، اختر فريقك، ثم ابدأ المواجهة. الإجابات مخفية والمفخخات تنتظر.</p><div class="createFields"><input id="name" placeholder="اسمك" maxlength="24"><div class="teamPick"><button class="teamChoice redChoice ${team==='A'?'selected':''}" onclick="setTeam('A')">🔴 الأحمر</button><button class="teamChoice blueChoice ${team==='B'?'selected':''}" onclick="setTeam('B')">🔵 الأزرق</button></div><select id="rounds"><option value="5">5 جولات</option><option value="10" selected>10 جولات</option><option value="15">15 جولة</option><option value="20">20 جولة</option></select></div><button class="startGame" onclick="createRoom()">🚀 إنشاء غرفة المفخخة</button><div class="joinBox"><input id="joinCode" placeholder="أدخل كود الغرفة" maxlength="4"><button onclick="joinRoom()">دخول</button></div><div id="msg"></div></section>`}
function setTeam(t){team=t;render()}
function msg(x){const e=document.getElementById('msg');if(e)e.textContent=x}
function createRoom(){const name=document.getElementById('name').value.trim();if(!name)return msg('اكتب اسمك أولًا');socket.emit('room:create',{game:'bomb',mode:'3',name,team,rounds:Number(document.getElementById('rounds').value||10)});}
function joinRoom(){const c=document.getElementById('joinCode').value.trim().toUpperCase();const name=document.getElementById('name').value.trim()||prompt('اكتب اسمك:','لاعب')||'لاعب';if(!c)return msg('أدخل كود الغرفة');location.href='/games/bomb/players?code='+encodeURIComponent(c)+'&name='+encodeURIComponent(name)+'&team='+team}
socket.on('room:created',x=>{location.href='/games/bomb/players?code='+encodeURIComponent(x.code)+'&name='+encodeURIComponent(document.getElementById('name').value.trim())+'&team='+team+'&sessionToken='+encodeURIComponent(x.sessionToken||'')});socket.on('errorMsg',msg);render();
</script></body></html>
