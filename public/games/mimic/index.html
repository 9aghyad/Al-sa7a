<style>

#app{height:100dvh;display:flex;flex-direction:column;padding:clamp(10px,2vw,22px);gap:12px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:42px}.brand{display:flex;align-items:center;gap:10px;font-weight:1000;font-size:clamp(17px,2vw,24px)}.brandmark{width:40px;height:40px;border-radius:14px;background:linear-gradient(135deg,#b38aff,#5f38b5);display:grid;place-items:center;font-size:22px;box-shadow:0 0 28px #9464ff55}.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pill{border:1px solid var(--line);background:#ffffff09;padding:7px 12px;border-radius:999px;color:#ded2f1;font-size:12px}.content{flex:1;min-height:0;display:flex;align-items:stretch;justify-content:center}.panel{width:100%;max-width:1050px;margin:auto;background:linear-gradient(145deg,#241a3bdf,#130f22f5);border:1px solid #6047847d;border-radius:26px;padding:clamp(15px,2.5vw,30px);box-shadow:0 25px 70px #0004;min-height:0;max-height:100%;overflow:auto}.center{text-align:center}.muted{color:var(--muted)}.title{font-size:clamp(25px,4vw,46px);font-weight:1000;line-height:1.12;margin:0 0 9px}.subtitle{color:#c9bddb;margin:0 auto 20px;max-width:650px;line-height:1.8}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}.formgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;text-align:right;margin:18px auto;max-width:720px}.field label{display:block;color:#d7c9eb;font-size:13px;margin:0 0 7px}.roster{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0}.player{min-width:105px;max-width:145px;background:#ffffff08;border:1px solid #4b396b;border-radius:17px;padding:12px 10px;text-align:center;position:relative;overflow:hidden}.avatar{width:48px;height:48px;border-radius:50%;margin:0 auto 8px;background:linear-gradient(135deg,#543c7b,#2c2345);display:grid;place-items:center;font-size:24px;border:2px solid #a47aff}.player .name{font-size:13px;font-weight:850;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.player small{display:block;font-size:10px;color:var(--muted);margin-top:4px}.readyDot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#ffbb55;margin-left:5px}.readyDot.yes{background:#4ee5ac}.gamepanel{display:flex;flex-direction:column;gap:12px;height:100%;max-width:1200px}.stage{position:relative;flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:14px}.mainstage{background:radial-gradient(ellipse at 50% 25%,#3a245b,#1a122a 68%);border:1px solid #4d376d;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px;position:relative;overflow:hidden}.side{background:#ffffff06;border:1px solid #44315e;border-radius:22px;padding:13px;overflow:auto}.side h3{margin:0 0 12px;font-size:14px}.sidePlayer{display:flex;align-items:center;gap:9px;padding:9px 7px;border-bottom:1px solid #ffffff0b}.miniAvatar{width:34px;height:34px;border-radius:50%;background:#3c2a5b;display:grid;place-items:center;font-size:18px;flex:none}.sidePlayer .info{flex:1;min-width:0}.sidePlayer b{font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sidePlayer small{font-size:10px;color:var(--muted)}.sideScore{font-weight:1000;color:var(--gold);font-size:14px}.soundchip{display:inline-flex;gap:8px;align-items:center;background:#ffffff0c;border:1px solid #634a84;border-radius:999px;padding:9px 14px;color:#eadfff;font-size:13px;margin-bottom:12px}.soundicon{width:35px;height:35px;border-radius:12px;background:#9b6bff26;display:grid;place-items:center;font-size:19px}.bigAvatar{width:clamp(90px,14vh,155px);height:clamp(90px,14vh,155px);border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 25%,#a78bfa,#4b277c 70%);border:4px solid #d1b8ff;box-shadow:0 0 0 12px #a678ff17,0 0 70px #8e56ff66;font-size:clamp(44px,8vh,76px);margin:5px auto 13px;transition:transform .5s}.zoom .bigAvatar{transform:scale(1.12);animation:spotlight 1.2s ease-in-out infinite alternate}@keyframes spotlight{from{box-shadow:0 0 0 12px #a678ff17,0 0 40px #8e56ff44}to{box-shadow:0 0 0 24px #a678ff0c,0 0 95px #8e56ff99}}.stageName{font-size:clamp(19px,3vw,31px);font-weight:1000;margin-bottom:5px}.statusline{font-size:13px;color:#d2c4e4;text-align:center;line-height:1.6}.count{font-size:clamp(60px,13vh,115px);font-weight:1000;line-height:1;color:#fff;text-shadow:0 0 40px #9b6bff;animation:countpop .7s ease both}@keyframes countpop{0%{transform:scale(1.6);opacity:.2}100%{transform:scale(1);opacity:1}}.wavebox{width:min(620px,94%);margin:13px auto 0;background:#100b1d;border:1px solid #624986;border-radius:16px;padding:10px 12px}.wavebox canvas{display:block;width:100%;height:50px}.waveLabel{display:flex;justify-content:space-between;font-size:11px;color:#c7b7dc;margin-top:3px}.score{font-size:clamp(52px,10vh,85px);font-weight:1000;line-height:1;color:var(--gold);text-shadow:0 0 35px #ffb93833}.score small{font-size:18px;color:#ddd}.progress{height:8px;border-radius:99px;background:#ffffff13;overflow:hidden;width:min(360px,85%);margin:12px auto}.progress span{height:100%;display:block;background:linear-gradient(90deg,#5be7eb,#a278ff);border-radius:99px;transition:width .8s}.rankrow{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:11px 8px;border-bottom:1px solid #ffffff0c;text-align:right}.ranknum{font-weight:1000;color:var(--gold);font-size:18px}.landscapeHint{display:none;position:fixed;inset:0;background:#100c20;z-index:99;align-items:center;justify-content:center;text-align:center;padding:30px}.landscapeHint .rotate{font-size:60px;margin-bottom:20px;animation:turn 2s ease-in-out infinite}@keyframes turn{50%{transform:rotate(90deg)}}.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#2b2140;border:1px solid #72549a;border-radius:14px;padding:12px 18px;z-index:200;box-shadow:0 10px 35px #0008;max-width:90vw;text-align:center}

/* 3D Party Arena redesign */
:root{--bg:#201014;--panel:#351e22;--panel2:#47282a;--line:#80504a;--violet:#ff6c76;--cyan:#63e5c4;--gold:#ffd45c;--muted:#d5b9b1;--text:#fff8ed}
html,body{background:#2b1718;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
body{background:radial-gradient(ellipse at 50% 5%,#6e3933 0,#3b2020 46%,#211315 100%);position:relative}
body:before{content:"";position:fixed;inset:0 0 29%;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 84px,#ffffff05 85px 87px),linear-gradient(180deg,#0000,#12090b66);border-bottom:8px solid #211416;box-shadow:0 12px 0 #7a4b2a;z-index:0}
body:after{content:"";position:fixed;left:-5vw;right:-5vw;bottom:-10vh;height:42vh;pointer-events:none;background:repeating-linear-gradient(90deg,#b96f2c00 0 95px,#5b321b55 96px 99px),repeating-linear-gradient(0deg,#eaa04b00 0 65px,#60351855 66px 69px),linear-gradient(180deg,#b86a2b,#7e421e);transform:perspective(500px) rotateX(8deg);transform-origin:bottom;box-shadow:0 -12px 30px #12090b88;z-index:0}
#app{position:relative;z-index:1;gap:clamp(8px,1.5vh,16px)}
.top{padding:5px 8px}.brandmark{border-radius:13px;background:linear-gradient(145deg,#ffb75e,#b84d36);border:2px solid #ffdba0;box-shadow:0 5px 0 #783126,0 10px 22px #10070877}
.panel{background:linear-gradient(160deg,#5b3432f2,#321d22f5 72%);border:2px solid #956052;border-radius:24px;box-shadow:0 14px 0 #241315,0 24px 55px #10080988,inset 0 2px 0 #ffffff17}
button{border-radius:13px;background:linear-gradient(180deg,#ff9d79,#d94d52);box-shadow:0 5px 0 #7e2d35,0 10px 18px #16090a55;transition:transform .15s,filter .15s}
button:hover{filter:brightness(1.09);transform:translateY(-2px)}button:active{transform:translateY(3px);box-shadow:0 2px 0 #7e2d35}
button.ghost{background:linear-gradient(180deg,#63403d,#43282b);border:1px solid #a06c5d;box-shadow:0 4px 0 #281719}
button.gold{background:linear-gradient(180deg,#ffe38a,#d99a24);box-shadow:0 5px 0 #84501b;color:#3b2110}
input,select{background:#28171b;border:2px solid #79504a;border-radius:12px;color:#fff8ed}
.pill{background:#2b191d;border-color:#80534a;color:#ffe1cf}
.player{background:linear-gradient(180deg,#75423e,#442629);border:2px solid #a86e5d;border-radius:18px;box-shadow:0 5px 0 #291719,0 12px 20px #170b0b55;transform:translateY(0);transition:transform .2s}
.player:hover{transform:translateY(-5px) rotate(-1deg)}
.avatar,.miniAvatar{background:linear-gradient(145deg,#ffbd71,#e46a57);border:3px solid #ffe2a4;box-shadow:0 4px 0 #783c36,0 0 0 3px #ffffff10}
.avatar{width:58px;height:58px;font-size:29px}
.player .name{color:#fff6e9}
.gamepanel{background:transparent}
.mainstage{background:radial-gradient(ellipse at 50% 20%,#70413a,#44272b 70%);border:2px solid #956052;border-radius:25px;box-shadow:inset 0 0 50px #170b0b66,0 8px 0 #251416}
.side{background:linear-gradient(180deg,#4b2b2d,#2f1c21);border:2px solid #80534a;border-radius:22px;box-shadow:0 7px 0 #251416}
.sidePlayer{border-bottom-color:#ffffff13}
.bigAvatar{background:radial-gradient(circle at 35% 18%,#ffd9a0,#ff9a61 45%,#bd4b53 100%);border:5px solid #ffe1a0;box-shadow:0 10px 0 #7b3938,0 18px 35px #16090a88}
.soundchip{background:#2c191d;border-color:#a16a59}
.soundicon{background:#e65e672b}
.readyDot.yes{background:#63e5a7;box-shadow:0 0 10px #63e5a7}
@media(max-width:760px){body:before{inset:0 0 25%}body:after{height:35vh}.panel{border-radius:20px}.avatar{width:50px;height:50px}}


/* Toy-avatar depth and stage dressing */
.player{min-width:112px;padding:14px 12px 12px;overflow:visible}
.avatar{position:relative;isolation:isolate;overflow:visible!important;border-radius:38% 38% 45% 45%;background:linear-gradient(145deg,#ffdca1 0 34%,#f2a06c 35% 70%,#c85b55 71%);color:#402324}
.avatar:before{content:"";position:absolute;z-index:-1;width:72%;height:68%;left:14%;top:-16%;border-radius:46% 46% 30% 30%;background:linear-gradient(135deg,#ffe4ae,#df8a65);box-shadow:inset -5px -4px 0 #9e4c4544,0 4px 0 #783b36}
.avatar:after{content:"•  •";position:absolute;top:23%;left:0;right:0;color:#512b2a;font-size:16px;font-weight:1000;letter-spacing:5px;text-align:center;text-shadow:0 1px #fff5}
.player:nth-child(3n+1) .avatar:before{background:linear-gradient(135deg,#f4c6ff,#bd79b5);box-shadow:inset -5px -4px 0 #783a6a44,0 4px 0 #6c315b}
.player:nth-child(3n+2) .avatar:before{background:linear-gradient(135deg,#ffe69b,#d68d39);box-shadow:inset -5px -4px 0 #884d1f44,0 4px 0 #854a1f}
.player:nth-child(3n) .avatar:before{background:linear-gradient(135deg,#9be8e6,#478db8);box-shadow:inset -5px -4px 0 #174d7844,0 4px 0 #244c77}
.roster{align-items:flex-end;gap:clamp(9px,2vw,20px);padding:12px 6px 8px}
.player{animation:toyBob 3.4s ease-in-out infinite}
.player:nth-child(2n){animation-delay:-1.2s}.player:nth-child(3n){animation-delay:-2.1s}
@keyframes toyBob{0%,100%{translate:0 0}50%{translate:0 -4px}}
.soundchip{box-shadow:inset 0 1px #ffffff18,0 5px 0 #241416}
.title{text-shadow:0 3px 0 #4c292b,0 7px 15px #16090a77}


/* In-game waiting room: illustrated toy stage */
.lobbyWorld{height:100%;min-height:0;max-width:1320px;width:100%;margin:auto;display:flex;flex-direction:column;gap:12px;overflow:auto;border-radius:25px;background:#351f20;border:2px solid #7d4d43;box-shadow:0 12px 0 #241416,0 25px 55px #10080988}
.lobbyHud{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:linear-gradient(180deg,#58312e,#402426);border-bottom:2px solid #7b4b3f}
.roundBadge{display:flex;flex-direction:column;text-align:right;padding:8px 15px;border-radius:14px;background:#291719;border:1px solid #86564c;box-shadow:0 4px 0 #211214}
.roundBadge b{font-size:clamp(16px,2vw,23px);color:#ffb6a6}.roundBadge small,.lobbyCode small{font-size:11px;color:#d8b4a6}
.lobbyCode{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:14px;background:#2c181a;border:1px solid #87564a}.lobbyCode strong{font-size:clamp(20px,3vw,30px);letter-spacing:3px;color:#ffdc80}
.lobbyRoom{position:relative;flex:1;min-height:270px;display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(180deg,#58322e 0%,#482729 65%,#6d3c25 66%,#a45c2b 100%)}
.lobbyRoom:before{content:"";position:absolute;inset:0 0 34%;background:radial-gradient(ellipse at 50% 100%,#ffb34722,transparent 60%),repeating-linear-gradient(0deg,transparent 0 52px,#ffffff06 53px 55px);border-bottom:7px solid #2a1718;box-shadow:0 9px 0 #7b4a2b;pointer-events:none}
.lobbyRoom:after{content:"";position:absolute;left:-8%;right:-8%;bottom:-12%;height:43%;background:repeating-linear-gradient(90deg,transparent 0 95px,#5e341f55 96px 100px),repeating-linear-gradient(0deg,transparent 0 53px,#5b301b77 54px 58px),linear-gradient(180deg,#bd702f,#79401f);transform:perspective(420px) rotateX(10deg);transform-origin:bottom;pointer-events:none}
.lobbyBanner{position:relative;z-index:2;align-self:center;margin:10px 12px 0;display:flex;align-items:center;gap:10px;padding:9px 15px;border-radius:16px;background:#2c191de8;border:1px solid #986154;box-shadow:0 5px 0 #241416}
.lobbyBanner>span:first-child{font-size:25px}.lobbyBanner b,.lobbyBanner small{display:block}.lobbyBanner b{font-size:15px}.lobbyBanner small{font-size:10px;color:#d6b8ac}.onlineCount{font-size:11px;color:#a5f4d0;margin-right:8px;white-space:nowrap}
.wallDecor{position:absolute;top:25%;z-index:1;font-size:clamp(25px,4vw,52px);opacity:.8;filter:drop-shadow(0 5px 0 #271415)}.decorLeft{left:5%}.decorRight{right:5%}
.avatarStage{position:relative;z-index:2;flex:1;display:flex;justify-content:center;align-items:flex-end;gap:clamp(8px,2vw,30px);padding:24px 15px 18px;min-height:170px}
.stagePlayers{position:relative;z-index:3;display:flex;justify-content:center;align-items:flex-end;gap:clamp(12px,3vw,42px);flex-wrap:wrap;width:100%}
.stagePlayer{width:clamp(76px,11vw,130px);display:flex;flex-direction:column;align-items:center;position:relative;animation:characterIdle 3s ease-in-out infinite;animation-delay:calc(var(--slot)*-.37s)}
.stagePlayer.offline{opacity:.45;filter:grayscale(.8)}
.namePlate{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:5px 10px;border-radius:9px;background:#291719;border:1px solid #a16b59;box-shadow:0 3px 0 #211315;color:#fff4df;font-weight:900;font-size:clamp(10px,1.4vw,13px);margin-bottom:8px}
.character{height:clamp(85px,12vw,130px);width:clamp(62px,8vw,88px);position:relative;filter:drop-shadow(0 8px 5px #24121477)}
.charFace{position:absolute;z-index:3;left:19%;top:12%;width:62%;height:43%;border-radius:44% 44% 42% 42%;background:linear-gradient(145deg,#ffe0ac,#d98d61);border:2px solid #754337;box-shadow:inset -4px -4px #a94f3b22}
.charFace i{position:absolute;top:40%;width:6px;height:7px;border-radius:50%;background:#3d2521}.charFace i:first-child{left:23%}.charFace i:nth-child(2){right:23%}.charFace b{position:absolute;bottom:20%;left:38%;width:25%;height:8px;border-bottom:3px solid #7e3333;border-radius:50%}
.charHair{position:absolute;z-index:4;left:15%;top:4%;width:70%;height:23%;border-radius:55% 55% 18% 18%;background:#ef7a8c;transform:rotate(-3deg)}
.hair1{background:#eab54b}.hair2{background:#5b91d9}.hair3{background:#9a78d9}
.charBody{position:absolute;z-index:2;left:15%;top:48%;width:70%;height:34%;border-radius:18px 18px 10px 10px;background:#e65f78;border:2px solid #66313b;box-shadow:inset -6px -3px #401c2c22}
.body1{background:#f0b43c}.body2{background:#448ed2}.body3{background:#63b77b}.body4{background:#9c73d5}
.charBody:before,.charBody:after{content:"";position:absolute;top:8%;width:22%;height:76%;border-radius:10px;background:#d99b70;border:1px solid #814c3c}.charBody:before{left:-20%;transform:rotate(13deg)}.charBody:after{right:-20%;transform:rotate(-13deg)}
.charLegs{position:absolute;z-index:1;left:25%;bottom:0;width:50%;height:24%;display:flex;justify-content:space-between}.charLegs i{width:35%;height:100%;border-radius:5px 5px 8px 8px;background:#4a73a5;border-bottom:5px solid #e6d8b9}
.micOn .charFace:after{content:"♫";position:absolute;right:-22px;top:-8px;color:#72ff9e;font-size:18px;font-weight:1000;text-shadow:0 0 8px #3cff8a}.micOff .charFace{filter:saturate(.65)}
.playerStatus{display:flex;align-items:center;gap:4px;margin-top:9px;font-size:10px;color:#ffdd9c;white-space:nowrap}.playerStatus b{font-size:10px}.statusIcon{font-size:13px}
.readyStatus{margin-top:4px;font-size:9px;color:#e5b7a8}.readyStatus.isReady{color:#80f1b4}
.emptySpot{align-self:flex-end;display:flex;flex-direction:column;align-items:center;gap:4px;color:#f7d9b8;padding:12px;border:1px dashed #d49b6a88;border-radius:16px;background:#311b1b55;margin-bottom:22px}.emptySpot span{font-size:35px;line-height:1}.emptySpot b{font-size:11px}.emptySpot small{font-size:9px;color:#d6b39f}
.floorGlow{position:absolute;z-index:1;bottom:0;left:20%;right:20%;height:26%;background:radial-gradient(ellipse,#ffc15d33,transparent 70%);pointer-events:none}
.lobbyControls{padding:0 16px 14px;display:flex;flex-direction:column;gap:10px}
.micCard{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:linear-gradient(120deg,#49282a,#2d1a1e);border:1px solid #835348}
.micOrb{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:13px;background:#63352f;font-size:22px;border:1px solid #a86a57}.micOrb.enabled{background:#164d3d;border-color:#64e4ac;box-shadow:0 0 18px #42d99a33}
.micCopy{flex:1;min-width:0}.micCopy b,.micCopy small{display:block}.micCopy b{font-size:13px}.micCopy small{font-size:10px;color:#d0b0a4;margin-top:3px}.micCard button{padding:10px 13px;font-size:12px;white-space:nowrap}

<body>
<div class="landscapeHint"><div><div class="rotate">📱</div><h2>دوّر جوالك بالعرض</h2><p class="muted">لعبة قلّدها مصممة لتملأ الشاشة بالوضع الأفقي.</p></div></div>
<div id="app"></div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
const normalizeRoomCode=v=>String(v||'').normalize('NFKC').replace(/[\s\-‐‑‒–—]+/g,'').toUpperCase();
let code=normalizeRoomCode(params.get('code')||''),token=params.get('sessionToken')||'',playerName=params.get('name')||'',state=null,stream=null,recorder=null,chunks=[],audioCtx=null,analyser=null,waveRAF=0,handledListen=0,handledRecord=0,playingClip='',clipAudio=null,revealedScoreFor='',refFeatures=null,localMicReady=false,creating=false;
const socket=io({reconnection:true,reconnectionAttempts:Infinity,reconnectionDelay:500,timeout:10000});
const sounds={meow:{title:'مواء قطة',icon:'🐈',kind:'sweep'},bark:{title:'نباح كلب',icon:'🐕',kind:'barks'},rooster:{title:'صياح ديك',icon:'🐓',kind:'chirp'},siren:{title:'صفارة إنذار',icon:'🚨',kind:'siren'},engine:{title:'محرك سيارة',icon:'🏎️',kind:'engine'},laugh:{title:'ضحكة شريرة',icon:'😈',kind:'laugh'},sneeze:{title:'عطسة قوية',icon:'🤧',kind:'sneeze'},robot:{title:'صوت روبوت',icon:'🤖',kind:'robot'}};
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg){const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),3200)}
function audio(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}
function normalize(a){if(!a.length)return[];const max=Math.max(...a,0.00001),min=Math.min(...a);const span=max-min||1;return a.map(v=>Math.max(0,Math.min(1,(v-min)/span)))}
function featuresFromBuffer(buffer){const data=buffer.getChannelData(0),sr=buffer.sampleRate,n=24,env=[],pitch=[],zcr=[];for(let k=0;k<n;k++){const start=Math.floor(k*data.length/n),end=Math.floor((k+1)*data.length/n),len=end-start;let sum=0,cross=0;for(let i=start;i<end;i++){const v=data[i];sum+=v*v;if(i>start&&((data[i-1]<0&&v>=0)||(data[i-1]>=0&&v<0)))cross++}env.push(Math.sqrt(sum/Math.max(1,len)));zcr.push(cross/Math.max(1,len));const minLag=Math.max(2,Math.floor(sr/900)),maxLag=Math.min(Math.floor(sr/70),Math.floor(len/2));let bestLag=0,best=-1;for(let lag=minLag;lag<=maxLag;lag+=4){let corr=0,count=0;for(let j=start;j<end-lag;j+=8){corr+=data[j]*data[j+lag];count++}corr/=Math.max(1,count);if(corr>best){best=corr;bestLag=lag}}pitch.push(bestLag?sr/bestLag:0)}const maxE=Math.max(...env,0.0001);const pValid=pitch.filter(x=>x>0);const pMin=pValid.length?Math.min(...pValid):0,pMax=pValid.length?Math.max(...pValid):1;return{env:env.map(x=>x/maxE),pitch:pitch.map(x=>x?Math.max(0,Math.min(1,(x-pMin)/Math.max(1,pMax-pMin))):0),zcr:zcr.map(x=>Math.min(1,x*5))}}
function synth(ctx,id,dest){const duration=2.5;const master=ctx.createGain();master.gain.value=.8;master.connect(dest);let seed=id.split('').reduce((a,ch)=>a+ch.charCodeAt(0),17);const rand=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};const noise=(at,len,vol=.25)=>{const size=Math.max(1,Math.floor(ctx.sampleRate*len)),buf=ctx.createBuffer(1,size,ctx.sampleRate),data=buf.getChannelData(0);for(let i=0;i<size;i++)data[i]=(rand()*2-1)*(1-i/size)*.9;const src=ctx.createBufferSource(),ng=ctx.createGain();src.buffer=buf;ng.gain.setValueAtTime(.001,at);ng.gain.linearRampToValueAtTime(vol,at+.02);ng.gain.exponentialRampToValueAtTime(.001,at+len);src.connect(ng);ng.connect(dest);src.start(at);src.stop(at+len)};const osc=(type,f,at=0)=>{const o=ctx.createOscillator();o.type=type;o.frequency.value=f;o.connect(master);o.start(at);o.stop(duration);return o};const gain=(at,v,len=.22)=>{master.gain.setValueAtTime(.0001,at);master.gain.exponentialRampToValueAtTime(Math.max(.001,v),at+.025);master.gain.setValueAtTime(Math.max(.001,v),at+len);master.gain.exponentialRampToValueAtTime(.0001,at+len+.12)};
if(id==='meow'){const o=osc('sawtooth',650);o.frequency.setValueAtTime(650,0);o.frequency.exponentialRampToValueAtTime(290,1.0);o.frequency.exponentialRampToValueAtTime(520,1.45);o.frequency.exponentialRampToValueAtTime(330,2.2);gain(0,.55,2.05)}
else if(id==='bark'){const o=osc('square',150);for(let t=.08;t<2.2;t+=.48){o.frequency.setValueAtTime(170,t);o.frequency.exponentialRampToValueAtTime(85,t+.18);gain(t,.7,.16);noise(t,.22,.42)}}
else if(id==='rooster'){const o=osc('triangle',600);o.frequency.setValueAtTime(450,0);o.frequency.exponentialRampToValueAtTime(1000,.45);o.frequency.exponentialRampToValueAtTime(300,1.0);o.frequency.exponentialRampToValueAtTime(750,1.35);o.frequency.exponentialRampToValueAtTime(220,2.2);gain(0,.5,2.1)}
else if(id==='siren'){const o=osc('sine',500);for(let t=0;t<2.3;t+=.65){o.frequency.setValueAtTime(450,t);o.frequency.linearRampToValueAtTime(1050,t+.32);o.frequency.linearRampToValueAtTime(450,t+.64)}gain(0,.45,2.2)}
else if(id==='engine'){const o=osc('sawtooth',80);o.frequency.setValueAtTime(70,0);o.frequency.linearRampToValueAtTime(170,1.1);o.frequency.linearRampToValueAtTime(95,2.35);gain(0,.28,2.25);noise(0,2.35,.12)}
else if(id==='laugh'){const o=osc('square',450);for(let t=.05;t<2.2;t+=.34){o.frequency.setValueAtTime(t%0.7<.34?480:620,t);gain(t,.4,.13)}}
else if(id==='sneeze'){const o=osc('triangle',300);o.frequency.setValueAtTime(170,0);o.frequency.exponentialRampToValueAtTime(850,.22);o.frequency.exponentialRampToValueAtTime(110,.65);o.frequency.exponentialRampToValueAtTime(280,1.0);gain(0,.7,.38);noise(0,.6,.65)}
else{const o=osc('square',240);for(let t=0;t<2.2;t+=.27){o.frequency.setValueAtTime([220,320,180,420][Math.floor(t/.27)%4],t);gain(t,.36,.12)}}
return duration}
async function makeReference(id){const Offline=window.OfflineAudioContext||window.webkitOfflineAudioContext;if(!Offline)throw new Error('متصفحك لا يدعم تجهيز الصوت');const ctx=new Offline(1,Math.floor(44100*2.5),44100);synth(ctx,id,ctx.destination);return await ctx.startRendering()}
async function playSource(){const id=state?.soundId;if(!id||handledListen===state.round)return;handledListen=state.round;try{audio();const buffer=await makeReference(id);refFeatures=featuresFromBuffer(buffer);const src=audioCtx.createBufferSource();src.buffer=buffer;src.connect(audioCtx.destination);src.start();src.onended=()=>{socket.emit('mimic:heard',{code,features:refFeatures})}}catch(e){toast('تعذر تشغيل الصوت المرجعي: '+e.message);socket.emit('mimic:heard',{code,features:{env:Array(24).fill(.2),pitch:Array(24).fill(.3),zcr:Array(24).fill(.2)}})}}
async function activateMic(){try{audio();stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:false},video:false});localMicReady=true;socket.emit('mimic:micReady',{code,ready:true});toast('الميكروفون جاهز!');startWavePreview()}catch(e){localMicReady=false;toast('لازم تسمح باستخدام الميكروفون من إعدادات المتصفح.')}} 
function drawWave(canvas,active){if(!canvas)return;const ctx=canvas.getContext('2d');const w=canvas.width=canvas.clientWidth*devicePixelRatio,h=canvas.height=canvas.clientHeight*devicePixelRatio;ctx.clearRect(0,0,w,h);ctx.lineWidth=2*devicePixelRatio;ctx.strokeStyle=active?'#61e6ee':'#9d75ff';ctx.beginPath();if(active&&analyser){const arr=new Uint8Array(analyser.fftSize);analyser.getByteTimeDomainData(arr);for(let i=0;i<arr.length;i++){const x=i/(arr.length-1)*w,y=arr[i]/255*h;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}}else{for(let i=0;i<100;i++){const x=i/99*w,y=h/2+Math.sin(i*.34+Date.now()/500)*Math.sin(i*.1)*h*.22;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}}ctx.stroke()}
function startWavePreview(){try{const a=audio();if(!analyser){const src=a.createMediaStreamSource(stream);analyser=a.createAnalyser();analyser.fftSize=256;src.connect(analyser)}const loop=()=>{const cv=$('wave');if(!cv)return;drawWave(cv,!!recorder&&recorder.state==='recording');waveRAF=requestAnimationFrame(loop)};cancelAnimationFrame(waveRAF);loop()}catch{}}
function startRecording(){if(handledRecord===state.round)return;handledRecord=state.round;if(!stream){toast('فعّل الميكروفون قبل بدء الجولة');return}try{chunks=[];let mime='';for(const m of ['audio/webm;codecs=opus','audio/mp4','audio/webm','audio/ogg;codecs=opus'])if(MediaRecorder.isTypeSupported?.(m)){mime=m;break}recorder=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);recorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};recorder.onstop=async()=>{const blob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});let features={env:[],pitch:[],zcr:[]},data='';try{const arr=await blob.arrayBuffer();const decoded=await audio().decodeAudioData(arr.slice(0));features=featuresFromBuffer(decoded);data=await new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>resolve(fr.result);fr.onerror=reject;fr.readAsDataURL(blob)})}catch(e){toast('تعذر تحليل التسجيل على هذا الجهاز')}socket.emit('mimic:submit',{code,audioData:data,features})};recorder.start(200);setTimeout(()=>{if(recorder&&recorder.state==='recording')recorder.stop()},10000);startWavePreview()}catch(e){toast('تعذر بدء التسجيل. تأكد من إذن الميكروفون.');socket.emit('mimic:submit',{code,audioData:'',features:{}})}}
function avatar(p){const a=String(p?.avatar||'');if(/^data:image\/(?:png|jpeg|webp|gif);base64,[a-z0-9+/=]+$/i.test(a))return '<img alt="" src="'+a+'" style="width:100%;height:100%;object-fit:cover;border-radius:38% 38% 45% 45%">';const looks=['👩🏻‍🎤','🧑🏼‍🎤','👨🏽‍🎤','👩🏾‍🎤','🧑🏻‍🎨','👨🏼‍🚀','👩🏼‍🚀','🧑🏽‍🎨'];const seed=String(p?.id||p?.name||'player').split('').reduce((n,ch)=>n+ch.charCodeAt(0),0);return looks[seed%looks.length]}
function header(){return '<div class="top"><div class="brand"><span class="brandmark">🎙️</span><span>قلّدها <small style="font-size:11px;color:#bba8d7">من الساحة</small></span></div><div class="meta"><span class="pill">🔐 الغرفة <b>'+esc(code||'—')+'</b></span><span class="pill">🏁 الجولة '+(state?.round||0)+' / '+(state?.maxRounds||7)+'</span><button class="ghost" onclick="location.href=\'/\'">خروج</button></div></div>'}
function playerTiles(){return '<div class="roster">'+(state?.players||[]).map(p=>'<div class="player"><div class="avatar">'+avatar(p)+'</div><div class="name">'+esc(p.name)+'</div><small><i class="readyDot '+(p.micReady?'yes':'')+'"></i>'+(p.micReady?'الميكروفون جاهز':'فعّل الميكروفون')+'</small></div>').join('')+'</div>'}
function lobby(){const players=state?.players||[];const online=players.filter(p=>p.online);const ready=online.filter(p=>p.micReady).length;return '<div class="lobbyWorld"><div class="lobbyHud"><div class="roundBadge"><b>قلّدها</b><small>استعد للجولة</small></div><div class="lobbyCode"><small>رمز الغرفة</small><strong>'+esc(code)+'</strong><button class="ghost" onclick="shareCode()">مشاركة</button></div></div><div class="lobbyRoom"><div class="wallDecor decorLeft">🎵</div><div class="wallDecor decorRight">🎙️</div><div class="lobbyBanner"><span>🎧</span><div><b>لوبي قلّدها</b><small>اجتمعوا قبل بدء التحدّي</small></div><span class="onlineCount">'+online.length+' / '+(state?.roomMaxPlayers||12)+' لاعبين</span></div><div class="avatarStage"><div class="stageLamp lampA"></div><div class="stageLamp lampB"></div><div class="stagePlayers">'+players.map((p,i)=>'<div class="stagePlayer '+(p.online?'online':'offline')+'" style="--slot:'+i+'"><div class="namePlate">'+esc(p.name)+'</div><div class="character '+(p.micReady?'micOn':'micOff')+'"><div class="charHair hair'+(i%4)+'"></div><div class="charFace"><i></i><i></i><b></b></div><div class="charBody body'+(i%5)+'"></div><div class="charLegs"><i></i><i></i></div></div><div class="playerStatus"><span class="statusIcon">'+(p.micReady?'🎙️':'🔇')+'</span><b>'+(p.micReady?'المايك جاهز':'المايك غير جاهز')+'</b></div><div class="readyStatus '+(p.micReady?'isReady':'')+'">'+(p.micReady?'✓ مستعد':'بانتظار الاستعداد')+'</div></div>').join('')+(players.length<2?'<div class="emptySpot"><span>＋</span><b>بانتظار لاعب آخر</b><small>افتح الرابط من جوال ثانٍ</small></div>':'')+'</div><div class="floorGlow"></div></div><div class="lobbyControls"><div class="micCard"><div class="micOrb '+(localMicReady?'enabled':'')+'">🎙️</div><div class="micCopy"><b>'+(localMicReady?'الميكروفون جاهز للعب':'جهّز الميكروفون')+'</b><small>'+(localMicReady?'أنت مستعد — بانتظار بقية اللاعبين':'اسمح للمتصفح باستخدام الميكروفون')+'</small></div><button onclick="activateMic()" '+(localMicReady?'disabled':'')+'>'+(localMicReady?'✓ جاهز':'تفعيل المايك')+'</button></div><div class="lobbySettings">'+(state?.isHost?'<label>الجولات<select id="rounds">'+[5,7,10,15].map(n=>'<option value="'+n+'" '+((state?.maxRounds||7)===n?'selected':'')+'>'+n+' جولات</option>').join('')+'</select></label><label>فئة الأصوات<select id="category">'+[['mixed','مختلط'],['animals','حيوانات'],['objects','أشياء ومؤثرات'],['voices','أصوات بشرية']].map(([v,t])=>'<option value="'+v+'" '+((state?.category||'mixed')===v?'selected':'')+'>'+t+'</option>').join('')+'</select></label>':'<div class="guestHint">عند جاهزية الجميع، يبدأ المضيف الجولة</div>')+'<div class="readyCounter"><strong>'+ready+' / '+online.length+'</strong><small>لاعبون جاهزون</small></div>'+(state?.isHost?'<button class="gold startBtn" onclick="startGame()" '+(online.length<2||ready!==online.length?'disabled':'')+'>ابدأ التحدّي ▶</button>':'')+'</div><p class="lobbyFootnote">🎮 اللوبي مباشر — حالة اللاعبين والميكروفون تتحدّث تلقائيًا على كل الجوالات.</p></div></div>'}
function phaseShell(main){return '<div class="panel gamepanel"><div class="top"><div class="brand"><span class="brandmark">🎙️</span><span>قلّدها</span></div><div class="meta"><span class="pill">الجولة '+state.round+' / '+state.maxRounds+'</span><span class="pill">🎧 '+esc(state.soundTitle||'تحدّي صوتي')+'</span></div></div>'+main+'</div>'}
function sidePanel(){return '<aside class="side"><h3>🏆 مجموع النقاط</h3>'+(state.players||[]).slice().sort((a,b)=>(b.score||0)-(a.score||0)).map((p,i)=>'<div class="sidePlayer"><div class="miniAvatar">'+(i===0?'👑':avatar(p))+'</div><div class="info"><b>'+esc(p.name)+'</b><small>'+(p.recorded?'تم التسجيل':p.micReady?'جاهز':'غير جاهز')+'</small></div><span class="sideScore">'+(p.score||0)+'</span></div>').join('')+'</aside>'}
function listenView(){return phaseShell('<div class="stage"><section class="mainstage"><div class="soundchip"><span class="soundicon">'+(sounds[state.soundId]?.icon||'🔊')+'</span>اسمع الصوت مرة واحدة</div><div class="bigAvatar">🔊</div><div class="stageName">'+esc(state.soundTitle)+'</div><div class="statusline">ركز بالصوت… بعده رح يبدأ العدّ التنازلي مباشرة</div><div class="wavebox"><canvas id="wave"></canvas><div class="waveLabel"><span>الصوت الأصلي</span><span>يُشغّل مرة واحدة</span></div></div></section>'+sidePanel()+'</div>')}
function countdownView(){return phaseShell('<div class="stage"><section class="mainstage"><div class="soundchip">استعد للتقليد</div><div class="count" id="count">3</div><div class="stageName">جهّز صوتك!</div><div class="statusline">التسجيل سيبدأ تلقائيًا بعد العدّ التنازلي</div></section>'+sidePanel()+'</div>')}
function recordingView(){return phaseShell('<div class="stage"><section class="mainstage"><div class="soundchip"><span class="soundicon">🔴</span>جاري التسجيل</div><div class="bigAvatar">🎙️</div><div class="stageName">'+esc(playerName||state.players.find(p=>p.id===state.myPlayerId)?.name||'قلّد الصوت!')+'</div><div class="statusline">قلّد الصوت بأفضل طريقة عندك — التسجيل ينتهي تلقائيًا</div><div class="wavebox"><canvas id="wave"></canvas><div class="waveLabel"><span>موجتك الصوتية الحية</span><span>10 ثوانٍ</span></div></div></section>'+sidePanel()+'</div>')}
function revealView(){const clip=state.currentClip;return phaseShell('<div class="stage"><section class="mainstage zoom"><div class="soundchip">🎬 تقليد اللاعب '+(state.clipIndex+1)+' من '+state.clipCount+'</div><div class="bigAvatar">'+(clip?avatar({avatar:clip.avatar}):'🎙️')+'</div><div class="stageName">'+esc(clip?.name||'اللاعب')+'</div><div class="statusline">استمعوا للتقليد… الدرجة محسوبة تلقائيًا</div><div class="wavebox"><canvas id="wave"></canvas><div class="waveLabel"><span>تسجيل اللاعب</span><span>النتيجة '+(state.currentClip?.id===revealedScoreFor?(clip?.score??'—'):'—')+' / 100</span></div></div><div class="actions">'+'<button class="ghost" onclick="playCurrentClip()">▶ تشغيل التقليد</button>'+(state.isHost?'<button class="gold" onclick="nextClip()">اللاعب التالي ←</button>':'<span class="pill">بانتظار الانتقال للتقليد التالي</span>')+'</div></section>'+sidePanel()+'</div>')}
function resultsView(){const ps=(state.players||[]).slice().sort((a,b)=>(b.roundScore||0)-(a.roundScore||0));return '<div class="panel center"><div class="soundchip">✨ نتائج الجولة '+state.round+'</div><h1 class="title">نتائج التقليد</h1><p class="subtitle">كل درجة من 100 محسوبة تلقائيًا من خصائص التسجيل الصوتي.</p><div style="max-width:650px;margin:auto">'+ps.map((p,i)=>'<div class="rankrow"><span class="ranknum">'+(i+1)+'</span><b>'+esc(p.name)+'</b><strong style="color:var(--gold)">'+(p.roundScore??0)+' / 100</strong></div>').join('')+'</div><div class="actions">'+(state.isHost?'<button class="gold" onclick="nextRound()">'+(state.round>=state.maxRounds?'عرض النتيجة النهائية':'الجولة التالية')+'</button>':'<span class="pill">بانتظار صاحب الغرفة</span>')+'</div></div>'}
function finishedView(){const ps=(state.players||[]).slice().sort((a,b)=>(b.score||0)-(a.score||0));return '<div class="panel center"><div style="font-size:65px;margin:5px">🏆</div><h1 class="title">بطل قلّدها!</h1><p class="subtitle">انتهت كل الجولات. هذا الترتيب النهائي حسب مجموع الدرجات من 100 لكل جولة.</p><div style="max-width:650px;margin:auto">'+ps.map((p,i)=>'<div class="rankrow"><span class="ranknum">'+(i===0?'👑':i+1)+'</span><b>'+esc(p.name)+'</b><strong style="color:var(--gold)">'+(p.score||0)+' نقطة</strong></div>').join('')+'</div><div class="actions"><button onclick="location.href=\'/\'">العودة للساحة</button>'+(state.isHost?'<button class="ghost" onclick="restartLobby()">غرفة جديدة</button>':'')+'</div></div>'}
function render(){if(!code){$('app').innerHTML=header()+'<div class="content"><div class="panel center"><h1 class="title">قلّدها 🎙️</h1><p class="subtitle">أنشئ غرفة من الصفحة الرئيسية في الساحة، أو أدخل كود غرفة موجودة.</p><div class="formgrid"><div class="field"><label>اسمك</label><input id="nameInput" placeholder="اسم اللاعب" value="'+esc(playerName)+'"></div><div class="field"><label>كود الغرفة</label><input id="codeInput" placeholder="Q123" maxlength="4"></div><div class="field"><label>عدد الجولات</label><select id="roundInput"><option value="5">5 جولات</option><option value="7" selected>7 جولات</option><option value="10">10 جولات</option><option value="15">15 جولات</option></select></div></div><div class="actions"><button onclick="createDirect()">إنشاء غرفة</button><button class="ghost" onclick="joinDirect()">انضمام</button><button class="ghost" onclick="location.href='/'">رجوع</button></div></div></div>';return}if(!state){$('app').innerHTML=header()+'<div class="content"><div class="panel center"><div class="count">…</div><p>جاري الاتصال بالغرفة '+esc(code)+'</p></div></div>';return}let body;if(state.phase==='lobby')body=lobby();else if(state.phase==='listen')body=listenView();else if(state.phase==='countdown')body=countdownView();else if(state.phase==='recording')body=recordingView();else if(state.phase==='reveal')body=revealView();else if(state.phase==='results')body=resultsView();else if(state.phase==='finished')body=finishedView();$('app').innerHTML=body; if(state.phase==='listen')drawWave($('wave'),false);if(state.phase==='recording')startWavePreview();if(state.phase==='reveal'&&state.currentClip&&playingClip!==state.currentClip.id)playClip(state.currentClip);if(state.phase==='countdown')animateCount()}
let countRound=0;function animateCount(){if(countRound===state.round)return;countRound=state.round;let n=3;const el=$('count');if(!el)return;el.textContent=n;const timer=setInterval(()=>{n--;const target=$('count');if(!target||state?.phase!=='countdown'){clearInterval(timer);return}if(n>0)target.textContent=n;else{target.textContent='🎙️';clearInterval(timer)}},1000)}
function playClip(clip){playingClip=clip.id;const cv=$('wave');drawWave(cv,false);if(!clip.audioData){toast('هذا اللاعب لم يرسل تسجيلًا صالحًا');return}try{if(clipAudio){clipAudio.pause();clipAudio=null}clipAudio=new Audio(clip.audioData);clipAudio.play().catch(()=>toast('إذا ما اشتغل الصوت، اضغط «تشغيل التقليد»'));clipAudio.onended=()=>{revealedScoreFor=clip.id;render();if(state?.isHost&&state.phase==='reveal')setTimeout(()=>{if(state?.currentClip?.id===clip.id)nextClip()},1800)}}catch{toast('تعذر تشغيل التسجيل')}}function playCurrentClip(){if(clipAudio)clipAudio.play().catch(()=>toast('تعذر تشغيل التسجيل'))}
function startGame(){const rounds=Number($('rounds')?.value)||7,category=$('category')?.value||'mixed';socket.emit('mimic:settings',{code,rounds,category});socket.emit('mimic:start',{code})}
function nextClip(){socket.emit('mimic:nextClip',{code})}
function nextRound(){socket.emit('mimic:nextRound',{code})}
function shareCode(){const url=location.origin+'/games/mimic/?code='+encodeURIComponent(code);if(navigator.share)navigator.share({title:'قلّدها - الساحة',text:'انضم لغرفة قلّدها باستخدام الرمز: '+code,url}).catch(()=>{});else if(navigator.clipboard?.writeText)navigator.clipboard.writeText(url).then(()=>toast('تم نسخ رابط الانضمام')).catch(()=>toast('كود الغرفة: '+code));else toast('كود الغرفة: '+code+' — افتح /games/mimic/ ثم أدخل الرمز')}
function createDirect(){const n=($('nameInput')?.value||'لاعب').trim()||'لاعب';playerName=n;const rounds=Number($('roundInput')?.value)||7;socket.emit('room:create',{game:'mimic',mode:'players',name:n,maxRounds:rounds,rounds,category:'mixed'});creating=true}
function joinDirect(){const n=($('nameInput')?.value||'لاعب').trim()||'لاعب',c=normalizeRoomCode($('codeInput')?.value||'');if(!c)return toast('اكتب كود الغرفة مثل Q123');if(!/^Q\d{3}$/.test(c))return toast('رمز قلّدها يجب أن يبدأ بحرف Q ويتبعه 3 أرقام، مثل Q123');playerName=n;code=c;token='';socket.emit('room:join',{code:c,name:n});render()}
function restartLobby(){location.href='/games/mimic/'}
window.activateMic=activateMic;window.startGame=startGame;window.nextClip=nextClip;window.nextRound=nextRound;window.shareCode=shareCode;window.playCurrentClip=playCurrentClip;window.createDirect=createDirect;window.joinDirect=joinDirect;window.restartLobby=restartLobby;
socket.on('room:created',x=>{code=x.code;token=x.sessionToken||token;location.href='/games/mimic/?code='+encodeURIComponent(code)+'&sessionToken='+encodeURIComponent(token)+'&name='+encodeURIComponent(playerName||'لاعب')});
socket.on('joined',x=>{code=x.code;token=x.sessionToken||token;history.replaceState({},'',location.pathname+'?code='+encodeURIComponent(code)+'&sessionToken='+encodeURIComponent(token)+'&name='+encodeURIComponent(playerName||'لاعب'))});
socket.on('mimic:state',s=>{const previousPhase=state?.phase;const previousRound=state?.round;if(s.phase==='listen'&&previousRound!==s.round)revealedScoreFor='';state=s;if(s.myPlayerId){const me=s.players.find(p=>p.id===s.myPlayerId);if(me)playerName=me.name}render();if(s.phase==='listen'&&(previousPhase!=='listen'||previousRound!==s.round))playSource();if(s.phase==='recording'&&(previousPhase!=='recording'||previousRound!==s.round))startRecording();if(s.phase!=='reveal')playingClip=''});
socket.on('connect',()=>{if(code){render();if(token)socket.emit('room:resume',{code,sessionToken:token,name:playerName});else socket.emit('room:join',{code,name:playerName||'لاعب'})}});
socket.on('resumeFailed',x=>{toast(x?.message||'تعذر استعادة الغرفة');if(x?.finished)location.href='/'});
socket.on('errorMsg',m=>{toast(m||'حدث خطأ');if(!state&&code){code='';token='';history.replaceState(null,'',location.pathname);render()}});socket.on('connect_error',()=>toast('تعذر الاتصال بالخادم، جاري إعادة المحاولة'));
if(!code)render();
})();
</script>
</body>
</html>
