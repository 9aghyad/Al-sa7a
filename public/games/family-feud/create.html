<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إنشاء لعبة العائلة</title><link rel="stylesheet" href="/games/family-feud/style.css"></head><body><main class="wrap"><a class="back" href="/games/family-feud">← طرق اللعب</a><div class="brand"><h1>لعبة العائلة</h1><p id="modeText"></p></div><form class="form" id="f"><label>اسمك</label><input id="name" required><label>عدد الجولات</label><select id="rounds"><option>5</option><option>10</option><option>15</option><option>20</option></select><label>اسم الفريق الأحمر</label><input id="red" value="الفريق الأحمر"><label>اسم الفريق الأزرق</label><input id="blue" value="الفريق الأزرق"><button class="btn">إنشاء اللعبة</button></form></main><script>const q=new URLSearchParams(location.search),m=q.get('mode')||'full';document.getElementById('modeText').textContent={full:'مقدم + شاشة + لاعبين',display:'شاشة + لاعبين',players:'لاعبين فقط'}[m];document.getElementById('f').onsubmit=e=>{e.preventDefault();const u=new URL('/games/family-feud/choose.html',location.origin);u.search=new URLSearchParams({mode:m,name:document.getElementById('name').value,rounds:document.getElementById('rounds').value,red:document.getElementById('red').value,blue:document.getElementById('blue').value});location.href=u};</script></body></html>
