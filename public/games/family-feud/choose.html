<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دخول اللعبة</title><link rel="stylesheet" href="/games/family-feud/style.css"></head><body><main class="wrap"><div class="brand"><h1>لعبة العائلة</h1><p id="sub"></p></div><div class="grid" id="grid"></div></main><script>const q=new URLSearchParams(location.search),m=q.get('mode')||'full';const all={full:[['🎤','صفحة المقدم','/games/family-feud/presenter'],['📺','صفحة العرض','/games/family-feud/display'],['🎮','صفحة المتسابقين','/games/family-feud/players']],display:[['📺','صفحة العرض','/games/family-feud/display'],['🎮','صفحة المتسابقين','/games/family-feud/players']],players:[['🎮','صفحة اللاعبين','/games/family-feud/players']]};document.getElementById('sub').textContent={full:'مقدم مستقل • شاشة عرض مستقلة • صفحة متسابقين مستقلة',display:'شاشة عرض مستقلة • صفحة متسابقين مستقلة',players:'واجهة اللاعبين'}[m];document.getElementById('grid').innerHTML=all[m].map(x=>`<div class="card" onclick="location.href='${x[2]}'"><div class="icon">${x[0]}</div><h2>${x[1]}</h2><p>الدخول إلى الواجهة الخاصة</p></div>`).join('');</script></body></html>
