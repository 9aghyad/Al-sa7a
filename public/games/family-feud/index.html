<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family Feud • الساحة</title><link rel="stylesheet" href="/games/family-feud/family-feud.css"></head><body><main class="wrap"><div class="card"><div class="top"><div><div class="small">الساحة</div><h1>👨‍👩‍👧‍👦 Family Feud</h1></div><button class="btn dark" onclick="location.href='/'">الرئيسية</button></div><div id="app"></div></div></main><script>const q=new URLSearchParams(location.search),r=Math.max(5,Math.min(20,Number(q.get('rounds'))||5)),m=q.get('mode')||'1';const modes={"1":{title:'🎙️ لعب شفهي',desc:'Buzz وDouble ثم إجابة شفهيًا، مع شاشة ومقدم.'},"2":{title:'✍️ لعب كتابي',desc:'يختار اللاعب الإجابة ثم يكتبها، مع شاشة ومقدم.'},"3":{title:'👥 لاعبين فقط',desc:'لعب من أجهزة اللاعبين بدون شاشة أو مقدم.'}};const x=modes[m]||modes['1'];document.getElementById('app').innerHTML=`<div class="center"><h2>${x.title}</h2><p class="muted">${x.desc}</p><p class="muted">عدد الجولات: ${r}</p></div><div class="roleGrid">${m==='3'?`<button class="role" onclick="location.href='/games/family-feud/players?rounds=${r}&mode=3&new=1'">👥 إنشاء غرفة واللعب</button>`:`<button class="role" onclick="location.href='/games/family-feud/presenter?rounds=${r}&mode=${m}&new=1'">🎙️ إنشاء غرفة كمقدم</button><button class="role" onclick="location.href='/games/family-feud/display'">🖥️ دخول شاشة بكود</button><button class="role" onclick="location.href='/games/family-feud/players'">👥 دخول لاعب بكود</button>`}</div></div>`;</script></body></html>
