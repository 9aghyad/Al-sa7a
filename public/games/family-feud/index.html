<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family Feud • الساحة</title><link rel="stylesheet" href="/games/family-feud/family-feud.css"><script src="/socket.io/socket.io.js"></script><style>body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#293467,#070a12 55%);color:#fff;font-family:system-ui,Tahoma,Arial}.wrap{width:min(760px,94vw);margin:auto;padding:24px}.card{background:rgba(13,18,32,.95);border:1px solid #35415d;border-radius:26px;padding:24px;box-shadow:0 25px 80px #0008}.center{text-align:center}.title{font-size:clamp(42px,9vw,78px);margin:8px 0}.sub{color:#aeb8cc;line-height:1.8}.grid{display:grid;gap:12px}.mode{padding:18px;border:2px solid #303c58;border-radius:18px;background:#121a2b;color:#fff;text-align:right;cursor:pointer}.mode.selected{border-color:#7b68ff;background:#211c43;box-shadow:0 0 0 3px #7b68ff22}.mode b{display:block;font-size:18px}.mode small{display:block;color:#aeb8cc;margin-top:5px;line-height:1.6}.btn{border:0;border-radius:15px;padding:14px 18px;font-weight:1000;cursor:pointer}.gold{background:#e5b638;color:#211700}.dark{background:#20283d;color:#fff}.rounds{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.rounds button{border:1px solid #34415c;border-radius:13px;padding:12px;background:#161e30;color:#fff;font-weight:900}.rounds button.sel{background:#6e5af0;border-color:#a79aff}@media(max-width:560px){.rounds{grid-template-columns:1fr 1fr}.wrap{padding:12px}.card{padding:18px}}</style></head><body><main class="wrap"><section class="card center"><div style="font-size:50px">👨‍👩‍👧‍👦</div><h1 class="title">Family Feud</h1><p class="sub">اختر طريقة اللعب ثم أنشئ الغرفة. مود المقدم يستخدم شاشة عرض مستقلة، ومود اللاعبين يعمل بالكامل من الجوالات.</p><div class="grid" style="margin-top:20px;text-align:right"><button class="mode selected" id="m1" onclick="pick('1')"><b>🎤 مقدم + شاشة + لاعبين</b><small>المقدم يدير الإجابات والـStrikes والنقاط، واللاعبون يجيبون من جوالاتهم.</small></button><button class="mode" id="m2" onclick="pick('2')"><b>✍️ مقدم + شاشة + كتابة</b><small>نفس مود المقدم مع إجابات كتابية من اللاعبين.</small></button><button class="mode" id="m3" onclick="pick('3')"><b>👥 مود اللاعبين</b><small>بدون مقدم؛ اللاعبون يديرون السؤال والإجابات والنقاط من جوالاتهم.</small></button></div><h3 style="text-align:right;margin:22px 0 8px">عدد الجولات</h3><div class="rounds"><button class="sel" data-r="5" onclick="pickRounds(5)">5</button><button data-r="10" onclick="pickRounds(10)">10</button><button data-r="15" onclick="pickRounds(15)">15</button><button data-r="20" onclick="pickRounds(20)">20</button></div><button class="btn gold" style="width:100%;margin-top:20px;font-size:18px" onclick="create()">🚀 إنشاء اللعبة</button><button class="btn dark" style="width:100%;margin-top:9px" onclick="location.href='/'">الرئيسية</button><div id="msg" class="sub" style="margin-top:12px"></div></section></main><script>const socket=io();let selected='1',rounds=5;function pick(x){selected=x;document.querySelectorAll('.mode').forEach(e=>e.classList.remove('selected'));document.getElementById('m'+x).classList.add('selected')}function pickRounds(n){rounds=n;document.querySelectorAll('.rounds button').forEach(e=>e.classList.toggle('sel',Number(e.dataset.r)===n))}function create(){document.getElementById('msg').textContent='جاري إنشاء الغرفة…';socket.emit('room:create',{game:'family',mode:selected,rounds,name:'المقدم'})}socket.on('room:created',x=>{if(x?.role==='presenter')location.href='/games/family-feud/presenter?code='+encodeURIComponent(x.code)+'&mode='+encodeURIComponent(selected)+'&rounds='+rounds});socket.on('errorMsg',x=>document.getElementById('msg').textContent=x||'تعذر إنشاء الغرفة');</script></body></html>
