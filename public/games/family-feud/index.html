<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فاميلي فيود</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,Tahoma,sans-serif;background:radial-gradient(circle at 50% 0,#27314e,#090b13 60%);color:#fff;display:grid;place-items:center;padding:24px}.wrap{width:min(920px,96vw);background:#0f1320ee;border:1px solid #ffffff18;border-radius:30px;padding:30px;box-shadow:0 30px 90px #0008}.brand{text-align:center;font-size:clamp(34px,7vw,62px);font-weight:1000}.sub{text-align:center;opacity:.8;margin:8px 0 28px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{padding:24px 14px;border:1px solid #ffffff18;border-radius:22px;background:#181f33;color:#fff;text-decoration:none;text-align:center;font-size:20px;font-weight:900;cursor:pointer;transition:.2s}.card:hover{transform:translateY(-3px);background:#232d48}.small{display:block;opacity:.68;font-size:13px;font-weight:600;margin-top:8px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="brand">فاميلي فيود</div><div class="sub">اختر الواجهة التي تريد الدخول إليها</div><div class="grid" id="grid"></div></main>
<script>const p=new URLSearchParams(location.search),r=p.get('rounds')||'5',m=p.get('mode')||'presenter';const d=m==='presenter'?[['🎤','دخول المقدم','presenter.html'],['📺','دخول الشاشة','display.html'],['👥','دخول اللاعبين','players.html']]:m==='display'?[['📺','دخول الشاشة','display.html'],['👥','دخول اللاعبين','players.html']]:[['👥','دخول اللاعبين','players.html']];document.getElementById('grid').innerHTML=d.map(x=>`<a class="card" href="${x[2]}?rounds=${encodeURIComponent(r)}">${x[0]} ${x[1]}<span class="small">${r} جولات</span></a>`).join('');</script></body></html>
