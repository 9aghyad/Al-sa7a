<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family Feud • الساحة</title><link rel="stylesheet" href="/games/family-feud/family-feud.css"></head><body><main class="wrap"><div class="card"><div class="top"><div><div class="small">الساحة</div><h1>👨‍👩‍👧‍👦 Family Feud</h1></div><button class="btn dark" onclick="location.href='/'">الرئيسية</button></div><div id="app"></div></div></main><script>const q=new URLSearchParams(location.search),r=Math.max(5,Math.min(20,Number(q.get('rounds'))||5)),m=q.get('mode')||'presenter';const labels={presenter:['🎙️ دخول المقدم','/games/family-feud/presenter'],display:['🖥️ دخول الشاشة','/games/family-feud/display'],players:['👥 دخول اللاعبين','/games/family-feud/players']};const roles=m==='presenter'?['presenter','display','players']:m==='display'?['display','players']:['players'];document.getElementById('app').innerHTML=`<div class="center"><h2>عدد الجولات: ${r}</h2><p class="muted">${m==='presenter'?'اختر طريقة الدخول المطلوبة.':m==='display'?'وضع شاشة + لاعبين':'وضع لاعبين فقط'}</p></div><div class="roleGrid">${roles.map(x=>`<button class="role" onclick="location.href='${labels[x][1]}?rounds=${r}&mode=${m}'">${labels[x][0]}</button>`).join('')}</div>`;</script></body></html>
