<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family Feud • اللاعبين</title><link rel="stylesheet" href="/games/family-feud/family-feud.css"><script src="/socket.io/socket.io.js"></script></head><body><main class="wrap"><div id="app" class="card"><div class="center"><h1>👥 دخول اللاعبين</h1><input id="codeIn" class="input" maxlength="4" placeholder="رمز الغرفة A123"><input id="nameIn" class="input" maxlength="24" placeholder="اسم اللاعب"><select id="teamIn" class="input"><option value="A">🔴 الفريق الأحمر</option><option value="B">🔵 الفريق الأزرق</option></select><div class="row"><button class="btn primary" onclick="joinPlayer()">دخول الغرفة</button></div></div></div><div id="toast" class="buzzNotice hiddenEl"></div></main><script src="/games/family-feud/family-feud.js"></script><script>role='player';function joinPlayer(){const c=document.getElementById('codeIn').value.trim().toUpperCase(),n=document.getElementById('nameIn').value.trim()||'لاعب',t=document.getElementById('teamIn').value;if(!/^A[1-3]\d{2}$/.test(c))return toast('رمز Family Feud يكون مثل A101 أو A201 أو A301');socket.emit('room:join',{code:c,name:n,team:t})}if(qs.get('code')){document.getElementById('codeIn').value=qs.get('code').toUpperCase();if(qs.get('mode')==='display'){} }</script></body></html>
