t(circle,#263756,#141d2f)}.answer.hostAnswer{color:#fff;background:linear-gradient(180deg,#263957,#17243a);border-color:#526789}.answer.hostAnswer:hover{border-color:#7f95bd}.buzz{padding:18px;text-align:center;border:1px solid #556582;background:#19233a;border-radius:18px;font-size:25px;font-weight:1000;animation:buzz .4s 2}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.bankRow{padding:17px;border:1px solid #2d3a56;border-radius:18px;background:#121b2d;margin:10px 0}.bankAnswer{display:inline-flex;align-items:center;gap:6px;margin:3px;padding:7px 10px;border-radius:10px;background:#1a263d;border:1px solid #33415e}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.qr{width:190px;height:190px;background:#fff;padding:10px;border-radius:18px}.muted{color:var(--muted)}.sound{position:fixed;left:18px;bottom:18px;z-index:50;border-radius:999px}.toast{position:fixed;top:18px;left:50%;transform:translate(-50%,-130%);background:#111b2e;border:1px solid #3a4967;border-radius:999px;padding:12px 18px;z-index:100;font-weight:800;transition:.3s}.toast.show{transform:translate(-50%,0)}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:80;padding:20px}.modalBox{max-width:700px;width:100%;max-height:90vh;overflow:auto;background:#10182a;border:1px solid #394865;border-radius:25px;padding:25px;box-shadow:0 30px 90px #000}.hidden{display:none!important}.creator-credit{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:45;color:#9eabc2;font-size:12px;font-weight:800;letter-spacing:.2px;text-align:center;white-space:nowrap;text-shadow:0 2px 10px #000}.tv .creator-credit{font-size:clamp(12px,1vw,18px);bottom:14px}

.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 0,#202b4a 0,#090d18 48%,#05070d 100%);padding:1.5vw}.tv{width:min(1840px,98vw);height:min(100vh,1040px);display:flex;align-items:center}.tv .card{width:100%;padding:1.55vw;border-radius:32px;background:linear-gradient(180deg,#0d1629f5,#070c17fa);border-color:#3b4865;box-shadow:0 0 45px #0009}.tv .broadcastHeader{display:flex;align-items:center;justify-content:space-between;gap:20px}.tv .broadcastTitle{font-size:clamp(24px,2.4vw,46px);font-weight:1000}.tv .roundBadge{font-size:clamp(18px,1.5vw,28px);padding:10px 18px}.tv .tvTeams{display:grid;grid-template-columns:1fr 1fr;gap:1.2vw;margin:1.2vw 0}.tv .tvTeam{padding:.72vw 1vw;border-radius:22px;border:2px solid #35415b;display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:18px;min-height:82px}.tv .tvTeam.a{border-color:#8b3040;background:linear-gradient(90deg,#24131a,#111a2b)}.tv .tvTeam.b{border-color:#2e65aa;background:linear-gradient(90deg,#111a2b,#10182a)}.tv .tvTeamName{font-size:clamp(22px,2vw,38px);font-weight:1000}.buzzerPlayer{display:inline-flex;align-items:center;margin-inline-start:12px;padding:7px 12px;border-radius:12px;background:#fff1;border:1px solid #ffffff44;font-size:clamp(14px,1.1vw,22px);animation:buzzIn .35s ease-out}.tvTeam.a .buzzerPlayer{background:#7f243355}.tvTeam.b .buzzerPlayer{background:#245b9c55}@keyframes buzzIn{from{opacity:0;transform:translateX(12px) scale(.9)}to{opacity:1;transform:none}}.tv .tvScore{font-size:clamp(48px,5vw,90px);font-weight:1000;line-height:1}.tv .tvStrikes{font-size:clamp(22px,2vw,34px);letter-spacing:5px;display:inline-flex;gap:7px;direction:ltr;align-items:center}.strike-slot{display:inline-grid;place-items:center;width:1em;height:1em}.strike-fly{position:fixed;z-index:96;pointer-events:none;font-size:clamp(130px,22vw,360px);font-weight:1000;line-height:1;color:#ff4052;text-shadow:0 0 18px #fff,0 0 45px #ff1f3d,0 0 100px # .buzzer{display:block;width:min(68vw,360px);height:min(68vw,360px);aspect-ratio:1;border:0;border-radius:50%;margin:28px auto 8px;background:radial-gradient(circle at 50% 35%,#ff6b79,var(--red) 45%,#a71f31);color:#fff;font-size:52px;font-weight:1000;box-shadow:0 15px 0 #791827,0 30px 60px #0009;cursor:pointer;transition:.15s}.buzzer:active{transform:translateY(10px);box-shadow:0 5px 0 #791827}.buzzer:disabled{background:#3a4251;box-shadow:none;cursor:not-allowed}

.tv .tvTeamName{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.buzzerPlayer{white-space:nowrap}.playerActions{text-align:center}.doubleBadge{animation:none}.doubleStorm{position:fixed;inset:0;z-index:120;pointer-events:none;overflow:hidden;background:#ffffff;animation:stormFlash 1.25s steps(1,end) forwards}.doubleStorm::before,.doubleStorm::after{content:"";position:absolute;inset:-20%;background:repeating-linear-gradient(120deg,transparent 0 18%,#fff 19% 19.7%,transparent 20% 35%);opacity:.85;animation:stormBolts .45s steps(2,end) 2}.doubleStorm::after{transform:rotate(180deg);animation-delay:.12s}.stormTitle{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:clamp(58px,13vw,190px);font-weight:1000;color:#fff;text-shadow:0 0 18px #ffe66d,0 0 55px #ff7b00,0 0 100px #000;animation:stormTitle 1.05s ease-out forwards}.stormTitle small{display:block;font-size:.28em;margin-top:12px}@keyframes stormFlash{0%,100%{opacity:0}8%{opacity:1;background:#fff}14%{opacity:.18;background:#ffe98a}21%{opacity:1;background:#fff}30%{opacity:.08;background:#fff}43%{opacity:1;background:#fff6a0}55%{opacity:.06;background:#fff}100%{opacity:0}}@keyframes stormBolts{0%{opacity:0;transform:scale(.8) rotate(0)}25%{opacity:1}50%{opacity:.1}75%{opacity:1}100%{opacity:0;transform:scale(1.1) rotate(8deg)}}@keyframes stormTitle{0%{opacity:0;transform:scale(.45)}18%{opacity:1;transform:scale(1.08)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.15)}}@media(max-width:900px){.grid,.grid3,.teams,.answers{grid-template-columns:1fr}.shell{padding:12px}.hero{padding:36px 18px}.buzzer{height:200px;font-size:42px}.tv{padding:0;height:auto}.tv .tvTeams{gap:8px}.tv .tvTeam{grid-template-columns:1fr auto;min-height:78px}.tv .tvStrikes{grid-column:1/-1}.tv .answers{grid-template-columns:1fr 1fr}.tv .answer{min-height:86px}.qr{width:145px;height:145px}}

/* Family Feud player mode — mobile reference design */
.ff-player-page{min-height:100vh;background:radial-gradient(circle at 50% -10%,#18243f 0,#080d18 44%,#05070d 100%);padding:14px 12px 36px}
.ff-player-wrap{width:min(720px,100%);margin:0 auto}
.ff-player-teams{display:grid;grid-template-columns:1fr 1fr;gap:10px;direction:rtl}
.ff-team{min-width:0;min-height:330px;border-radius:27px;padding:18px 14px 14px;background:linear-gradient(160deg,#111a2d,#0b1220 72%);border:2px solid #31415e;box-shadow:0 12px 30px #0006;display:flex;flex-direction:column}
.ff-team.red-team{border-color:#9b3147;background:linear-gradient(160deg,#141a2a,#17101a 88%)}
.ff-team.blue-team{border-color:#2874cf;background:linear-gradient(160deg,#121b2d,#0b1425 88%)}
.ff-team-head{display:flex;align-items:center;justify-content:flex-start;gap:7px;font-size:22px;font-weight:1000;white-space:nowrap}
.ff-team-dot{font-size:25px;line-height:1}
.ff-team-score{font-size:72px;line-height:.95;font-weight:1000;margin:20px 0 3px;text-align:left;direction:ltr}
.ff-team-sub{color:#a8b2c5;font-size:14px;text-align:right;min-height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ff-team-strikes{display:flex;direction:ltr;gap:8px;margin-top:auto;margin-bottom:18px}
.ff-strike-dot{width:16px;height:16px;border-radius:50%;border:2px solid #edf2fa;display:block;opacity:.95}
.ff-strike-dot.hit{background:#f04556;border-color:#f04556;box-shadow:0 0 13px #f0455666}
.ff-team-actions{display:grid;grid-template-columns:1fr 1.15fr;gap:9px;direction:rtl}
.ff-mini-btn{height:52px;border-radius:17px;border:1px solid #3a4968;background:#17223a;color:#eef3ff;font:inherit;font-size:16px;font-weight:1000;display:flex;align-items:center;justify-content:center;gap:4px;box-shadow:0 8px 20px #0004}
.ff-mini-btn.strike-btn{background:linear-gradient(135deg,#a52c3e,#7e2131);border-color:#bd3b4d}
.ff-mini-btn.used{opacity:.46;filter:saturate(.55)}
.ff-question-card{margin-top:10px;border:2px solid #33435f;border-radius:27px;background:linear-gradient(160deg,#0d1628,#080f1d);box-shadow:0 14px 35px #0006;padding:22px 16px 20px;text-align:center}
.ff-question-label{color:#9ba8bd;font-size:17px;font-weight:800;margin-bottom:16px}
.ff-question-text{font-size:clamp(29px,7.4vw,48px);line-height:1.28;font-weight:1000;margin:0 auto 25px;max-width:650px;min-height:76px;display:flex;align-items:center;justify-content:center}
.ff-answer-choice-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;direction:rtl}
.ff-answer-choice{min-height:112px;border:0;border-radius:24px;padding:12px 8px;font:inherit;font-weight:1000;font-size:19px;line-height:1.25;box-shadow:0 10px 25px #0005;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:.16s transform,.16s filter}
.ff-answer-choice:active{transform:scale(.98)}
.ff-answer-choice.normal{background:linear-gradient(145deg,#ffe88a,#d9ad39);color:#251b07}
.ff-answer-choice.double{background:linear-gradient(145deg,#ffcf4a,#ff981b);color:#251604}
.ff-answer-choice:disabled{opacity:.42;cursor:not-allowed;transform:none;filter:grayscale(.25)}
.ff-choice-time{font-size:14px;font-weight:800;opacity:.8}
.ff-answer-status{margin-top:12px;min-height:78px;border-radius:20px;background:#131f34;border:1px solid #465979;display:flex;align-items:center;justify-content:center;gap:14px;padding:10px 14px}
.ff-answer-status-text{font-size:19px;font-weight:1000}
.ff-answer-timer{width:55px;height:55px;min-width:55px;border-radius:50%;display:grid;place-items:center;background:#8f293b;border:2px solid #e25567;color:#fff;font-size:24px;font-weight:1000;box-shadow:0 0 20px #d7374e33}
.ff-answer-editor{margin-top:12px;display:grid;grid-template-columns:1fr auto;gap:8px;direction:rtl}
.ff-answer-editor .input{margin:0;height:58px;border-radius:18px;font-size:19px;text-align:right}
.ff-send{min-width:116px;border:0;border-radius:18px;background:linear-gradient(135deg,#765cff,#5543e7);color:#fff;font:inherit;font-weight:1000}
.ff-feedback{min-height:28px;margin-top:9px;font-weight:900;font-size:14px}
.ff-feedback.good{color:#54e2ad}.ff-feedback.bad{color:#ff6576}
.ff-answers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;direction:rtl}
.ff-answer-card{min-height:154px;border-radius:23px;border:2px solid #33435f;background:radial-gradient(circle at 50% 35%,#1a2a48,#101a2c);box-shadow:0 10px 25px #0005;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;position:relative}
.ff-answer-num{position:absolute;top:10px;right:12px;width:38px;height:38px;border-radius:50%;background:#20304d;color:#aeb9ca;display:grid;place-items:center;font-weight:1000}
.ff-answer-mark{font-size:30px;font-weight:1000;margin-top:4px}
.ff-answer-hidden{color:#a9b4c7;font-size:18px;font-weight:900;margin-top:5px}
.ff-reveal{margin-top:10px;border:0;border-radius:999px;background:linear-gradient(135deg,#ee4255,#b82338);color:#fff;font:inherit;font-size:13px;font-weight:1000;padding:9px 18px;cursor:pointer}
.ff-revealed-text{font-size:18px;font-weight:1000;text-align:center}.ff-revealed-points{color:#ffd35c;font-weight:1000;margin-top:5px}
.ff-players-card{margin-top:10px;border-top:1px solid #273650;padding-top:18px}
.ff-players-title{text-align:center;font-size:25px;font-weight:1000;margin:8px 0 15px}
.ff-player-list{display:grid;gap:10px}
.ff-player-item{background:#111a2c;border:1px solid #2c3b57;border-radius:20px;padding:19px 17px;text-align:right}
.ff-player-item strong{display:block;font-size:19px}.ff-player-item span{display:block;color:#a8b2c5;margin-top:7px}
.ff-lobby-actions{display:flex;justify-content:center;margin:18px 0 0}.ff-start{min-width:270px;height:60px;border:0;border-radius:20px;background:linear-gradient(135deg,#ffe38a,#d9a52f);color:#211804;font:inherit;font-size:18px;font-weight:1000;box-shadow:0 10px 30px #d9a52f22}
.ff-secondary{display:flex;justify-content:center;margin-top:10px}.ff-secondary .btn{background:#1a2338;color:#fff}
.ff-room-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.ff-room-head .pill{background:#111b2d;border-color:#2d3c58}
.ff-locked{opacity:.55;pointer-events:none}
@media(max-width:520px){.ff-player-page{padding:8px 10px 28px}.ff-team{min-height:314px;padding:16px 12px 13px}.ff-team-head{font-size:19px}.ff-team-score{font-size:66px}.ff-mini-btn{height:49px;font-size:15px}.ff-question-card{padding:20px 13px 17px}.ff-question-text{font-size:29px;min-height:92px}.ff-answer-choice{min-height:103px;font-size:17px}.ff-answer-choice-row{gap:8px}.ff-answers{gap:8px}.ff-answer-card{min-height:145px}.ff-answer-editor{grid-template-columns:1fr}.ff-send{height:54px}.ff-answer-status-text{font-size:17px}}
.ff-answer-fx{position:fixed;left:50%;top:18%;z-index:200;transform:translate(-50%,-20px) scale(.92);opacity:0;display:flex;align-items:center;gap:12px;padding:14px 20px;border-radius:20px;background:rgba(9,15,28,.96);border:1px solid #4b5f85;box-shadow:0 20px 60px #0009;color:#fff;pointer-events:none;transition:.25s ease}.ff-answer-fx.show{opacity:1;transform:translate(-50%,0) scale(1)}.ff-answer-fx.start{border-color:#ffd45c;box-shadow:0 0 35px #ffd45c22,0 20px 60px #0009}.ff-answer-fx.correct{border-color:#48e0a2;box-shadow:0 0 35px #48e0a233,0 20px 60px #0009}.ff-answer-fx.wrong,.ff-answer-fx.timeout{border-color:#e65367;box-shadow:0 0 35px #e6536722,0 20px 60px #0009}.ff-answer-fx .fxIcon{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:#1b2943;font-size:25px}.ff-answer-fx b{display:block;font-size:17px}.ff-answer-fx small{display:block;color:#aeb9cb;font-size:11px;margin-top:3px}@media(max-width:520px){.ff-answer-fx{top:11%;width:calc(100vw - 28px);justify-content:center;padding:12px 14px}.ff-answer-fx b{font-size:15px}}</style></head><body><div id="toast" class="toast"></div><main id="app" class="app"></main><div class="creator-credit">تم إنشاء اللعبة من قبل أغيد</div><script>
const socket=io();let code='',playerTeam='',playerName='',lastState=null,soundOn=true,audioCtx=null,bankSearch='',answerRequestPending=false;
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function tone(freq=440,d=.16,type='sine',gain=.14){if(!soundOn)return;audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(gain,audioCtx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d+.02)}
function fanfare(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.24,'triangle',.12),i*110))}function revealSound(){[330,440,554,660].forEach((f,i)=>setTimeout(()=>tone(f,.16,'triangle',.10),i*65))}function awardSound(){[392,523,659,784].forEach((f,i)=>setTimeout(()=>tone(f,.18,'triangle',.11),i*75))}function answerStartSound(){[440,554,659].forEach((f,i)=>setTimeout(()=>tone(f,.12,'sine',.09),i*65))}function answerTickSound(){tone(760,.05,'square',.045)}function wrongSound(){[190,145].forEach((f,i)=>setTimeout(()=>tone(f,.16,'sawtooth',.11),i*90))}function timeoutSound(){[300,220,150].forEach((f,i)=>setTimeout(()=>tone(f,.14,'triangle',.09),i*75))}function clickSound(){tone(330,.07,'square',.06)}function toggleSound(){soundOn=!soundOn;toast(soundOn?'🔊 المؤثرات مفعلة':'🔇 المؤثرات مكتومة');if(soundOn)tone(660,.12,'triangle')}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('show'),2400)}
function answerFX(kind,name){const old=document.querySelector('.ff-answer-fx');old?.remove();const el=document.createElement('div');el.className='ff-answer-fx '+kind;el.innerHTML=kind==='start'?`<div class="fxIcon">✍️</div><div><b>${esc(name||'اللاعب')} يجاوب الآن</b><small>لديه 10 ثواني فقط</small></div>`:kind==='correct'?`<div class="fxIcon">✓</div><div><b>إجابة صحيحة!</b></div>`:kind==='wrong'?`<div class="fxIcon">✕</div><div><b>إجابة خاطئة</b></div>`:`<div class="fxIcon">⏱</div><div><b>انتهى الوقت</b></div>`;document.body.appendChild(el);setTimeout(()=>el.classList.add('show'),10);setTimeout(()=>el.remove(),kind==='start'?1500:1200)}
function logo(){return `<div class="brand"><div class="mark">🏆</div><div><div>لعبة العائلة</div><div class="muted" style="font-size:11px">FAMILY FEUD • PLAYER ONLY</div></div></div>`}
function modal(html){let m=document.createElement('div');m.id='modal';m.className='modal';m.innerHTML=`<div class="modalBox">${html}</div>`;document.body.appendChild(m)}function closeModal(){$('modal')?.remove()}
function home(){app.innerHTML=`<div class="shell"><div class="topbar">${logo()}<button class="btn dark" onclick="toggleSound()">🔊 الصوت</button></div><section class="card hero"><div class="pill">📱 شاشة واحدة للجميع</div><h1>لعبة العائلة</h1><p class="sub">نفس أسلوب Family Feud — بدون مقدم وبدون شاشة عرض. كل اللاعبين يدخلون من نفس الصفحة، وكل شيء يظهر لهم مباشرة.</p><div class="grid" style="margin-top:28px"><button class="btn primary" onclick="showCreate()">✨ إنشاء لعبة</button><button class="btn red" onclick="showJoin()">🎮 دخول لعبة</button><button class="btn dark" onclick="showHow()">❓ طريقة اللعب</button></div></section></div>`}
function showHow(){modal(`<h2>🎬 طريقة اللعب</h2><p class="muted">أنشئوا الغرفة، اختاروا الفريقين، ثم كل لاعب يدخل من جواله. أي لاعب يستطيع بدء السؤال، وكتابة الإجابة مباشرة من جواله. إذا كانت الإجابة صحيحة تُكشف وتُحتسب نقاطها فورًا للفريق، وإذا كانت خاطئة تُحسب Strike. يمكن أيضًا كشف الإجابات يدويًا والانتقال للسؤال التالي. لا توجد صفحة مقدم ولا شاشة عرض منفصلة.</p><button class="btn primary" onclick="closeModal()">فهمت</button>`)}
function showCreate(){app.innerHTML=`<div class="shell"><div class="topbar">${logo()}<button class="btn dark" onclick="home()">الرئيسية</button></div><section class="card"><h1>✨ إنشاء لعبة</h1><div class="grid"><div><label class="label">اسمك</label><input class="input" id="pn" placeholder="اكتب اسمك" autofocus></div><div><label class="label">عدد الجولات</label><input class="input" id="rounds" type="number" min="1" max="50" value="5"></div><div><label class="label">اسم الفريق الأحمر</label><input class="input" id="ta" value="الفريق الأحمر"></div><div><label class="label">اسم الفريق الأزرق</label><input class="input" id="tb" value="الفريق الأزرق"></div></div><label class="label">فريقك</label><select id="pt"><option value="A">🔴 الفريق الأحمر</option><option value="B">🔵 الفريق الأزرق</option></select><button class="btn primary" style="width:100%;margin-top:10px" onclick="createGame()">🚀 إنشاء اللعبة</button></section></div>`}
function showJoin(pref=''){app.innerHTML=`<div class="shell"><div class="topbar">${logo()}<button class="btn dark" onclick="home()">الرئيسية</button></div><section class="card"><h1>🎮 دخول اللعبة</h1><input class="input" id="pc" placeholder="رمز الغرفة (4 أرقام)" inputmode="numeric" maxlength="4" value="${esc(pref)}"><button class="btn dark" onclick="lookupTeams()">تحميل أسماء الفرق</button><input class="input" id="pn" placeholder="اسمك"><select id="pt"><option value="A">🔴 الفريق الأحمر</option><option value="B">🔵 الفريق الأزرق</option></select><button class="btn red" style="width:100%" onclick="joinGame()">دخول اللعبة 🚀</button></section></div>`}
function createGame(){const name=$('pn').value.trim(),rounds=+$('rounds').value||5,team=$('pt').value;if(!name)return toast('اكتب اسمك');clickSound();socket.emit('player:create',{name,rounds,team,teamA:$('ta').value,teamB:$('tb').value})}
function lookupTeams(){const c=$('pc').value.trim();if(!/^(?:\d{4}|A3\d{2})$/.test(c))return toast('رمز الغرفة غير صحيح');code=c;socket.emit('player:lookup',{code:c})}
function joinGame(){const c=$('pc').value.trim(),name=$('pn').value.trim(),team=$('pt').value;if(!/^(?:\d{4}|A3\d{2})$/.test(c))return toast('رمز الغرفة غير صحيح');if(!name)return toast('اكتب اسمك');code=c;playerName=name;playerTeam=team;history.replaceState({},'',`/games/family-feud/players?code=${encodeURIComponent(c)}&team=${encodeURIComponent(team)}`);socket.emit('player:join',{code:c,name,team})}
function renderGame(s){
 lastState=s;
 const myPlayer=s.myPlayerId||null;
 const me=s.teams.find(t=>t.id===playerTeam);
 const myTeam=me?.id||playerTeam;
 const canStart=s.currentRound<s.rounds&&s.phase!=='finished'&&(s.questionBank||[]).length;
 const active=s.answerLock;
 const iAmAnswering=!!active&&active.playerId===myPlayer;
 const winner=s.phase==='finished'?(s.teams[0].score===s.teams[1].score?'تعادل!':s.teams[0].score>s.teams[1].score?s.teams[0].name:s.teams[1].name):'';
 const teamHtml=(t,cls)=>{const own=t.id===myTeam;const canDouble=own&&!t.doubleUsed&&!active&&s.phase==='question'&&t.strikes<3;return `<div class="ff-team ${cls}">
   <div class="ff-team-head"><span class="ff-team-dot">${t.id==='A'?'🔴':'🔵'}</span><span>${esc(t.name)}</span></div>
   <div class="ff-team-score">${t.score}</div>
   <div class="ff-team-sub">${t.players.map(p=>esc(p.name)).join(' • ')||'لا يوجد متسابقون'}</div>
   <div class="ff-team-strikes">${[0,1,2].map(i=>`<span class="ff-strike-dot ${i<t.strikes?'hit':''}"></span>`).join('')}</div>
   <div class="ff-team-actions">
     <button class="ff-mini-btn ${t.doubleUsed||!own?'used':''}" ${canDouble?'':'disabled'} onclick="answerReady('double')">${t.doubleUsed?'⚡ الدبل مستخدم':'⚡ الدبل متاح'}</button>
     <button class="ff-mini-btn strike-btn" onclick="strike('${t.id}')" ${s.phase==='question'&&!active?'':'disabled'}>Strike</button>
   </div>
 </div>`};
 const choices=(s.answers||[]).map((a,i)=>`<div class="ff-answer-card">
   <span class="ff-answer-num">${i+1}</span>
   ${a.revealed?`<div class="ff-revealed-text">${esc(a.text)}</div><div class="ff-revealed-points">${a.points} نقطة</div>`:`<div class="ff-answer-mark">؟</div><div class="ff-answer-hidden">مخفية 🔒</div><button class="ff-reveal" onclick="reveal(${i})">كشف 👁️</button>`}
 </div>`).join('');
 const canAnswer=s.phase==='question'&&!active&&me&&me.strikes<3&&!answerRequestPending;
 const doubleAvailable=!!me&&!me.doubleUsed&&me.strikes<3;
 app.innerHTML=`<main class="ff-player-page"><div class="ff-player-wrap">
   <section class="ff-player-teams">${teamHtml(s.teams.find(t=>t.id==='A'),'red-team')}${teamHtml(s.teams.find(t=>t.id==='B'),'blue-team')}</section>
   <section class="ff-question-card">
     <div class="ff-question-label">السؤال 🎯</div>
     <div class="ff-question-text">${esc(s.question||'جاهزين؟ ابدأوا بسؤال عشوائي.')}</div>
     ${s.phase==='lobby'&&canStart?`<div class="ff-lobby-actions"><button class="ff-start" onclick="startRandom()">🎲 ابدأ بسؤال عشوائي</button></div>`:''}
     ${canAnswer?`<div class="ff-answer-choice-row">
       <button class="ff-answer-choice double" onclick="answerReady('double')" ${doubleAvailable?'':'disabled'}>⚡ دبل + إجابة<div class="ff-choice-time">10 ثواني • مرة واحدة</div></button>
       <button class="ff-answer-choice normal" onclick="answerReady('normal')">✍️ أجاوب كتابيًا<div class="ff-choice-time">10 ثواني</div></button>
     </div>`:''}
     ${active?`<div class="ff-answer-status"><div class="ff-answer-status-text">✍️ ${esc(active.name)} يجاوب الآن${active.mode==='double'?' — ⚡ دبل':''}</div><div class="ff-answer-timer" id="answerTimer">${Math.max(0,Math.ceil((active.until-Date.now())/1000))}</div></div>`:''}
     ${iAmAnswering?`<div class="ff-answer-editor"><input class="input" id="answerInput" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" inputmode="text" placeholder="اكتب إجابتك هنا..." maxlength="120" onkeydown="if(event.key==='Enter'){event.preventDefault();submitAnswer()}"><button class="ff-send" onclick="submitAnswer()">إرسال 🚀</button></div>`:''}
     <div id="answerFeedback" class="ff-feedback"></div>
     ${s.phase==='question'&&s.currentRound<s.rounds?`<div class="ff-secondary"><button class="btn" onclick="nextQuestion()">⏭️ السؤال التالي</button></div>`:''}
   </section>
   ${s.phase==='question'||s.phase==='finished'?`<section class="ff-answers">${choices}</section>`:''}
   ${winner?`<section class="ff-question-card"><div class="ff-question-text">🎉 ${esc(winner)} 🎉</div></section>`:''}
   ${s.phase==='lobby'?`<section class="ff-players-card"><div class="ff-players-title">👥 اللاعبين</div><div class="ff-player-list">${s.teams.map(t=>`<div class="ff-player-item"><strong>${t.id==='A'?'🔴':'🔵'} ${esc(t.name)}</strong><span>${t.players.map(p=>esc(p.name)).join(' • ')||'لا يوجد'}</span></div>`).join('')}</div></section>`:''}
 </div></main>`;
 if(active)startAnswerTimer(active.until);
}
function teamCard(t){return ''}
function startRandom(){const bank=lastState.questionBank||[];let choices=bank.map((_,i)=>i).filter(i=>i!==lastState.questionIndex);if(!choices.length)choices=[0];socket.emit('player:startRound',{code,questionIndex:choices[Math.floor(Math.random()*choices.length)]})}
function answerReady(mode='normal'){if(lastState?.answerLock||answerRequestPending)return;answerRequestPending=true;clickSound();renderGame(lastState);socket.emit('player:answerReady',{code,mode})}function startAnswerTimer(until){clearInterval(window.answerTimerTick);const tick=()=>{const el=$('answerTimer');if(!el)return;const sec=Math.max(0,Math.ceil((until-Date.now())/1000));el.textContent=sec;if(sec<=0)clearInterval(window.answerTimerTick)};tick();window.answerTimerTick=setInterval(tick,100)}function submitAnswer(){const el=$('answerInput');const text=el?.value.trim();if(!text)return toast('اكتب إجابتك أولاً');el.blur();socket.emit('player:submitAnswer',{code,answer:text})}function nextQuestion(){socket.emit('player:nextQuestion',{code})}function reveal(i){revealSound();socket.emit('player:reveal',{code,index:i})}function awardAnswer(index,team){awardSound();socket.emit('player:award',{code,team,answerIndex:index})}function strike(team){tone(120,.35,'sawtooth',.18);socket.emit('player:strike',{code,team})}function resetStrike(team){socket.emit('player:resetStrikes',{code,team})}function resetScores(){if(confirm('تصفير النقاط؟'))socket.emit('player:resetScores',{code})}function endGame(){if(confirm('إنهاء اللعبة؟'))socket.emit('player:end',{code})}
function shareCode(){modal(`<h2>📤 مشاركة اللعبة</h2><p>رمز الغرفة:</p><div style="font-size:52px;font-weight:1000;letter-spacing:8px;text-align:center">${esc(code)}</div><p class="muted">أرسل الرمز للاعبين الآخرين، وكل واحد يدخل من نفس الصفحة.</p><button class="btn primary" onclick="closeModal()">إغلاق</button>`)}
socket.on('game:created',x=>{code=x.code;playerTeam=x.team;playerName=x.name;sessionToken=x.sessionToken||'';try{localStorage.setItem('saha.ff.player.session',JSON.stringify({code,token:sessionToken,name:playerName,team:playerTeam}))}catch(e){};history.replaceState({},'',`/games/family-feud/players?code=${encodeURIComponent(code)}&team=${encodeURIComponent(playerTeam)}&sessionToken=${encodeURIComponent(x.sessionToken||'')}`);toast('تم إنشاء الغرفة '+code);setTimeout(()=>{},0)});socket.on('player:teams',teams=>{const sel=$('pt');if(sel){sel.innerHTML=teams.map(t=>`<option value="${t.id}">${t.id==='A'?'🔴':'🔵'} ${esc(t.name)}</option>`).join('');toast('تم تحميل أسماء الفرق')}});socket.on('player:joined',x=>{playerTeam=x.team;playerName=x.name;toast('مرحبًا '+x.name)});socket.on('double:activated',()=>{tone(660,.5,'triangle',.18)});socket.on('buzzer:locked',()=>{tone(880,.35,'square',.18)});socket.on('answer:ready',x=>{answerRequestPending=false;answerStartSound();answerFX('start',x.name);if(x.playerId===lastState?.myPlayerId){setTimeout(()=>{const el=$('answerInput');if(el){el.focus();try{el.click()}catch(e){}}},30)}startAnswerTimer(x.until)});socket.on('answer:denied',x=>{answerRequestPending=false;toast('🔒 '+(x?.message||'هذا الدور محجوز'));if(lastState)renderGame(lastState)});socket.on('answer:timeout',()=>{answerRequestPending=false;clearInterval(window.answerTimerTick);timeoutSound();answerFX('timeout');const fb=$('answerFeedback');if(fb){fb.className='answerFeedback bad';fb.textContent='⏱️ انتهت الـ10 ثواني — الدور متاح من جديد'};if(lastState)renderGame(lastState)});socket.on('answer:correct',x=>{answerRequestPending=false;clearInterval(window.answerTimerTick);awardSound();answerFX('correct');const el=$('answerInput'),fb=$('answerFeedback');if(fb)fb.className='answerFeedback good';if(fb)fb.textContent=x.smart?`🧠 صح! اعتبرناها نفس المعنى — +${x.points} نقطة`:`✅ إجابة صحيحة — +${x.points} نقطة`;if(el)el.value=''});socket.on('answer:wrong',x=>{answerRequestPending=false;clearInterval(window.answerTimerTick);wrongSound();answerFX('wrong');const fb=$('answerFeedback');if(fb)fb.className='answerFeedback bad';if(fb)fb.textContent=`❌ ليست ضمن الإجابات — Strike ${x.strikes}/3`});socket.on('answer:result',x=>{answerRequestPending=false;toast('⚠️ '+x.message);if(lastState)renderGame(lastState)});socket.on('state',s=>{if(s.phase==='finished'&&lastState?.phase!=='finished')fanfare();const preserve=s.answerLock&&s.answerLock.playerId===s.myPlayerId&&document.getElementById('answerInput');lastState=s;if(preserve){preserve.focus();return}if(!s.answerLock)answerRequestPending=false;renderGame(s)});socket.on('error:msg',m=>toast('⚠️ '+m));socket.on('connect',()=>{try{const q=new URLSearchParams(location.search),tok=q.get('sessionToken')||sessionToken;if(q.get('code')&&tok){code=q.get('code').toUpperCase();sessionToken=tok;socket.emit('room:resume',{code,sessionToken,name:playerName||q.get('name')||'',team:playerTeam||q.get('team')||'A'});}}catch(e){}});
const params=new URLSearchParams(location.search);const join=params.get('join')||'';const startCode=(params.get('code')||'').toUpperCase();if(startCode){code=startCode;playerTeam=params.get('team')||'A';playerName=params.get('name')||'لاعب';sessionToken=params.get('sessionToken')||'';if(sessionToken)socket.emit('room:resume',{code,sessionToken,name:playerName,team:playerTeam});else{app.innerHTML='<div class="shell"><section class="card hero"><h1>جاري دخول اللعبة…</h1><p class="muted">'+esc(code)+'</p></section></div>';socket.emit('player:join',{code,name:playerName,team:playerTeam})}}else if(join)showJoin(join);else home();socket.on('champion:return',x=>{if(x?.code)location.href='/games/champion/?code='+encodeURIComponent(x.code)+'&sessionToken='+encodeURIComponent(x.sessionToken||'')+'&name='+encodeURIComponent(x.name||playerName||'لاعب')});
</script></body></html>
