<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family Feud • اللاعبين</title><link rel="stylesheet" href="/games/family-feud/family-feud.css"><script src="/socket.io/socket.io.js"></script></head><body><main class="wrap"><div id="app" class="card"><div class="center"><h1>👥 Family Feud</h1><input id="codeIn" class="input" maxlength="4" placeholder="رمز الغرفة"><input id="nameIn" class="input" maxlength="24" placeholder="اسم اللاعب"><select id="teamIn" class="input"><option value="A">🔴 الفريق الأحمر</option><option value="B">🔵 الفريق الأزرق</option></select><div class="row"><button class="btn primary" onclick="joinPlayer()">دخول الغرفة</button><button class="btn gold" onclick="createPlayersRoom()">إنشاء غرفة لاعبين</button></div></div></div><div id="toast" class="buzzNotice hiddenEl"></div></main><script src="/games/family-feud/family-feud.js"></script><script>role='player';function ffSaved(){try{return JSON.parse(localStorage.getItem('arena.ff.session')||'null')}catch(e){return null}}function ffJoin(){const c=document.getElementById('codeIn').value.trim().toUpperCase(),n=document.getElementById('nameIn').value.trim()||'لاعب',t=document.getElementById('teamIn').value;if(!/^A[1-3]\d{2}$/.test(c))return toast('أدخل كود Family Feud صحيح');const saved=ffSaved();socket.emit('room:join',{code:c,name:n,team:t,sessionToken:saved?.code===c?saved.token:''})}function createPlayersRoom(){const n=document.getElementById('nameIn').value.trim();if(!n){toast('اكتب اسمك أولًا');document.getElementById('nameIn').focus();return}socket.emit('room:create',{game:'family',mode:'3',rounds:Math.max(5,Math.min(20,Number(qp.get('rounds'))||5)),name:n,team:document.getElementById('teamIn').value})}const qp=new URLSearchParams(location.search);const qc=(qp.get('code')||'').toUpperCase();if(qc){document.getElementById('codeIn').value=qc;document.getElementById('nameIn').value=qp.get('name')||'';if(qp.get('team'))document.getElementById('teamIn').value=qp.get('team');const saved=ffSaved();if(saved?.code===qc&&saved.token){code=qc;sessionToken=saved.token;socket.emit('room:resume',{code,sessionToken})}else if(qp.get('name')){setTimeout(ffJoin,80)}}else if(qp.get('new')==='1'){document.getElementById('nameIn').focus();}</script></body></html>
