<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family Feud • الشاشة</title><link rel="stylesheet" href="/games/family-feud/family-feud.css"><script src="/socket.io/socket.io.js"></script></head><body><main class="wrap"><div id="app" class="card"><div class="center"><h1>🖥️ شاشة العرض</h1><input id="codeIn" class="input" maxlength="4" placeholder="رمز الغرفة"><button class="btn primary" style="width:100%" onclick="joinDisplay()">تشغيل الشاشة</button></div></div><div id="toast" class="buzzNotice hiddenEl"></div></main><script src="/games/family-feud/family-feud.js"></script><script>role='display';function joinDisplay(){const c=document.getElementById('codeIn').value.trim().toUpperCase();if(!/^A[1-2]\d{2}$/.test(c))return toast('أدخل كود غرفة تحتوي على شاشة');socket.emit('room:display',{code:c})}if(qs.get('code')){const c=qs.get('code').toUpperCase();if(/^A[1-2]\d{2}$/.test(c))socket.emit('room:display',{code:c});else document.getElementById('codeIn').value=c}</script></body></html>
