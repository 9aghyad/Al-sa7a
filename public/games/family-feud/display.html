<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family Feud • الشاشة</title><link rel="stylesheet" href="/games/family-feud/family-feud.css"><script src="/socket.io/socket.io.js"></script></head><body><main class="wrap"><div id="app" class="card"><div class="center"><h1>🖥️ شاشة العرض</h1><input id="codeIn" class="input" maxlength="5" placeholder="رمز الغرفة A101 / A201 / A301"><button class="btn primary" style="width:100%" onclick="joinDisplay()">تشغيل الشاشة</button></div></div><div id="toast" class="buzzNotice hiddenEl"></div></main><script src="/games/family-feud/family-feud.js"></script><script>role='display';function joinDisplay(){const c=document.getElementById('codeIn').value.trim().toUpperCase();if(!/^A[1-3]\d{2}$/.test(c))return toast('رمز Family Feud يبدأ بحرف A');socket.emit('room:display',{code:c})}if(qs.get('code'))socket.emit('room:display',{code:qs.get('code').toUpperCase()});</script></body></html>
