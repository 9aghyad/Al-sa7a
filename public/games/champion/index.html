<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بطل الساحة</title><script src="/socket.io/socket.io.js"></script><script src="/shared/room-lobby.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#4d3b92,#101426 45%,#06070d);color:#fff;font-family:Tahoma,Arial,sans-serif}.wrap{width:min(1050px,94vw);margin:auto;padding:18px}.card{background:rgba(12,16,29,.94);border:1px solid #333c59;border-radius:28px;padding:22px;box-shadow:0 25px 90px #0008}.hero{text-align:center;padding:35px;border-radius:28px;background:radial-gradient(circle at 50% 0,#76601d,#16182b 55%,#090b13);border:1px solid #806b2c}.hero h1{font-size:clamp(42px,8vw,76px);margin:5px}.muted{color:#aeb6ca;line-height:1.8}.code{font-size:38px;letter-spacing:8px;color:#ffd95b;font-weight:1000}.input,button{font:inherit}.input{width:100%;padding:15px;border-radius:15px;border:1px solid #3a4560;background:#080d19;color:#fff}.btn{padding:13px 18px;border:0;border-radius:15px;font-weight:1000;cursor:pointer}.primary{background:#765cff;color:#fff}.gold{background:#e6b93c;color:#201700}.dark{background:#20283d;color:#fff}.danger{background:#8c2e40;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.game{padding:16px;border:2px solid #303b59;border-radius:18px;background:#111829;cursor:pointer}.game.sel{border-color:#d8b83c;background:#302817;box-shadow:0 0 0 3px #d8b83c22}.players{display:grid;gap:9px}.p{display:flex;justify-content:space-between;align-items:center;padding:13px 15px;border-radius:14px;background:#151d30}.score{font-size:25px;font-weight:1000;color:#ffd85c}.rank{display:grid;gap:9px}.rank .p:nth-child(1){border:1px solid #d6b447;background:#352b14}.rank .p:nth-child(2){border:1px solid #8e98aa}.rank .p:nth-child(3){border:1px solid #a47751}.podium{display:flex;align-items:end;justify-content:center;gap:10px;min-height:230px}.place{width:30%;text-align:center;padding:18px;border-radius:18px 18px 6px 6px;background:#171d2e}.place.one{height:210px;background:#443613}.place.two{height:165px}.place.three{height:130px;background:#32261e}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions>*{flex:1;min-width:140px}.notice{padding:14px;border-radius:16px;background:#11192a;border:1px solid #303b57;line-height:1.7}.small{font-size:12px;color:#9ca7bd}@media(max-width:560px){.wrap{padding:10px}.card{padding:15px;border-radius:22px}.hero{padding:25px 12px}.hero h1{font-size:45px}.code{font-size:30px}}
</style><link rel="stylesheet" href="/shared/connection.css"><link rel="stylesheet" href="/shared/arena-ui.css"></head><body><div id="app"></div><script>
const socket=io();let G=null,code='',token='',me=null,host=false;const gameNames={liar:'🕵️ مين الكذاب',bomb:'💣 المفخخة',faceoff:'⚔️ مواجهة',family:'👨‍👩‍👧‍👦 فاميلي فيود',guess:'🧠 خمنها',market:'🛒 السوق',mafia:'🎭 مافيا',million:'👑 المليون'};const $=id=>document.getElementById(id);function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function set(h){$('app').innerHTML='<div class="wrap">'+h+'</div>'}
function create(){const n=($('name')?.value||'').trim()||'لاعب';socket.emit('room:create',{game:'champion',mode:'players',name:n});}function join(){const c=($('joinCode')?.value||'').trim().toUpperCase();const n=($('joinName')?.value||'').trim()||'لاعب';if(!c)return;code=c;socket.emit('room:join',{code:c,name:n})}
function home(){set(`<div class="hero"><div style="font-size:70px">🏆</div><h1>بطل الساحة</h1><p class="muted">بطولة تجمع ألعاب الساحة في منافسة واحدة، بنقاط تراكمية ونهائي ومنصة تتويج.</p></div><div class="card" style="margin-top:15px"><h2>إنشاء بطولة</h2><input id="name" class="input" placeholder="اسمك في البطولة"><button class="btn primary" style="width:100%;margin-top:10px" onclick="create()">🏆 إنشاء البطولة</button><div style="height:12px"></div><h3>الانضمام</h3><input id="joinName" class="input" placeholder="اسمك"><input id="joinCode" class="input" maxlength="6" placeholder="كود البطولة"><button class="btn dark" style="width:100%" onclick="join()">🎮 انضمام</button></div>`)}
function lobby(){const games=G.selectedGames||[];set(`<div class="hero"><div style="font-size:55px">🏆</div><h1>بطل الساحة</h1><div class="code">${esc(G.code)}</div><p class="muted">شارك الكود مع اللاعبين</p><div style="text-align:center;margin:12px 0"><img src="/api/qr?code=${esc(G.code)}" style="width:min(190px,55vw);background:#fff;padding:7px;border-radius:16px" alt="QR"><div class="small">📱 امسح الرمز للانضمام</div></div></div><div class="card" style="margin-top:15px"><div class="notice">${host?'أنت المضيف. اختر الألعاب وعدد الجولات، ثم ابدأ البطولة.':'بانتظار المضيف لإعداد البطولة وبدئها.'}</div><h3>اللاعبون (${G.players.length})</h3><div class="players">${G.players.map(p=>`<div class="p"><span>${esc(p.name)} ${p.id===G.hostId?'👑':''}</span><span>${p.online===false?'⚪ غير متصل':'🟢 جاهز'}</span></div>`).join('')}</div>${host?`<h3>ألعاب البطولة</h3><div class="grid">${Object.entries(gameNames).map(([k,v])=>`<div class="game ${games.includes(k)?'sel':''}" onclick="toggleGame('${k}')">${v}</div>`).join('')}</div><h3>عدد الجولات</h3><div class="grid">${[3,5,7,8].map(n=>`<div class="game ${G.maxRounds===n?'sel':''}" onclick="socket.emit('champion:setRounds',{rounds:${n}})">${n} جولات</div>`).join('')}</div><button class="btn gold" style="width:100%;margin-top:15px" onclick="socket.emit('champion:start')">▶️ ابدأ البطولة</button>`:''}</div>`)}
function toggleGame(k){let a=[...(G.selectedGames||[])];a=a.includes(k)?a.filter(x=>x!==k):[...a,k];socket.emit('champion:setGames',{games:a})}
function round(){const current=G.selectedGames[(G.round-1)%G.selectedGames.length];const names=G.players.filter(p=>p.online!==false);const launched=!!G.currentGameCode;const route={liar:'/games/liar/',bomb:'/games/bomb/',faceoff:'/games/faceoff/players',family:'/games/family-feud/',guess:'/games/guess/',market:'/games/market/',mafia:'/games/mafia/players',million:'/games/million/'}[current]||'/';const meName=G.players.find(p=>p.id===me)?.name||'لاعب';const direct=current==='liar';set(`<div class="hero"><div style="font-size:55px">🎮</div><h1>الجولة ${G.round}</h1><p class="muted">اللعبة المختارة</p><div style="font-size:32px;font-weight:1000;color:#ffd95b">${gameNames[current]||current}</div></div><div class="card" style="margin-top:15px"><div class="notice">${launched?`تم تجهيز غرفة الجولة. الكود: <b class="code" style="font-size:26px">${esc(G.currentGameCode)}</b>`:'ابدأ غرفة اللعبة الفعلية لهذه الجولة، ثم يدخل جميع اللاعبين إليها بنفس الكود.'}</div>${host&&!launched?`<button class="btn gold" style="width:100%;margin-top:12px" onclick="socket.emit('champion:launch',{game:'${current}'})">🚀 إنشاء غرفة الجولة</button>`:''}${launched?`<div class="notice" style="margin-top:10px">${G.childReported?'✅ تم استلام نتيجة اللعبة تلقائيًا — جاري الانتقال للترتيب.':'⏳ بانتظار انتهاء لعبة الجولة. إذا كانت اللعبة تدعم النتائج التلقائية فسيتم احتسابها تلقائيًا.'}</div><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="openRoundGame()">🎮 فتح اللعبة</button><button class="btn dark" onclick="navigator.clipboard?.writeText('${G.currentGameCode}')">📋 نسخ الكود</button></div><p class="small">كل لاعب يفتح اللعبة ويدخل الكود <b>${esc(G.currentGameCode)}</b>. بعد انتهاء المباراة يعود المضيف هنا لاعتماد الترتيب.</p>`:''}</div><div class="card" style="margin-top:15px"><h3>ترتيب الجولة</h3><p class="small">${['guess','market','bomb','mafia'].includes(current)?'نتيجة هذه اللعبة تُحتسب تلقائيًا عند اكتمالها.':'بعد انتهاء المباراة اضغط اللاعبين بالترتيب: الأول ثم الثاني ثم الثالث…'}</p><div class="players">${names.map((p,i)=>`<button class="p" id="pl-${p.id}" onclick="pickPlace('${p.id}')"><span>${i+1}. ${esc(p.name)}</span><span>➕</span></button>`).join('')}</div><div id="chosen" class="notice" style="margin-top:12px">لم يتم اختيار ترتيب بعد.</div>${['guess','market','bomb','mafia'].includes(current)?'':`<button class="btn gold" style="width:100%;margin-top:12px" onclick="submitResult()">🏆 اعتماد نتيجة الجولة</button>`}</div><div class="card" style="margin-top:15px"><h3>الترتيب الحالي</h3>${ranking()}</div>`)}
function openRoundGame(){const current=G.selectedGames[(G.round-1)%G.selectedGames.length],code=G.currentGameCode,name=encodeURIComponent(meName);const routes={liar:`/games/liar/?code=${encodeURIComponent(code)}&name=${name}`,bomb:`/games/bomb/?code=${encodeURIComponent(code)}&name=${name}`,faceoff:`/games/faceoff/players?code=${encodeURIComponent(code)}&name=${name}`,family:`/games/family-feud/players?code=${encodeURIComponent(code)}&name=${name}`,guess:`/games/guess/?code=${encodeURIComponent(code)}&name=${name}`,market:`/games/market/?code=${encodeURIComponent(code)}&name=${name}`,mafia:`/games/mafia/players?code=${encodeURIComponent(code)}&name=${name}`,million:`/games/million/?code=${encodeURIComponent(code)}&name=${name}`};location.href=routes[current]||'/';}
let chosen=[];function pickPlace(id){if(chosen.includes(id))return;chosen.push(id);$('chosen').textContent=chosen.map((x,i)=>`${i+1}️⃣ ${G.players.find(p=>p.id===x)?.name||''}`).join('   ')}function submitResult(){if(!chosen.length)return;socket.emit('champion:result',{placements:chosen});chosen=[]}function ranking(){return `<div class="rank">${[...G.players].sort((a,b)=>(b.score||0)-(a.score||0)).map((p,i)=>`<div class="p"><span>${i+1}. ${esc(p.name)}</span><span class="score">${p.score||0}</span></div>`).join('')}</div>`}
function finished(){const r=G.finalRanking||[...G.players].sort((a,b)=>(b.score||0)-(a.score||0));set(`<div class="hero"><div style="font-size:80px">🏆</div><h1>بطل الساحة</h1><p class="muted">انتهت البطولة</p></div><div class="card" style="margin-top:15px"><div class="podium">${r[1]?`<div class="place two"><div>🥈</div><b>${esc(r[1].name)}</b><div class="score">${r[1].score}</div></div>`:''}${r[0]?`<div class="place one"><div>🥇</div><b>${esc(r[0].name)}</b><div class="score">${r[0].score}</div></div>`:''}${r[2]?`<div class="place three"><div>🥉</div><b>${esc(r[2].name)}</b><div class="score">${r[2].score}</div></div>`:''}</div><h3>الترتيب النهائي</h3>${r.map((p,i)=>`<div class="p"><span>${i+1}. ${esc(p.name)}</span><span class="score">${p.score}</span></div>`).join('')}${host?`<button class="btn gold" style="width:100%;margin-top:15px" onclick="socket.emit('champion:restart')">🔄 بطولة جديدة بنفس اللاعبين</button>`:''}</div>`)}
function render(){if(!G)return home();host=G.hostId===me;if(G.phase==='lobby')lobby();else if(G.phase==='round')round();else finished()}
socket.on('room:created',x=>{code=x.code;token=x.sessionToken||'';me=x.playerId;host=true;location.href='/games/champion/?code='+encodeURIComponent(code)+'&sessionToken='+encodeURIComponent(token)});socket.on('joined',x=>{code=x.code;token=x.sessionToken||token;me=x.playerId;history.replaceState({},'',`/games/champion/?code=${encodeURIComponent(code)}&sessionToken=${encodeURIComponent(token)}`)});socket.on('state',s=>{if(s?.type==='champion'){G=s;host=G.hostId===me;render()}});socket.on('errorMsg',m=>alert(m));
const q=new URLSearchParams(location.search);if(q.get('code')){code=q.get('code').toUpperCase();token=q.get('sessionToken')||'';if(token)socket.emit('room:resume',{code,sessionToken:token});else set(`<div class="card"><h2>انضمام إلى بطولة</h2><input id="joinName" class="input" placeholder="اسمك"><button class="btn primary" onclick="join()">انضمام</button></div>`)}else home();
</script><script src="/shared/connection.js"></script></body></html>
