<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بطل الساحة</title><script src="/socket.io/socket.io.js"></script><script src="/shared/profile.js"></script><script src="/shared/room-lobby.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#4d3b92,#101426 45%,#06070d);color:#fff;font-family:Tahoma,Arial,sans-serif}.wrap{width:min(1050px,94vw);margin:auto;padding:18px}.card{background:rgba(12,16,29,.94);border:1px solid #333c59;border-radius:28px;padding:22px;box-shadow:0 25px 90px #0008}.hero{text-align:center;padding:35px;border-radius:28px;background:radial-gradient(circle at 50% 0,#76601d,#16182b 55%,#090b13);border:1px solid #806b2c}.hero h1{font-size:clamp(42px,8vw,76px);margin:5px}.muted{color:#aeb6ca;line-height:1.8}.code{font-size:38px;letter-spacing:8px;color:#ffd95b;font-weight:1000}.input,button{font:inherit}.input{width:100%;padding:15px;border-radius:15px;border:1px solid #3a4560;background:#080d19;color:#fff}.btn{padding:13px 18px;border:0;border-radius:15px;font-weight:1000;cursor:pointer}.primary{background:#765cff;color:#fff}.gold{background:#e6b93c;color:#201700}.dark{background:#20283d;color:#fff}.danger{background:#8c2e40;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.game{padding:16px;border:2px solid #303b59;border-radius:18px;background:#111829;cursor:pointer}.game.sel{border-color:#d8b83c;background:#302817;box-shadow:0 0 0 3px #d8b83c22}.players{display:grid;gap:9px}.p{display:flex;justify-content:space-between;align-items:center;padding:13px 15px;border-radius:14px;background:#151d30}.champPlayer{display:flex;align-items:center;gap:9px;min-width:0}.champPlayer i{width:36px;height:36px;border-radius:11px;overflow:hidden;display:grid;place-items:center;background:#26324b;font-style:normal;flex:none}.champPlayer i img{width:100%;height:100%;object-fit:cover;display:block}.champPlayer b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.score{font-size:25px;font-weight:1000;color:#ffd85c}.rank{display:grid;gap:9px}.rank .p:nth-child(1){border:1px solid #d6b447;background:#352b14}.rank .p:nth-child(2){border:1px solid #8e98aa}.rank .p:nth-child(3){border:1px solid #a47751}.podium{display:flex;align-items:end;justify-content:center;gap:10px;min-height:230px}.place{width:30%;text-align:center;padding:18px;border-radius:18px 18px 6px 6px;background:#171d2e}.place.one{height:210px;background:#443613}.place.two{height:165px}.place.three{height:130px;background:#32261e}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions>*{flex:1;min-width:140px}.notice{padding:14px;border-radius:16px;background:#11192a;border:1px solid #303b57;line-height:1.7}.small{font-size:12px;color:#9ca7bd}@media(max-width:560px){.wrap{padding:10px}.card{padding:15px;border-radius:22px}.hero{padding:25px 12px}.hero h1{font-size:45px}.code{font-size:30px}}
</style><link rel="stylesheet" href="/shared/connection.css"><link rel="stylesheet" href="/shared/arena-ui.css"></head><body><div id="app"></div><script>
const socket=io();let G=null,code='',token='',me=null,host=false;const gameNames={liar:'🕵️ مين الكذاب',bomb:'💣 المفخخة',faceoff:'⚔️ مواجهة',family:'👨‍👩‍👧‍👦 فاميلي فيود',guess:'🧠 خمنها',market:'🔨 المزاد',mafia:'🎭 مافيا',million:'👑 المليون'};const $=id=>document.getElementById(id);function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function set(h){$('app').innerHTML='<div class="wrap">'+h+'</div>'}
function create(){const n=($('name')?.value||'').trim()||'لاعب';socket.emit('room:create',{game:'champion',mode:'players',name:n});}function join(){const c=(($('joinCode')?.value||'')||code||q?.get('code')||'').trim().toUpperCase();const n=(($('joinName')?.value||'')||q?.get('name')||'').trim()||'لاعب';if(!/^H\d{3}$/.test(c))return;code=c;socket.emit('room:join',{code:c,name:n})}
function home(){set(`<div class="hero"><div style="font-size:70px">🏆</div><h1>بطل الساحة</h1><p class="muted">بطولة تجمع ألعاب الساحة في منافسة واحدة، بنقاط تراكمية ونهائي ومنصة تتويج.</p></div><div class="card" style="margin-top:15px"><h2>إنشاء بطولة</h2><input id="name" class="input" placeholder="اسمك في البطولة"><button class="btn primary" style="width:100%;margin-top:10px" onclick="create()">🏆 إنشاء البطولة</button><div style="height:12px"></div><h3>الانضمام</h3><input id="joinName" class="input" placeholder="اسمك"><input id="joinCode" class="input" maxlength="6" placeholder="كود البطولة"><button class="btn dark" style="width:100%" onclick="join()">🎮 انضمام</button></div>`)}
function lobby(){const games=G.selectedGames||[];set(`<div class="hero"><div style="font-size:55px">🏆</div><h1>بطل الساحة</h1><p class="muted">اختر الألعاب التي تريدها في البطولة. عند البدء سيتم خلط ترتيبها عشوائيًا، وكل لعبة تفتح تلقائيًا للجميع. لكل لعبة مدة/عدد جولات قصير خاص بها.</p></div><div class="card" style="margin-top:15px"><div class="top"><div><div class="code">${esc(G.code)}</div><div class="small">كود البطولة</div></div><img src="/api/qr?code=${esc(G.code)}" style="width:120px;background:#fff;padding:5px;border-radius:14px" alt="QR"></div><div class="notice" style="margin-top:12px">${host?'أنت المضيف. اختر الألعاب ثم اضغط «بدء البطولة».':'بانتظار المضيف لإعداد البطولة وبدئها.'}</div><h3>اللاعبون (${G.players.length})</h3><div class="players">${G.players.map(p=>`<div class="p"><span class="champPlayer"><i>${p.avatar?`<img src="${esc(p.avatar)}" alt="">`:'👤'}</i><b>${esc(p.name)}</b> ${p.id===G.hostId?'👑':''}</span><span>${p.online===false?'⚪ غير متصل':'🟢 جاهز'}</span></div>`).join('')}</div>${host?`<h3>ألعاب البطولة</h3><div class="grid">${Object.entries(gameNames).map(([k,v])=>`<div class="game ${games.includes(k)?'sel':''}" onclick="toggleGame('${k}')">${v}</div>`).join('')}</div><div class="notice" style="margin-top:12px">عدد الألعاب = ${games.length}. سيتم خلط ترتيبها تلقائيًا. كل لعبة داخل البطولة تستخدم حدها القصير الخاص بها؛ مثلًا فاميلي فيود = سؤالان، وخمنها/ارسمها = جولة واحدة.</div><button class="btn gold" style="width:100%;margin-top:15px" onclick="socket.emit('champion:start')" ${games.length?'':'disabled'}>▶️ بدء البطولة</button>`:''}</div>`)}
function toggleGame(k){let a=[...(G.selectedGames||[])];if(a.includes(k))a=a.filter(x=>x!==k);else{a=[...a,k]}socket.emit('champion:setGames',{games:a})}
function round(){const current=G.gameOrder?.[G.round-1]||G.selectedGames[(G.round-1)%G.selectedGames.length];const names=G.players.filter(p=>p.online!==false);set(`<div class="hero"><div style="font-size:55px">🎮</div><h1>الجولة ${G.round}</h1><p class="muted">اللعبة القادمة</p><div style="font-size:38px;font-weight:1000;color:#ffd95b">${gameNames[current]||current}</div><p class="muted">جاري تجهيز الغرفة… سيدخل جميع اللاعبين تلقائيًا.</p></div><div class="card" style="margin-top:15px"><div class="notice">لا يوجد كود مطلوب ولا يوجد دخول يدوي. بعد تجهيز اللعبة ستنتقلون إليها تلقائيًا، وبعد انتهائها تعودون هنا مع النقاط الجديدة.</div><h3>النقاط الحالية</h3>${names.map(p=>`<div class="p"><span>${esc(p.name)}</span><span class="score">${p.score||0}</span></div>`).join('')}</div>`)}
function openRoundGame(){}
let chosen=[];function pickPlace(id){if(chosen.includes(id))return;chosen.push(id);$('chosen').textContent=chosen.map((x,i)=>`${i+1}️⃣ ${G.players.find(p=>p.id===x)?.name||''}`).join('   ')}function submitResult(){if(!chosen.length)return;socket.emit('champion:result',{placements:chosen});chosen=[]}function ranking(){return `<div class="rank">${[...G.players].sort((a,b)=>(b.score||0)-(a.score||0)).map((p,i)=>`<div class="p"><span>${i+1}. ${esc(p.name)}</span><span class="score">${p.score||0}</span></div>`).join('')}</div>`}
function finished(){const r=G.finalRanking||[...G.players].sort((a,b)=>(b.score||0)-(a.score||0));set(`<div class="hero"><div style="font-size:80px">🏆</div><h1>بطل الساحة</h1><p class="muted">انتهت البطولة</p></div><div class="card" style="margin-top:15px"><div class="podium">${r[1]?`<div class="place two"><div>🥈</div><b>${esc(r[1].name)}</b><div class="score">${r[1].score}</div></div>`:''}${r[0]?`<div class="place one"><div>🥇</div><b>${esc(r[0].name)}</b><div class="score">${r[0].score}</div></div>`:''}${r[2]?`<div class="place three"><div>🥉</div><b>${esc(r[2].name)}</b><div class="score">${r[2].score}</div></div>`:''}</div><h3>الترتيب النهائي</h3>${r.map((p,i)=>`<div class="p"><span>${i+1}. ${esc(p.name)}</span><span class="score">${p.score}</span></div>`).join('')}${host?`<button class="btn gold" style="width:100%;margin-top:15px" onclick="socket.emit('champion:restart')">🔄 بطولة جديدة بنفس اللاعبين</button>`:''}</div>`)}
function render(){if(!G)return home();host=G.hostId===me;if(G.phase==='lobby')lobby();else if(G.phase==='round')round();else finished()}
socket.on('champion:enterGame',x=>{if(x?.route)location.href=x.route});socket.on('champion:return',x=>{if(x?.code)location.href='/games/champion/?code='+encodeURIComponent(x.code)+'&sessionToken='+encodeURIComponent(x.sessionToken||'')});socket.on('room:created',x=>{code=x.code;token=x.sessionToken||'';me=x.playerId;host=true;location.href='/games/champion/?code='+encodeURIComponent(code)+'&sessionToken='+encodeURIComponent(token)});socket.on('joined',x=>{code=x.code;token=x.sessionToken||token;me=x.playerId;history.replaceState({},'',`/games/champion/?code=${encodeURIComponent(code)}&sessionToken=${encodeURIComponent(token)}`)});socket.on('state',s=>{if(s?.type==='champion'){G=s;host=G.hostId===me;render()}});socket.on('errorMsg',m=>alert(m));
const q=new URLSearchParams(location.search);if(q.get('code')){code=q.get('code').toUpperCase();token=q.get('sessionToken')||'';if(token)socket.emit('room:resume',{code,sessionToken:token});else set(`<div class="card"><h2>انضمام إلى بطولة</h2><input id="joinName" class="input" placeholder="اسمك" value="${esc(q.get('name')||'')}"><button class="btn primary" onclick="join()">انضمام</button></div>`)}else home();
</script><script src="/shared/connection.js"></script></body></html>
